# ランタイム / ツールのバージョンを一元管理する SSOT。ここが持つのはバージョンの宣言だけで、
# ツールをどう実行するかは docs/rules.md の Toolchain Execution Rules が持つ。
#
# go / node / python の version は `make sync-versions` が go.mod・各 Dockerfile の
# FROM タグ・関連 README へ伝播する。短い名前で解決できないツールは backend を明示する。
#
# PyPI のツールだけはここに書かない。バージョンの宣言は python/*.in、推移依存まで含めた
# 解決結果と sha256 は python/*.txt が持つ（ADR-0084）。
min_version = "2026.6.0"

[tools]
# 言語ランタイム。make tool-cooldown-* の検査対象から意図的に外してあり（ADR-0095）、
# 昇格の判断は LTS を待つ方針が担う。
go = "1.27.1"
node = "24.19.0"
python = "3.14.7"

# Go ベース（標準レジストリで解決可）
oapi-codegen = "2.8.0"
sqlc = "1.31.1"
golangci-lint = "2.13.1"
actionlint = "1.7.12"
# actionlint が run スクリプトを検査するために PATH 上で参照する（同梱ではなく別バイナリ）
shellcheck = "0.11.0"
lefthook = "2.1.10"
air = "1.67.4"
golines = "0.13.0"
gofumpt = "0.11.0"
hadolint = "2.15.1"
gitleaks = "8.30.1"

# Go ベース（backend 明示）
"aqua:golang-migrate/migrate" = "4.19.1"
"go:go.uber.org/mock/mockgen" = "0.6.0"
# aqua ではなく go backend を使うのは、上流がプリビルドバイナリを一部のタグでしか公開せず
# （v1.26.2 / v1.26.3 には資産があり v1.26.0 / v1.26.1 / v1.27.x には無い）、リリース資産に
# 依存する backend では版の選択が上流の公開都合に握られるため。go install が上流の正規経路。
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.1"
# 最新は v0.75.0 系ではなく v0.74.0 が窓を満たす最新。
"aqua:aquasecurity/trivy" = "0.74.0"
"aqua:google/osv-scanner" = "2.5.1"
# 最新は v0.118.0 だが公開 6 日でクールダウン 14 日に満たないため 1 つ前を採る。
"aqua:anchore/grype" = "0.117.0"
# 最新は v2.1.1 だが公開 10 日でクールダウン 14 日に満たないため 1 つ前を採る。
"aqua:Bearer/bearer" = "2.1.0"
# 最新は v3.97.3 だが公開 0 日でクールダウン 14 日に満たないため、窓を満たす最新を採る。
"aqua:trufflesecurity/trufflehog" = "3.97.0"
# v0.4.15 が最新。以降リリースが無いだけで、これがクールダウンを満たす最新版である。
"aqua:goodwithtech/dockle" = "0.4.15"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
"go:github.com/cweill/gotests/gotests" = "1.9.0"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:github.com/josharian/impl" = "1.5.0"
"go:golang.org/x/tools/cmd/godoc" = "0.1.0-deprecated"
"go:codeberg.org/tslocum/godoc-static" = "1.0.1"
# 最新は v0.3.3 だが公開 9 日でクールダウン 14 日に満たないため 1 つ前を採る。
"go:github.com/google/capslock/cmd/capslock" = "0.3.3"

# Rust ベース（標準レジストリで解決可）
# エージェントの Bash 出力を圧縮するトークンプロキシ。make target が呼ぶのではなく
# アシスタントのフックが host で直接呼ぶ点が、ここの他の宣言と違う。
# 最新は v0.48.0 だが公開 4 日でクールダウン 14 日に満たないため、窓を満たす最新を採る。
rtk = "0.45.0"

# Rust ベース（backend 明示）
# 最新は v1.30.0 だが公開 3 日でクールダウン 14 日に満たないため 1 つ前を採る。
"aqua:zizmorcore/zizmor" = "1.29.0"

# OCaml ベース（backend 明示）
# 最新は v1.29.0 だが公開 6 日でクールダウン 14 日に満たないため、窓を満たす最新を採る。
"aqua:opengrep/opengrep" = "1.27.1"

# Node ベース
# 最新は 2.51.1 だが公開 0 日でクールダウン 7 日に満たないため、窓を満たす最新を採る。
"npm:@redocly/cli" = "2.49.0"
# fastq@1.20.2 は maintainer が手動 publish した版で provenance が無く、aube の trust policy（no-downgrade）が
# 推移依存の解決を拒む。6 時間後の 1.20.3 は trusted workflow から出ており、改竄の兆候は無い。例外はこの 1 版に限る。
"npm:markdownlint-cli2" = { version = "0.23.2", trust_policy_excludes = ["fastq@1.20.2"] }
"npm:@commitlint/cli" = "21.2.2"
# docs-viewer（ドキュメントポータルのビューアー）の依存解決に使う。aqua backend ではなく
# npm backend を指定するのは、pnpm の公開元が npm レジストリであり、cooldown の窓を
# レジストリ側（7 日）で測るのが実態に合うため。
# 最新は 12.0.0 だが major 跨ぎのため 11 系に留める。11 系の最新 11.25.0 は公開 5 日で
# クールダウン 7 日に満たないため、窓を満たす 11.24.0 を採る。
"npm:pnpm" = "11.24.0"

# Python ベース
# 最新は 0.12.9 だが公開 1 日でクールダウン 14 日に満たないため、窓を満たす最新を採る。
# 下限は 0.12.2。CPython 3.14.7 の配布物を知るのがこの版からで、これより古いと
# sql-lint がホストで走らせる uv venv が宣言中の python を解決できない。
uv = "0.12.5"
# Python 実装だが実行環境を同梱した単体バイナリで配布されるため、python/*.in ではなく
# aqua backend で入れる。
# 最新は 3.3.16 だが公開 3 日でクールダウン 14 日に満たないため、窓を満たす最新を採る。
"aqua:bridgecrewio/checkov" = "3.3.12"

# Docker イメージのバージョン。[tools] は mise の解決対象専用のため [env] で宣言する。
[env]
# 最新は 0.30.2 だが公開 5 日でクールダウン 14 日に満たないため 1 つ前を採る。
OTEL_LGTM_VERSION = "0.30.0"
