sonar.projectKey=Tomy-ch_go-boilerplate
sonar.organization=tomy-ch
sonar.projectName=go-boilerplate

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/src/generated/**,\
  **/*.gen.go,\
  **/*.sql.go,\
  **/*_mock.go,\
  **/openapi.gen.yaml,\
  docs/**,\
  graphify-out/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts

# Coverage is enforced by the Go and TypeScript test workflows, each of which owns its own
# threshold. SonarQube receives no coverage reports, so exclude coverage from its quality gate
# while keeping every source file in the static-analysis and duplication scopes.
sonar.coverage.exclusions=**/*

# seed は同じ形の INSERT を並べたデータで、行が似ているのは重複ではなく形式である。重複検出だけを
# 外すのは、sonar.exclusions へ入れると解析ごと落ちて他の観点まで失うため（下のルール単位除外と
# 同じ理由）。データ以外は対象に残す。
# migrations も master data の INSERT と定型の DDL を並べた記録で、重なるのは同じく形式である。
# master data を持つテーブルが増えるたびに 1 ファイルずつ足すことになるため、ディレクトリ単位で外す。
# database/gen は DML の連結生成物で、元の SQL と同一内容になるため重複検出だけを外す。
# sample-api:replace-begin
# 以下の各段落と exclusions のサンプル由来パスは、サンプル API と生死を共にする。
# select_products は First / After と昇順 / 降順を sqlc の別クエリとして保持するため、共通する
# 検索条件が意図的に重なる。クエリの契約はそれぞれ異なるため、このファイルだけ重複検出から外す。
# select_purchases_feed も同じ形で、First / After を sqlc の別クエリとして保持する。この形は
# internal/infrastructure/rdb/repository/README.md の Keyset pagination が要求するもので
# （1 本へ畳むと入力によって実行計画が変わる文になる）、重なる述語は畳めない。
# select_all_purchases_feed は select_purchases_feed の所有権で閉じない版で、同じ First / After の
# 2 本を持つ。加えて所有権で閉じる版との間でも期間・ステータスの絞り込み節が重なるが、これは
# 「母集団の差は所有権フィルタだけ」を保証するために逐語的に同一へ保っている結果であり、畳むと
# その保証が消える。所有権で閉じないクエリを別名で持つこと自体が、認可を経ない経路を作らないための
# 構造であって、1 本へ畳めば user_id の省略可能な述語になり構造が消える。
# select_all_products は select_products の未公開込み版で、同じ First / After × 昇順 / 降順の
# 4 本を持つ。加えて公開済み版との間でも絞り込み節が重なるが、これは「母集団の差は公開状態だけ」
# を保証するために逐語的に同一へ保っている結果であり、畳むとその保証が消える。count_product が
# 持つ公開済み版と未公開込み版の対も同じ理由で重なる。
# language-manifest.ts は撤去の宣言台帳で、1 エントリが「ファイル・置換前・置換後」の同じ形を
# 取る。重なるのはその形式であって判断ではない。まとめる抽象（両環境を 1 行で書く等）は入れられる
# が、そうすると「どちらの AI 環境に対する宣言か」が読み取れなくなり、完全一致で照合する台帳と
# しての性質を損なう。行の重複だけを外し、静的解析の他の観点は対象に残す。
# product_repository.go の FindAllList は FindPublishedList と同じ 4 分岐を持つ。sqlc がクエリ
# ごとに別の params 型を生成するため、同じフィールド名の構造体リテラルを型の数だけ書くことになり、
# Go 側では畳めない。重なるのは SQL 由来の形であって実装の判断ではない。
# purchase/status は product/status と同じ参照マスタの原型で、4 層とも同型になる。サンプルは
# 各々が単独で読めることが要件であり、共通化すると 1 つの機能を追うのに 2 箇所を往復させる。
# 重なるのは原型であって判断ではない。
# v1/coupons は保有一覧の Presenter（toCouponResponse / toPrimitivePtr）を逐語で複製する。
# internal/controller/handler/README.md が Presenter を package 間で共有しないことを要件として
# 定めており、同じ Usecase DTO を同じコードで変換する package が複数あることを意図した重複と
# 宣言している。畳むと要件そのものを破るため、重複検出だけを外す。
sonar.cpd.exclusions=scripts/setup/remove-doc-language/language-manifest.ts,database/seed/**,database/migrations/**,database/gen/**,database/dml/repository/product/select_products.sql,database/dml/repository/product/select_all_products.sql,database/dml/repository/product/count_product.sql,database/dml/query_service/purchase/select_purchases_feed.sql,database/dml/query_service/purchase/select_all_purchases_feed.sql,internal/controller/handler/v1/carts/items/**,internal/controller/handler/v1/coupons/**,internal/infrastructure/rdb/repository/product/product_repository.go,internal/domain/purchase/status/**,internal/usecase/purchase/status/**,internal/infrastructure/rdb/repository/purchasestatus/**,internal/controller/handler/v1/purchases/statuses/**
# sample-api:replace-with
# = sonar.cpd.exclusions=scripts/setup/remove-doc-language/language-manifest.ts,database/seed/**,database/migrations/**,database/gen/**
# sample-api:replace-end

# ----- ルール単位の除外 -----
# パス単位ではなくルール単位で落とす。Dockerfile ごと除外すると、検証なしのダウンロード実行
# (S8482) のようにこのリポジトリで唯一 Sonar だけが見ている観点まで一緒に失われる。
sonar.issue.ignore.multicriteria=s6505docker,s6505actions,s8431,s6471docker,s1192dml,s1192gen,s1192seed,s4036goscripts,s4036gocli,s4036ts,s8196usecase,s8264workflows,s8767css,s8776css,s2871scripts,s4158marker,a11ygroupds,a11yclickds,a11ylistenerds,s6671mount,s5976scripts

# 似たテストを 1 つのパラメータ化テストへまとめよという指摘。このリポジトリのテスト規約は
# 逆を定めており、`scaffold-test` のハードルールが table-driven の `for` ループを違反として
# 扱う（`test-review` の構造準拠レンズがそれを検査する）。1 ケース 1 `it` にしているのは、
# 落ちたときにどの入力が壊れたかを名前だけで言えるようにするためで、まとめると失敗の所在が
# データ表の添字になる。規約と指摘のどちらかしか選べないため、規約を採る。
sonar.issue.ignore.multicriteria.s5976scripts.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.s5976scripts.resourceKey=scripts/**

# 依存ライフサイクルスクリプトは各 pnpm-workspace.yaml の strictDepBuilds + allowBuilds が
# 制御し、宣言に無い依存が script を持ち込んだ時点で install を失敗させる。--ignore-scripts は
# その失敗を消してスクリプトを黙って飛ばすため、この指摘に従うと検知が無くなる。
sonar.issue.ignore.multicriteria.s6505docker.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.s6505docker.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.s6505actions.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.s6505actions.resourceKey=.github/workflows/*.yaml

# tag と digest の併記は docker/images-pin.toml の固定形式そのもので、make pin-images-check が
# その対応を照合する。どちらか片方に寄せると照合対象が消える。
sonar.issue.ignore.multicriteria.s8431.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.s8431.resourceKey=**/Dockerfile

# tool-runner と開発用ホットリロードの段は root 実行が要件で、mise を /root 配下へ置く構成と
# bind mount した作業ツリーへの書き込みがそれに依存する。resourceKey はパス単位でしか書けず、
# Dockerfile のパーサーは NOSONAR を解さないため、段だけを外す書き方が無い。ファイル単位で外す。
# runtime 段の root 実行そのものは hadolint の DL3066 と checkov の CKV_DOCKER_3 が引き続き見ており、
# この除外で失う観点は無い。
sonar.issue.ignore.multicriteria.s6471docker.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.s6471docker.resourceKey=**/Dockerfile

# 省略可能な絞り込みは sqlc の narg 名を「NULL 判定」と「条件本体」の双方へ書くため、1 条件につき
# 名前が最低 2 回、クエリを分岐させれば分岐の数だけ重なる。この名前は sqlc が生成する引数の識別子で
# あって値ではなく、SQL 側に括り出せる定数の宣言先が無い。特定の 1 ファイルの事情ではなく narg の
# 書き方そのものに由来するため、ディレクトリ単位で外す。上の cpd.exclusions と対象が重なっても
# 検出ルールが別なので、両方要る。
# database/gen は DML の連結生成物で同じ指摘がそのまま重複して出るため、重複の是非は連結元の
# DML 側だけで判断する。
sonar.issue.ignore.multicriteria.s1192dml.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.s1192dml.resourceKey=database/dml/**
sonar.issue.ignore.multicriteria.s1192gen.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.s1192gen.resourceKey=database/gen/**

# seed は同じ形の INSERT を並べたデータで、重なるのは UUID・区分値・INTERVAL の文字列そのもの
# である。上の cpd.exclusions が外すのは行の重複で、こちらは 1 つのリテラルの再出現なので検出
# ルールが別であり、両方要る。SQL のリテラルは値であって識別子ではなく、定数として宣言する先が
# seed には無い（宣言できるなら database/dml と同じく生成コードの引数になっている）。
sonar.issue.ignore.multicriteria.s1192seed.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.s1192seed.resourceKey=database/seed/**

# git / make をパス名で起動する箇所。絶対パスへ書き換えると mise・Docker・macOS・CI ランナーで
# 解決先が違うため、環境ごとに壊れるほうへ倒れる。当たるのは開発用の道具（scripts/ と db-slot の
# 解決）だけで、いずれもリポジトリの作業ツリー上でしか動かず、PATH は起動した開発者か runner の
# ものである。アプリケーションが外部コマンドを起動する箇所は無く、増えれば別のパスとして出る。
sonar.issue.ignore.multicriteria.s4036goscripts.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.s4036goscripts.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.s4036gocli.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.s4036gocli.resourceKey=internal/cli/**
sonar.issue.ignore.multicriteria.s4036ts.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.s4036ts.resourceKey=scripts/**

# 単一メソッドのインターフェースを動作の名前（-er）へ改名せよという指摘。この層の
# インターフェース名は internal/usecase/README.md が Usecase に定めており、ハンドラは
# <feature>.Usecase を受け取る形で揃っている。1 つだけ改名すると、メソッドが 1 本か 2 本かで
# 名前の付け方が変わることになる。
sonar.issue.ignore.multicriteria.s8196usecase.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.s8196usecase.resourceKey=internal/usecase/**

# workflow 直下の permissions を job へ移せという指摘。ここでの workflow 直下の宣言は既定を
# 締める側で、job が自前の permissions を書き忘れたときに GITHUB_TOKEN の既定権限ではなく
# contents: read へ落ちる。移すと、その落とし先が消える。
sonar.issue.ignore.multicriteria.s8264workflows.ruleKey=githubactions:S8264
sonar.issue.ignore.multicriteria.s8264workflows.resourceKey=.github/workflows/*.yaml

# Tailwind CSS v4 の at-rule（@utility / @custom-variant / @slot / @source）を Sonar の CSS
# パーサが解さないことによる指摘。@utility は未知の at-rule として読まれるため、その中で
# @media や @supports に入れた宣言が「宣言の位置が不正」に、@custom-variant の中の @slot が
# 「スコープの根が無い」になる。どちらも当たっているのは Tailwind が展開する前の記法で、
# 展開後の CSS には現れない。この構文を実際に検証しているのは Biome で、docs-viewer は
# その指摘には biome-ignore で個別に応答している。
sonar.issue.ignore.multicriteria.s8767css.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.s8767css.resourceKey=docs-viewer/src/**
sonar.issue.ignore.multicriteria.s8776css.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.s8776css.resourceKey=docs-viewer/src/**

# 比較関数を渡さない sort。ここで並べているのは全て文字列で、既定の並びは UTF-16 の符号単位順、
# つまり実行環境に依らず同じ結果になる。指摘が薦める localeCompare はロケール依存で、違反の
# 出力順が環境ごとに揺れると CI の失敗差分が読めなくなる（scripts/lib/workflow.ts の並びを
# 固定している理由そのもの）。数値配列に対する既定の並びは文字列化されるため本来の対象だが、
# このワークスペースにその形は無い。
sonar.issue.ignore.multicriteria.s2871scripts.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.s2871scripts.resourceKey=scripts/**

# 「常に空なので使い道が無い」という指摘。MARKER_LITERAL_FILES はマーカーの形を本文へ書いた
# ファイルの登録先で、空であることが「まだ 1 つも無い」を意味する。消すと、次にコメントで
# マーカーを例示した人が登録先を失い、対応の取れない片割れとして除去全体が止まる。
sonar.issue.ignore.multicriteria.s4158marker.ruleKey=typescript:S4158
sonar.issue.ignore.multicriteria.s4158marker.resourceKey=scripts/setup/**

# design-system 配下のアクセシビリティ指摘。role="group" を使うか、pointer 専用の補助に
# キーボード操作を足すかは、当たっている行に biome-ignore で理由と一緒に記録済みの判断で、
# fieldset は legend を伴う複数 control の集合を表すため意味論が違う、というのがその中身である。
# コードを変えると記録された判断と食い違うため、ここで外す。design-system の外は対象に残す。
sonar.issue.ignore.multicriteria.a11ygroupds.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.a11ygroupds.resourceKey=docs-viewer/src/components/design-system/**
sonar.issue.ignore.multicriteria.a11yclickds.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.a11yclickds.resourceKey=docs-viewer/src/components/design-system/**
sonar.issue.ignore.multicriteria.a11ylistenerds.ruleKey=typescript:S6847
sonar.issue.ignore.multicriteria.a11ylistenerds.resourceKey=docs-viewer/src/components/design-system/**

# Promise の reject に Error 以外を渡すなという指摘。当たっているのは「Error でない値が投げ
# られても原因を画面へ残す」ことを確かめるテストで、Error 以外を渡すこと自体が検証対象である。
sonar.issue.ignore.multicriteria.s6671mount.ruleKey=typescript:S6671
sonar.issue.ignore.multicriteria.s6671mount.resourceKey=docs-viewer/src/mount/mount-portal.test.tsx
