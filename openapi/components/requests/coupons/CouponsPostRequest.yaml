type: object
description: |
  クーポン発行のリクエスト（application/json）。admin のみ実行できます（非 admin は 403）。
  受給者・値引き・適用範囲・有効期限を指定すると、その利用者へクーポンが 1 枚発行されます。
  **受給者は 1 人だけです。** 不特定多数への配布は別の操作（POST /v1/coupons/bulk-issue）です。
additionalProperties: false
required:
  - userId
  - discount
  - scope
  - expiresAt
properties:
  userId:
    type: string
    format: uuid
    description: >-
      受給者の利用者 ID。退会していない利用者に限ります。存在しない、または退会済みの ID を
      指定した場合は 404 を返します。受給者は発行時に確定し、以後移りません。
    example: "0193a1c0-0000-7000-8000-000000000001"
  discount:
    $ref: '../../schemas/coupons/CouponDiscountInput.yaml'
  scope:
    $ref: '../../schemas/coupons/CouponScopeInput.yaml'
  expiresAt:
    type: string
    format: date-time
    description: >-
      発行するクーポンの有効期限。締切を名指しする操作なので、日数ではなく絶対時刻で受け取ります。
      現在時刻以前を指定した場合は、発行した瞬間に失効するクーポンになるため 422 を返します。
    example: "2026-12-31T14:59:59Z"
  minPurchaseAmount:
    type: integer
    format: int64
    nullable: true
    description: >-
      発行するクーポンを使うために必要な購入額の下限。USD セント単位の整数です。任意で、
      省略または null なら購入額を問わず使えます。0 以下を指定した場合は 422 を返します。
    example: 5000
  usableFrom:
    type: string
    format: date-time
    nullable: true
    description: >-
      発行するクーポンが使えるようになる日時。任意で、省略または null なら発行した時点から使えます。
      有効期限（expiresAt）以降を指定した場合は、一度も使えないクーポンになるため 422 を返します。
    example: "2026-10-01T00:00:00Z"
