name: Idempotency-Key
in: header
description: |
  冪等キー。同一 (認証主体, キー) の再送を初回結果のリプレイとして扱う。
  このヘッダを宣言する操作は、ハンドラが必ず idempotency.Run 経由で処理する契約（完全性テストで機械検証）。

  **この操作では必須です。** 分かれ目は重複が収束するかどうかではなく、重複や取り違えが
  取り消せない金銭的価値として外へ出るかどうかです。クーポンを生む経路（発行・一括発行・
  キャンペーンの定義と受け取り）はこれに当たるため一律で必須にし、配り終えたクーポンを回収する
  経路は持ちません。キーが任意の操作では、二度目が弾かれるか（同じ主体の二度目の登録は 409、
  廃番済みの商品は再度廃番にならない）、事後に取り消せるか（購入はキャンセルできる）、重複が
  残っても新たな価値を生みません（問い合わせメッセージの追記）。
required: true
schema:
  type: string
  pattern: '^[\x21-\x7E]+$'
  minLength: 1
  maxLength: 255
example: "3f0c2d21-6c1e-4a2f-9f8b-4b1e7f0a2c11"
