  /v1/exchange-rates:
    get:
      operationId: GetExchangeRates
      tags:
        - v1/exchange-rates
      summary: 為替レートで金額を換算します。
      description: |
        base 通貨建ての original を quote 通貨へ換算した結果を返します。
        外部の為替レートサービスを gateway（DTO モード）経由で利用するサンプルエンドポイントです。
      security: []
      parameters:
        - name: base
          in: query
          required: true
          description: 換算元の通貨コード
          schema:
            type: string
            example: USD
        - name: quote
          in: query
          required: true
          description: 換算先の通貨コード
          schema:
            type: string
            example: JPY
        - name: original
          in: query
          required: true
          description: |
            換算する金額（base 通貨建て）。正確な十進量を保つため decimal 文字列で受け付けます。
            JSON number は IEEE754 double として復元され精度を失うため、金額・レート経路では文字列で表現します。
          schema:
            type: string
            maxLength: 40
            pattern: ^\d{1,20}(\.\d{1,18})?$
            example: '100'
        - name: displayCurrency
          in: query
          required: false
          description: |
            指定時のみ、その通貨での参考換算額を referenceAmount として返します（非永続）。
            現状は JPY のみサポートします。
          schema:
            type: string
            enum:
              - JPY
            example: JPY
      responses:
        '200':
          description: 換算結果を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
