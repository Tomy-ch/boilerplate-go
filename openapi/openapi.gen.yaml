    PurchaseSubGroupResponse:
      type: object
      description: |
        グループ化した購入集計の下位ノード（groupBy の 2 番目の単位）。これ以上の階層は持ちません。
        マップのキーはグループ化単位の識別子（category はカテゴリ名称、product は商品 ID）で、
        表示名は常に name で返すため、キーの形に関わらず name をそのまま表示できます。
      required:
        - name
        - itemsTotal
      properties:
        name:
          type: string
          description: グループの表示名（カテゴリ名称・商品名称）
          example: ASUS Zenbook 14 OLED
        itemsTotal:
          type: string
          description: |
            当該グループの明細金額の合計（単価 × 数量の総和）。税額・送料は明細に按分できないため含みません。
            価格スケール（USD ドルの正確な decimal）を文字列で表現します。決済スケール（セント整数）へは
            丸めません（丸めは決済確定の 1 箇所のみ）。
          example: '800.00'
    PurchaseGroupResponse:
      type: object
      description: |
        グループ化した購入集計の最上位ノード（groupBy の 1 番目の単位）。groupBy に 2 番目の単位が
        指定されている場合のみ groups に下位ノードを持ちます。階層はグループ化単位の上限（2）と同じ深さで、
        再帰はしません。マップのキーはグループ化単位の識別子（category はカテゴリ名称、product は商品 ID）で、
        表示名は常に name で返すため、キーの形に関わらず name をそのまま表示できます。
      required:
        - name
        - itemsTotal
      properties:
        name:
          type: string
          description: グループの表示名（カテゴリ名称・商品名称）
          example: 電子機器
        itemsTotal:
          type: string
          description: |
            当該グループの明細金額の合計（単価 × 数量の総和）。税額・送料は明細に按分できないため含みません。
            価格スケール（USD ドルの正確な decimal）を文字列で表現します。決済スケール（セント整数）へは
            丸めません（丸めは決済確定の 1 箇所のみ）。下位グループを持つ場合、その itemsTotal の総和と正確に一致します。
          example: '1200.50'
        groups:
          type: object
          description: |
            下位のグループ化単位ごとのノード。groupBy に 2 番目の単位が指定されている場合のみ含みます。
            キーはグループ化単位の識別子（category はカテゴリ名称、product は商品 ID）です。
          additionalProperties:
            $ref: '#/components/schemas/PurchaseSubGroupResponse'
    RoleRef:
      type: object
      description: |
        ユーザーに割り当てられたロール（コードと名称）。code は分岐に用いる機械可読な安定キー、
        name は表示用の名称です。ロールの追加は code の enum 拡張として表れます。
      required:
        - code
        - name
      properties:
        code:
          type: string
          description: |
            ロールの安定コード。永続化されたロールコードに 1:1 で対応し、表示名の変更では変わりません。
            クライアントの権限分岐はこの値で行います。
          enum:
            - admin
            - general
          example: admin
        name:
          type: string
          description: ロール名。表示専用であり、分岐の判定には用いません。
          example: 管理者
          maxLength: 100
    UserRolesResponse:
      description: |
        認証ユーザー自身に割り当てられたロールのレスポンススキーマ。
        クライアントの楽観的な権限分岐（導線の出し分け）を用途とし、確定的な認可判断はサーバー側が行います。
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          description: 認証ユーザー自身に割り当てられた全ロール。ロールが 1 つも割り当てられていない場合は空配列です。
          items:
            $ref: '#/components/schemas/RoleRef'
    CouponDiscount:
      type: object
      description: |
        クーポンの値引き。いくら引くかを表します。適用範囲（どの明細が対象か）とは独立した軸です。
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - flat
            - rate
          description: |
            値引きの決まり方。`flat` は金額を直接差し引く定額、`rate` は対象額に率を掛ける定率です。
          example: rate
        value:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: |
            種別における値。定額なら差し引く金額、定率なら対象額に掛ける率を、
            正確な十進量を保つ decimal 文字列で表します（例 `"0.10"` は 10% 引き）。
            JSON number は IEEE754 double として復元され精度を失うため、文字列で表現します。
          example: '0.10'
    CouponScope:
      type: object
      description: |
        クーポンの適用範囲。どの明細が対象かを表します。値引き（いくら引くか）とは独立した軸です。
      required:
        - kind
        - targetId
      properties:
        kind:
          type: string
          enum:
            - all
            - category
            - product
          description: |
            適用範囲の決まり方。`all` は対象を絞らない全体、`category` は特定の商品カテゴリに属する明細だけ、
            `product` は特定の商品の明細だけを対象とします。
          example: category
        targetId:
          type: string
          format: uuid
          nullable: true
          description: |
            範囲を絞る対象の識別子。`category` なら商品カテゴリID、`product` なら商品IDです。
            `all` では対象を持たないため null になります。
          example: 5dd52d84-78eb-4a52-ba0b-2e11c95c2af2
    CouponResponse:
      type: object
      description: |
        クーポン。値引きと適用範囲という直交する 2 つの軸を持ちます。
        1 枚のクーポンは 1 つの値引きと 1 つの適用範囲を持ち、複数枚の併用も複数範囲の合成も表しません。
      required:
        - id
        - discount
        - scope
        - expiresAt
        - usedAt
        - issuedAt
      properties:
        id:
          type: string
          format: uuid
          description: クーポンID
          example: 0193a1c0-0001-7000-8000-000000000002
        discount:
          $ref: '#/components/schemas/CouponDiscount'
        scope:
          $ref: '#/components/schemas/CouponScope'
        expiresAt:
          type: string
          format: date-time
          description: |
            有効期限。この時刻ちょうどを含めて以降は失効として扱います。
            失効を一括更新する機構は持たず、判定のたびに現在時刻と突き合わせます。
          example: '2026-10-01T00:00:00Z'
        usedAt:
          type: string
          format: date-time
          nullable: true
          description: 使用日時。未使用の場合は null です。使用済みへの遷移は一度きりで取り消せません。
          example: null
        issuedAt:
          type: string
          format: date-time
          description: 発行日時
          example: '2026-09-01T00:00:00Z'
    CouponListResponse:
      type: object
      description: |
        保有クーポンの一覧。使用済み・失効済みも並びます。「使えるもの」ではなく「持っているもの」を返す口です。
        発行日時の新しい順で、ページングは持ちません。
      required:
        - coupons
      properties:
        coupons:
          type: array
          description: 保有クーポンの配列。1 枚も持たない場合は空配列です。
          items:
            $ref: '#/components/schemas/CouponResponse'
    UsersSearchResponseItem:
