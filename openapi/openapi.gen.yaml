        何をどれだけ補償するかが業務の判断であり、この API はその判断を実行するだけだからです。
        **楽観ロックのバージョンは受け取りません。** 廃番は属性の書き換えではなく命令であり、実行の可否は
        商品の現在値ではなく進行中の購入の有無で決まります。そのため 409 は「進行中の購入がある」の一義です。
      additionalProperties: false
      required:
        - couponDiscountRate
        - couponValidityDays
      properties:
        couponDiscountRate:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: 代替クーポンの値引き率。対象額に掛ける乗数を、正確な十進量を保つ decimal 文字列で表します （例 "0.10" は 10% 引き）。0 より大きく 1 以下である必要があり、範囲外は 422 を返します。 JSON number は IEEE754 double として復元され精度を失うため、文字列で表現します。
          example: '0.10'
        couponValidityDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: 代替クーポンの有効期間（日数）。発行日時からこの日数だけ有効です。 上限 365 は placeholder で、実要件が立った時点で改めます。
          example: 30
    ProductDiscontinueResponse:
      type: object
      description: |
        商品廃番の実行結果。何が起きたかを件数で返します。
        affectedCartCount と affectedUserCount は一致しません。カートは所有者が確定していなくても持てるため、
        ゲストのカートは影響を受けますがクーポンの受給者にはなりません。退会済みユーザーも対象外です。
      required:
        - discontinuedAt
        - affectedCartCount
        - affectedUserCount
        - issuedCouponCount
      properties:
        discontinuedAt:
          type: string
          format: date-time
          description: 廃番が確定した日時。サーバーの時刻で決まるため、要求では指定できません。
          example: '2026-09-05T00:00:00Z'
        affectedCartCount:
          type: integer
          format: int64
          description: この実行で影響を受けたカートの件数。所有者が確定していないゲストのカートも含みます。 明細は取り除かれず、以降の取得で discontinued の issue が立ちます。
          example: 12
        affectedUserCount:
          type: integer
          format: int64
          description: この実行でクーポンの受給対象になった確定済みユーザーの数。ゲストのカートと退会済みユーザーは 含みません。そのため affectedCartCount 以下になります。
          example: 9
        issuedCouponCount:
          type: integer
          format: int64
          description: この実行で発行したクーポンの枚数。受給者 1 人につき 1 枚です。 既に廃番の商品への再実行では新たな発行を行わないため 0 になります（過去の発行実績ではありません）。
          example: 9
    ProductDiscontinueImpactResponse:
      type: object
      description: |
        商品を廃番にしたときの影響の見積もり。押す前に規模を見せるための読み取りです。
        **行をロックしないため、返した瞬間から古くなります。** 実行時の件数がこれと一致する保証はなく、
        実際に何が起きたかは実行の応答が返します。
        affectedCartCount と affectedUserCount が一致しないのは実行時と同じ理由で、ゲストのカートは
        影響を受けますがクーポンの受給者にはならないためです。
      required:
        - affectedCartCount
        - affectedUserCount
        - inProgressPurchaseCount
      properties:
        affectedCartCount:
          type: integer
          format: int64
          description: この商品の明細を持つカートの件数。所有者が確定していないゲストのカートも含みます。
          example: 12
        affectedUserCount:
          type: integer
          format: int64
          description: クーポンの受給対象になる確定済みユーザーの数。ゲストのカートと退会済みユーザーは含みません。 そのため affectedCartCount 以下になります。
          example: 9
        inProgressPurchaseCount:
          type: integer
          format: int64
          description: この商品を含む進行中の購入の件数。1 件でもあれば廃番は 409 で拒まれます。 どの購入かは GET /v1/purchases に productId を指定して辿れます。
          example: 2
    ProductStockPatchRequest:
      type: object
      description: |
        商品在庫の補充リクエスト（application/json）。admin のみ実行できます（非 admin は 403）。
        delta は符号付きで、正の値で在庫を補充し、負の値で在庫を差し引きます。
        増減後の在庫が保持できる範囲（0 以上、32bit 整数の上限以下）を外れる要求は業務不変条件違反として 422 を返します。
        在庫は相対値で更新するため、同一商品への並行更新は失われず合成されます。
      additionalProperties: false
      required:
        - delta
      properties:
        delta:
          type: integer
          format: int32
          description: 在庫の増減量。正の値で補充、負の値で差し引きます。 増減後の在庫が保持できる範囲（0 以上、32bit 整数の上限以下）を外れる場合は 422 を返します。
          example: 50
    ProductImagePostRequest:
      type: object
      description: |
        商品画像アップロードリクエスト（multipart/form-data）。画像ファイルを 1 件受け取ります。
        対応形式は png / jpeg / webp、サイズ上限は OBJECT_STORAGE_MAX_UPLOAD_BYTES です（超過は 413、非対応形式は 415）。
      additionalProperties: false
      required:
        - image
      properties:
        image:
          type: string
          format: binary
          description: アップロードする画像ファイル（png / jpeg / webp）。
    ReferenceAmount:
      type: object
      nullable: true
      description: |
        表示通貨での参考換算額です。`displayCurrency` 指定時のみ算出し、非永続で返します。
        保存値はあくまで USD セント整数であり、本フィールドは参考表示専用です。
        レート取得に失敗した場合は degrade として null を返します。
      required:
        - currency
        - amount
        - rate
        - rateDate
      properties:
        currency:
          type: string
          description: 参考換算額の通貨コード
          example: JPY
        amount:
          type: integer
          format: int64
          description: 参考換算額。通貨の最小単位（JPY は円）の丸め後整数です。
          example: 15050
        rate:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: 換算に用いたレート（base 1 単位あたりの表示通貨換算値）。正確な十進量を保つため decimal 文字列で表します。
          example: '150.5'
        rateDate:
          type: string
          description: レートの基準日（外部レートサービスの公表日）
          example: '2026-07-21'
    ExchangeRateResponse:
      type: object
      description: 為替換算結果のレスポンスです。
      required:
        - base
        - quote
        - original
        - converted
        - referenceAmount
      properties:
        base:
          type: string
          description: 換算元の通貨コード
          example: USD
        quote:
          type: string
          description: 換算先の通貨コード
          example: JPY
        original:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: 換算元の金額。正確な十進量を保つため decimal 文字列で表します。
          example: '100'
        converted:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 換算後の金額。正確な十進量を保つため decimal 文字列で表します。
          example: '15050'
        referenceAmount:
          $ref: '#/components/schemas/ReferenceAmount'
    AddressCandidatesResponse:
      type: object
      description: |
        郵便番号 lookup による住所候補のレスポンスです。
        外部 lookup サービスの障害時は 503 ではなく `candidates: []` + `isFallback: true` で degrade し、
        登録フローを止めません（外部が落ちても縦一本のジャーニーを進めるためのフォールバック）。
      required:
        - candidates
        - isFallback
      properties:
        candidates:
          type: array
          description: 住所候補の一覧。該当なし・degrade 時は空配列。
          items:
            $ref: '#/components/schemas/AddressCandidate'
        isFallback:
          type: boolean
          description: |
            lookup 機構が機能しなかった（外部不通・不正応答）場合に true。true のときフロントは全項目手入力へ倒します。
            正常応答で候補が 0 件（該当なし）の場合や、候補はあるが県名解決に失敗した場合は false です。
          example: false
    PurchasesPostRequest:
      type: object
      description: |
        購入作成リクエスト。明細（商品IDと数量）の配列を受け取ります。
        明細は 1 件以上必須で、同一 productId の重複は許可しません（いずれも 422）。
        クーポンを 1 枚まで適用できます。併用はできません。
      additionalProperties: false
      required:
        - details
      properties:
        details:
          type: array
          description: |
            購入明細の配列。1 件以上必須で、同一 productId の重複は不可です。
            空配列・重複はドメインで検証し 422 を返します（スキーマでは制約せず単一の検証責務に集約）。
          items:
            $ref: '#/components/schemas/PurchaseDetailInput'
        couponId:
          type: string
          format: uuid
          description: |
            適用するクーポンのID。省略すると値引きを行いません。1 回の購入に適用できるのは高々 1 枚です。

            失効済み・使用済み・保有していない（存在しない場合を含む）・値引きが 0 になる場合は、
            いずれも 422 + `details: ["couponId"]` を返します。次にすべきことがどれも同じ
            （別のクーポンを選ぶか外す）ため、呼び出し側からは区別しません。
          example: 0193a1c0-0001-7000-8000-000000000002
    AppliedCouponResponse:
      type: object
      description: |
        購入に適用したクーポン。値引きと適用範囲の 2 軸だけを返します。

        控えへ写さず結合で解決した現在値です（`productName` と同じ扱い）。発行済みクーポンの値引きと
        適用範囲を書き換える口が無いため、結合で解決しても内容がぶれません。
      required:
        - id
        - discount
        - scope
      properties:
        id:
          type: string
          format: uuid
          description: 適用したクーポンのID
          example: 0193a1c0-0001-7000-8000-000000000002
        discount:
          $ref: '#/components/schemas/CouponDiscount'
        scope:
          $ref: '#/components/schemas/CouponScope'
    PurchasesStatusesResponse:
      type: array
      description: 購入ステータスマスタの一覧。マスタが定める表示順で並べて全件を返し、ページネーションは行いません。
      items:
        $ref: '#/components/schemas/PurchaseStatusRef'
    PurchaseShippableItemResponse:
      type: object
      description: |
        まとめ発送の組に含まれる購入 1 件のスキーマ。発送指示は購入 1 件ずつ code を指定して行います。
        組に入っている時点で発送可能なので、status は返しません。明細も含みません（購入詳細 API で取得します）。
      required:
        - code
        - totalAmount
        - orderedAt
      properties:
        code:
          type: string
          description: 購入コード（利用者へ注文番号として見せる一意の識別子）。発送指示（`PATCH /v1/purchases/{purchaseCode}/ship`）に用います。
          example: 0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60
        totalAmount:
          type: integer
          format: int64
          description: 合計（小計 + 税額 + 送料）。USD セント単位の整数です。
          example: 176500
        orderedAt:
          type: string
          format: date-time
          description: 注文日時
          example: '2026-07-23T00:00:00Z'
    PurchaseDispatchGroupResponse:
      type: object
      description: |
        まとめて発送してよい購入の組。同一の購入者宛てであることを軸に分けます。
        組は算出結果であり永続化しないため、組そのものの識別子は持ちません。
      required:
        - userId
        - purchases
      properties:
        userId:
          type: string
          format: uuid
          description: 組に含まれる購入の購入者 ID。組の中では全件が同一です。
          example: 0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60
        purchases:
          type: array
          minItems: 1
          description: 組に含まれる購入。注文日時の古い順（同時刻は購入 ID の昇順）で並びます。
          items:
            $ref: '#/components/schemas/PurchaseShippableItemResponse'
    PurchaseShippableResponse:
      type: object
      description: |
        発送待ち購入のまとめ発送一覧のレスポンススキーマ。まとめて発送してよい組の配列を返します。
        組同士はその組の最も古い購入の注文日時の順（同時刻は購入 ID の昇順）で並びます。
      required:
        - groups
      properties:
        groups:
          type: array
          description: まとめ発送の組の一覧。発送待ちの購入がない場合は空配列です。
          items:
            $ref: '#/components/schemas/PurchaseDispatchGroupResponse'
    PurchasePayResponse:
      type: object
      description: |
        購入支払い後の購入情報レスポンススキーマ。status は ID・名称を事前解決済みで、
        別途の名称解決 API 呼び出しは不要です。paidAt に支払日時が入ります。
