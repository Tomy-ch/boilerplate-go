        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/carts/me:
    get:
      operationId: GetCartsMe
      tags:
        - v1/carts
      summary: 自分のカートの取得（明細ごとの再評価つき）
      description: |
        呼び出し主体のカートを、明細ごとの再評価つきで取得します。
        主体は認証済みユーザー（Bearer トークンの内部 UserID）か、ゲスト（X-Cart-Session ヘッダ）の
        いずれかで、両方が提示された場合は認証済みユーザーが優先されます。
        パスに他者の識別子を持たないため、他人のカートは取得できません。
        認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0021 (optional-authentication-fail-closed)）。
        明細ごとに商品の現在値を突き合わせ、買えないもの・値の変わったものに issues を立てます。
        問題のある明細があっても 200 で返します。取得は成功しており、問題があるのは明細であって
        要求ではないためで、エラーにすると買える明細が何であったかを利用者に見せられなくなります。
        在庫は押さえず、商品行もロックしません。再評価は参考情報であり、返した瞬間から古くなります。
        カートがまだ無い主体、および有効期限を過ぎたカートの主体には、空のカートを 200 で返します。
        **この操作はカート行を作りません**（したがって sessionToken は常に null、expiresAt は
        カートが無ければ null です）。
        本 op 自体は DB の SELECT / UPDATE のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
        一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CartSessionParam'
      responses:
        '200':
          description: 自分のカートの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    delete:
      operationId: DeleteCartsMe
      tags:
        - v1/carts
      summary: 自分のカートを空にする
      description: |
        呼び出し主体のカートから、明細をすべて取り除きます。カート画面の「カートを空にする」に当たります。
        **カートの行と有効期限は残ります**。空のカートは正当な状態であり、行ごと消すと直後の操作で
        セッショントークンが発行し直され、利用者の同一性が切れます。カート行そのものの削除は
        期限切れの掃除とログイン時のマージ後の破棄に限り、API としては公開しません。
        主体の決まり方は取得（GET）と同じで、両方が提示された場合は認証済みユーザーが優先されます。
        認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0021 (optional-authentication-fail-closed)）。
        **既に空のカートを空にしても、カートを持たない主体が呼んでも成功します**。カートを持たない
        主体にカートを作ることはなく、提示されたセッショントークンでカートを引けなかった場合も
        採番し直しません（応答が本文を持たないため、新しいトークンを返す場所がありません）。
        **明細ごとの再評価を行いません**。この応答は本文を持たず価格を 1 つも提示していないため、
        提示価格を記録すると次の取得で立つはずの priceIncreased を消してしまいます。
        有効期限は延びます（空にするのも利用のため）。
        本 op 自体は DB の SELECT / UPDATE / DELETE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CartSessionParam'
      responses:
        '204':
          description: カートを空にしました（既に空だった場合とカートが無い場合を含みます）
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/carts/me/items/{productId}:
    put:
      operationId: PutCartsMeItem
      tags:
        - v1/carts/items
      summary: 自分のカートへの明細の設定（数量の upsert）
      description: |
        呼び出し主体のカートに、指定した商品の数量を設定します。加算ではなく設定なので、
        同じ要求を何回送っても結果は変わりません。**冪等性は明細の自然キー (cart_id, product_id) から
        来るため、Idempotency-Key を必要としません**（自然キーを持たない POST /v1/purchases との対比）。
        主体は認証済みユーザー（Bearer トークンの内部 UserID）か、ゲスト（X-Cart-Session ヘッダ）の
        いずれかで、両方が提示された場合は認証済みユーザーが優先されます。
        認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0021 (optional-authentication-fail-closed)）。
        **カートがまだ無い主体にはこの操作がカートを作ります**。ゲストの場合はセッショントークンを
        発行して sessionToken に載せて返すので、以降のリクエストで X-Cart-Session に載せてください。
        提示されたトークンでカートを引けなかった場合、その値では作らず新しい値を発行します
        （トークンの秘匿だけがゲストカートへの到達を守っているため、値をクライアントに選ばせません）。
        **有効期限を過ぎたカートは空から始まります**。所有者が確定したカートは行を保ったまま明細を捨て、
        ゲストは新しいカートを作ります。いずれも取得（GET）が期限切れを空のカートとして見せる契約と一致します。
        設定後、応答はカート全体を明細ごとの再評価つきで返します（GET と同じ内容です）。
        在庫は押さえません。在庫不足は投入を拒む理由ではなく、明細の issues として現れます。
        本 op 自体は DB の SELECT / INSERT / UPDATE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
        - $ref: '#/components/parameters/CartSessionParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemPutRequest'
      responses:
        '200':
          description: 明細の設定に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    delete:
      operationId: DeleteCartsMeItem
      tags:
        - v1/carts/items
      summary: 自分のカートからの明細の削除
      description: |
        呼び出し主体のカートから、指定した商品の明細を取り除きます。
        **対象の明細が無くても成功します**。「無かった」と「消した」を呼び出し側に区別させないため、
        404 を持ちません。主体の決まり方は設定（PUT）と同じで、両方が提示された場合は認証済みユーザーが
        優先されます。認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0021 (optional-authentication-fail-closed)）。
        **カートを持たない主体が呼んでもカートは作りません**。提示されたセッショントークンでカートを
        引けなかった場合も採番し直さず、何もせずに成功を返します（応答が本文を持たないため、新しい
        トークンを返す場所がありません）。
        **商品の存在も公開状態も確認しません**。非公開になった商品こそカートから外したいので、ここで
        拒むと再評価で unpublished が立った明細を利用者が取り除けなくなります（設定は 422 で拒むのに対し、
        こちらは取り除けます）。
        **明細ごとの再評価を行いません**。この応答は本文を持たず価格を 1 つも提示していないため、提示価格を
        記録すると、次の取得で立つはずの priceIncreased を消してしまいます。
        有効期限は延びます（削除も利用のため）。明細が 0 件になってもカート自体は残ります。
        本 op 自体は DB の SELECT / UPDATE / DELETE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
        - $ref: '#/components/parameters/CartSessionParam'
      responses:
        '204':
          description: 明細を取り除きました（対象が無かった場合を含みます）
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/carts/me/merge:
    post:
      operationId: PostCartsMeMerge
      tags:
        - v1/carts/merge
      summary: ゲストカートの引き継ぎ（所有者の確定）
      description: |
        ログイン直後に、ゲストカートを認証済みユーザーへ引き継ぎます。
        引き継ぎ元はヘッダの X-Cart-Session、引き継ぎ先は Bearer トークンの主体で、要求本文を持ちません。
        **この操作だけが認証必須です**（所有者を確定させる操作のため、匿名では成り立ちません）。
        **引き継ぎは失敗しません**。同一商品の数量合算が上限を超えたら上限へ丸め、明細数が上限を超えたら
        先に入っていたものを優先して残し、後から来たものを切り捨てます。ログインは認証の成否で決まるべきで、
        カートの都合で失敗させません。**失われた分は clamped / dropped として報告します**。
        ユーザー側にカートが無い場合は所有者を付け替えるだけで、明細の内容は変わりません。
        引き継ぎ元のゲストカートが引けない場合（既に引き継ぎ済み、期限切れ、未知のトークン）は、
        clamped と dropped がいずれも空の成功として返します。
        **引き継ぎ後、元のセッショントークンでそのカートへ到達する経路は状態として残りません**
        （所有者の確定とトークンの破棄は不可分に行われ、合流時はゲストカートの行ごと消えます）。
        応答に引き継ぎ後のカートは含めません。カートの中身は取得（GET /v1/carts/me）でいつでも引けますが、
        clamped / dropped はこの応答でしか得られないためです。
        **Idempotency-Key を受け付けます**。同一キーの再送は初回の結果をそのまま返し、報告が失われません。
        同一キーを内容の異なる要求で使い回した場合は 422 で拒否します（冪等性の一般的な扱いであり、
        引き継ぎそのものの失敗ではありません）。
        カートの 5 つの操作でこれを採るのはここだけで、他は明細の自然キーが冪等性を供給します。
        本 op 自体は DB の SELECT / UPDATE / DELETE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartSessionRequiredParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: 引き継ぎに成功しました（引き継ぐカートが無かった場合を含みます）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMergeResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/carts/me/coupons:
    get:
      operationId: GetCartsMeCoupons
      tags:
        - v1/carts/me/coupons
      summary: いまのカートに対して使えるクーポンの取得
      description: |
        認証コンテキスト（Bearer トークン）の内部 UserID に該当するユーザーのカートに対して、
        使えるクーポンと、それぞれを適用した場合の値引き額を取得します。

        **適用可否と値引き額を表現層に計算させないための口です。** どのクーポンがどの明細に効いて
        いくら引かれるかを front が判定すると、金額の決定が表現層へ漏れます。

        母集団は保有一覧（`GET /v1/users/me/coupons`）と異なります。使用済み・失効済みと、
        いまのカートでは値引きが 0 になるクーポンは並びません。値引き額は購入確定時と同じ規則で決まります。

        **ロックを取らないため、返した値は返した瞬間から古くなります。** 確定までの間にカートの中身や
        クーポンの状態が変われば確定時の値引き額は変わり得るので、値引きが 0 になる確定は購入側が 422 で拒みます。

        カートを持たない場合と、使えるクーポンが 1 枚も無い場合は、いずれもエラーではなく空配列を返します。
        ゲストはクーポンの受給者になれないため、認証を必須とします。
        本 op 自体は DB の SELECT のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
        一時障害で応答不能となり得るため、認証必須 op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 使えるクーポンの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCouponListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
