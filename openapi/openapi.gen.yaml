          example: 160000
        taxAmount:
          type: integer
          format: int64
          description: 税額（国内消費税）。USD セント単位の整数です。
          example: 16000
        shippingFee:
          type: integer
          format: int64
          description: 送料。USD セント単位の整数です。
          example: 500
        totalAmount:
          type: integer
          format: int64
          description: 合計（小計 + 税額 + 送料）。USD セント単位の整数です。
          example: 176500
        details:
          type: array
          description: 購入明細の配列
          items:
