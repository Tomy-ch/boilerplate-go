components:
  parameters:
    PageParam:
      name: page
      in: query
      description: ページ番号（1から始まる）。上限を超えた場合は 400 を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
        example: 1
    PerPageParam:
      name: perPage
      in: query
      description: 1ページあたりの取得件数
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    CursorAfterParam:
      name: after
      in: query
      description: 次ページ取得用の不透明カーソル。先頭ページを取得する場合は省略します。
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
        maxLength: 512
    CursorFirstParam:
      name: first
      in: query
      description: 取得件数の上限
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        example: 50
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: |
        冪等キー。非冪等な変更操作（作成系など）で、同一キーによるリトライを重複実行なく
        安全にするための識別子。サーバは同一 (認証主体, キー) の再送を初回結果のリプレイとして扱う。
        このヘッダを宣言する操作は、ハンドラが必ず idempotency.Run 経由で処理する契約（完全性テストで機械検証）。
      required: false
      schema:
        type: string
        pattern: ^[\x21-\x7E]+$
        minLength: 1
        maxLength: 255
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    StreamDestinationParam:
      name: destination
      in: path
      required: true
      description: 購読する stream の識別子。ticket に束縛された destination と一致しなければ 401 になります。
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
        maxLength: 128
        example: resource-8f3c
    StreamAfterParam:
      name: after
      in: query
      required: false
      description: この位置より後の event から配信を再開します。`Last-Event-ID` があればそちらが優先され、どちらも無ければ ticket に許可された初期位置から始まります。
      schema:
        $ref: '#/components/schemas/StreamCursor'
    LastEventIdParam:
      name: Last-Event-ID
      in: header
      required: false
      description: ブラウザの EventSource が自動再接続時に付ける、最後に受け取った business event の `id`（sequence）。`after` より優先されます。
      schema:
        $ref: '#/components/schemas/StreamCursor'
    KeywordParam:
      name: keyword
      in: query
      description: 全文検索キーワード。商品名・商品説明への部分一致で絞り込みます。
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: example keyword
    ActiveParam:
      name: active
      in: query
      description: 有効なデータのみを対象とする場合はtrue、無効なデータのみを対象とする場合はfalse、全てのデータを対象とする場合は指定しない
      required: false
      schema:
        type: boolean
        example: true
    UserIdParam:
      name: userId
      in: path
      required: true
      description: ユーザーのUUID
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: 123e4567-e89b-12d3-a456-426614174000
    CategoryIdParam:
      name: categoryId
      in: query
      description: |
        商品カテゴリIDでフィルタします。指定しない場合は全カテゴリを対象とします。
        後継は categoryCodes で、マスタ行を指すのは UUID ではなく code です。categoryCodes と
        同時に指定した場合は 400 を返します。
      required: false
      deprecated: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: 5dd52d84-78eb-4a52-ba0b-2e11c95c2af2
    StatusIdParam:
      name: statusId
      in: query
      description: |
        商品ステータスIDでフィルタします。指定しない場合は全ステータスを対象とします。
        後継は statusCodes で、マスタ行を指すのは UUID ではなく code です。statusCodes と
        同時に指定した場合は 400 を返します。
      required: false
      deprecated: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: 093170fb-83a2-4864-a2b3-53236eaf3597
    SortParam:
      name: sort
      in: query
      description: |
        並び順。`-publishedAt`（既定）は公開日時の降順、`publishedAt` は公開日時の昇順です。
        いずれも同一公開日時の商品は ID で安定ソートします。
      required: false
      schema:
        type: string
        enum:
          - -publishedAt
          - publishedAt
        default: -publishedAt
        example: -publishedAt
    PostalCodeParam:
      name: postalCode
      in: query
      required: true
      description: |
        検索対象の郵便番号。ハイフンあり（`123-4567`）・なし（`1234567`）の両方を受け付けます。
        ハイフン除去の正規化は handler が行い、内層（usecase / gateway）へは 7 桁の数字列を渡します。
      schema:
        type: string
        pattern: ^[0-9]{3}-?[0-9]{4}$
        minLength: 7
        maxLength: 8
        example: 100-0001
    DisplayCurrencyParam:
      name: displayCurrency
      in: query
      description: |
        指定時のみ、購入合計金額（totalAmount）のその通貨での参考換算額を referenceAmount として返します（非永続）。
        現状は JPY のみサポートします。レート取得に失敗した場合は referenceAmount = null で degrade し、購入自体は成立させます。
      required: false
      schema:
        type: string
        enum:
          - JPY
        example: JPY
    CartSessionParam:
      name: X-Cart-Session
      in: header
      description: |
        ゲストカートのセッショントークン。所有者が未確定のカートへ到達する唯一の手段で、
        未認証の呼び出し側はこのヘッダで自分のカートを指定する。
        認証済みの呼び出し側では無視される（カートは内部 UserID から解決されるため）。
        値は 256 ビットを base64url（パディング無し）で表現した 43 文字。
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
        minLength: 43
        maxLength: 43
        example: b3JnLWV4YW1wbGUtc2Vzc2lvbi10b2tlbi1zYW1wbGU
    OrderedAfterParam:
      name: orderedAfter
      in: query
      description: |
        集計対象期間の下限となる瞬時（RFC3339）。**この瞬時を含みます**。
        対象は半開区間 `[orderedAfter, orderedBefore)` で、注文日時がこの区間に入る購入だけを集計します。
        省略すると下限を設けません。`orderedBefore` と併せて省略すると全期間が対象になります。
        `orderedBefore` が `orderedAfter` 以前（同値を含む）の場合は 400 を返します。
        cursor ページネーションの `after` とは別のパラメータです。
      required: false
      schema:
        type: string
        format: date-time
        example: '2026-07-01T00:00:00+09:00'
    OrderedBeforeParam:
      name: orderedBefore
      in: query
      description: |
        集計対象期間の上限となる瞬時（RFC3339）。**この瞬時を含みません**。
        対象は半開区間 `[orderedAfter, orderedBefore)` で、注文日時がこの区間に入る購入だけを集計します。
        省略すると上限を設けません。`orderedAfter` と併せて省略すると全期間が対象になります。
        `orderedBefore` が `orderedAfter` 以前（同値を含む）の場合は 400 を返します。
      required: false
      schema:
        type: string
        format: date-time
        example: '2026-08-01T00:00:00+09:00'
    PurchaseGroupByParam:
      name: groupBy
      in: query
      description: |
        集計のグループ化単位（複数指定は同じ名前を繰り返します: `groupBy=category&groupBy=product`）。
        指定順がそのままネストの階層順になります（上の例ならカテゴリで分け、その中を商品で分けます）。
        未指定の場合はグループ化せず、レスポンスに groups を含めません。同じ単位を 2 回指定した場合は 400 を返します。
      required: false
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 2
        items:
          type: string
          enum:
            - category
            - product
        example:
          - category
          - product
    CategoryCodesParam:
      name: categoryCodes
      in: query
      description: |
        商品カテゴリコードでフィルタします（複数指定は同じ名前を繰り返します: `categoryCodes=1&categoryCodes=2`）。
        指定したコードのいずれかに一致する商品を返します。
        指定しない場合は全カテゴリを対象とします。存在しないコードは 0 件として扱い、エラーにはしません。
        コードは商品カテゴリマスタ（GET /v1/products/categories）が返す code で、マスタ行を指す静的な別名です。
        非推奨の categoryId と同時に指定した場合は 400 を返します。
      required: false
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 32
        items:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        example:
          - 1
          - 2
    StatusCodesParam:
      name: statusCodes
      in: query
      description: |
        商品ステータスコードでフィルタします（複数指定は同じ名前を繰り返します: `statusCodes=1&statusCodes=5`）。
        指定したコードのいずれかに一致する商品を返します。
        指定しない場合は全ステータスを対象とします。存在しないコードは 0 件として扱い、エラーにはしません。
        コードは商品ステータスマスタ（GET /v1/products/statuses）が返す code で、マスタ行を指す静的な別名です。
        非推奨の statusId と同時に指定した場合は 400 を返します。
      required: false
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 32
        items:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        example:
          - 1
          - 5
    MinPriceParam:
      name: minPrice
      in: query
      required: false
      description: 最低価格（この値以上）。負でない十進文字列で指定します。
      schema:
        type: string
        maxLength: 40
        pattern: ^\d{1,20}(\.\d{1,18})?$
      example: '10.00'
    MaxPriceParam:
      name: maxPrice
      in: query
      required: false
      description: 最高価格（この値以下）。負でない十進文字列で指定します。
      schema:
        type: string
        maxLength: 40
        pattern: ^\d{1,20}(\.\d{1,18})?$
      example: '100.00'
    MinQuantityParam:
      name: minQuantity
      in: query
      required: false
      description: 最低在庫数（この値以上）。
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 1
    MaxQuantityParam:
      name: maxQuantity
      in: query
      required: false
      description: 最高在庫数（この値以下）。
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 100
    IncludeUnpublishedParam:
      name: includeUnpublished
      in: query
      description: |
        未公開（公開日時が未設定）の商品を母集団に含める場合は true を指定します。既定は false で、
        指定しない場合の母集団は公開済みの商品のみです。
        true を指定できるのは管理者（admin）だけで、未認証は 401、管理者でなければ 403 で拒否します。
        false を明示した場合は認証を要しません（指定しない場合と同じ扱いです）。
      required: false
      schema:
        type: boolean
        default: false
        example: false
    DiscontinuedParam:
      name: discontinued
      in: query
      description: |
        廃番かどうかで母集団を絞ります。true を指定すると廃番の商品だけ、false を指定すると廃番でない
        商品だけを返します。指定しない場合は絞りません。
        **廃番の商品は非公開になる**ため、この軸が意味を持つのは includeUnpublished=true を指定できる
        管理者（admin）だけです。既定の母集団（公開済みのみ）に対して true を指定すると常に空になります。
        廃番かどうかは discontinuedAt が設定されているかで決まります（未来の日時にはなりません）。
      required: false
      schema:
        type: boolean
        example: true
    ProductIdParam:
      name: productId
      in: path
      required: true
      description: 商品のUUID
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f
    RankingLimitParam:
      name: limit
      in: query
      description: 取得する上位件数。その口の軸（販売数量または売上金額）の降順で上位 limit 件を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    LowStockLimitParam:
      name: limit
      in: query
      description: 取得する上位件数。在庫の少ない順で上位 limit 件を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    PurchaseStatusCodesParam:
      name: statusCodes
      in: query
      description: |
        購入ステータスコードでフィルタします（複数指定は同じ名前を繰り返します: `statusCodes=7&statusCodes=8`）。
        指定したコードのいずれかに一致する購入を返します。
        指定しない場合は全ステータスを対象とします。存在しないコードは 0 件として扱い、エラーにはしません。
        コードは購入ステータスの業務キーで、値は到達順序を意味しません。
        ページ送りの間は同じ絞り込み条件を渡してください（条件が変わると keyset の連続性は保証されません）。
      required: false
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 32
        items:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        example:
          - 8
    IncludeOtherUsersParam:
      name: includeOtherUsers
      in: query
      description: |
        他ユーザーの購入も母集団に含める場合は true を指定します。既定は false で、
        指定しない場合の母集団は認証主体（自分）の購入のみです。
        true を指定できるのは管理者（admin）だけで、管理者でなければ 403 で拒否します。
        並び順・ページ送りの規則は母集団によらず同一（注文日時の降順）です。
        ページ送りの間は同じ指定を渡してください（母集団が変わると keyset の連続性は保証されません）。
      required: false
      schema:
        type: boolean
        default: false
        example: false
    PurchaseProductIdParam:
      name: productId
      in: query
      description: |
        指定した商品を含む購入だけに絞ります。指定しない場合は絞りません。
        廃番が進行中の購入を理由に拒まれたとき、どの購入が残っているのかを辿るために用います。
        所有権のフィルタは変わりません。既定では自分の購入のみが母集団で、他ユーザーの購入まで見るには
        includeOtherUsers=true（管理者のみ）を併せて指定します。
      required: false
      schema:
        type: string
        format: uuid
        example: b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f
    ShippableLimitParam:
      name: limit
      in: query
      description: |
        読み出す発送待ち購入の件数。注文日時の古い順で上位 limit 件を読み、まとめ判定はその範囲の中で行います。
        範囲の外にある同一購入者の購入は別の便になります。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    PurchaseCodeParam:
      name: purchaseCode
      in: path
      required: true
      description: 購入コード（利用者へ注文番号として見せる一意の識別子）
      schema:
        type: string
        minLength: 1
        maxLength: 50
        example: 0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60
    CartSessionRequiredParam:
      name: X-Cart-Session
      in: header
      description: |
        引き継ぎ元のゲストカートのセッショントークン。
        ログイン前に持っていた値をそのまま渡す。
        値は 256 ビットを base64url（パディング無し）で表現した 43 文字。

        必須である点が CartSessionParam との違い。引き継ぎ元を指定しない引き継ぎは要求として成り立たず、
        省略を許すと「引き継ぐものが無い」と「引き継ぎ元を書き忘れた」を区別できなくなる。
        OpenAPI 3.0 は $ref の兄弟キーを無視するため、共有定義に required を上書きすることはできない。
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
        minLength: 43
        maxLength: 43
        example: b3JnLWV4YW1wbGUtc2Vzc2lvbi10b2tlbi1zYW1wbGU
    AfterSequenceParam:
      name: afterSequence
      in: query
      description: |
        取得を開始する位置。この位置より後ろのメッセージを返す。先頭から取得する場合は省略する。
        不透明カーソルではなく位置そのものを使うのは、この値が購読の再開位置と同じ意味を持つため。
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 12
    InquiryIdParam:
      name: inquiryId
      in: path
      required: true
      description: 問い合わせ ID
      schema:
        type: string
        format: uuid
        example: 0198a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
  securitySchemes:
    BearerAuth:
      type: http
      description: |
        認証にBearerトークンを使用することを示します。
        JWT の検証は RFC8725（JSON Web Token Best Current Practices）に従います。
        署名アルゴリズムは許可リストで固定し、`alg: none` と鍵の混同を拒否します。
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      description: 認証にBasic認証を使用することを示します。
      scheme: basic
    StreamTicket:
      type: apiKey
      in: query
      name: ticket
      description: |
        SSE 接続の認証に用いる不透明な stream ticket（ADR-0074 (query-ticket-stream-authentication)）。
        EventSource はリクエストヘッダを設定できないため query に載せます。
        feature の認可を通った後に発行され、subject / destination / scope / expiry に束縛されます。
        発行から 5 分間は新しい接続に再利用でき、期限後・失効後の新規接続は 401 で拒否されます。
        サーバは hash だけを保存し、生値を log / trace / error に出しません。
  schemas:
    ErrorResponse:
      type: object
      description: |
        エラーレスポンスの共通スキーマ（base）。 details は返さない。details を返すエンドポイントは ErrorResponseWithDetails を参照する。
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: 機械的に処理可能なエラーコード
          example: EXAMPLE_ERROR
        message:
          type: string
          description: 人間が読めるエラーメッセージ
          example: 定義されたエラーメッセージ
        requestId:
          type: string
          description: リクエストID
          example: abcdefghijklmnopqrstuvwxyz
    ResponseHealth:
      $ref: '#/components/schemas/HealthResponse'
    ResponseReady:
      $ref: '#/components/schemas/ReadyResponse'
    ResponseVersion:
      $ref: '#/components/schemas/VersionResponse'
    ReadyDependency:
      type: object
      description: readiness に加わる依存 1 つの状態です。ここに並ぶのは、落ちていても通常の HTTP 応答を続けられる 依存だけで、不可欠な依存は起動時に fail-fast します。
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: 依存する subsystem の名前
          example: realtime
        status:
          type: string
          enum:
            - ok
            - degraded
          description: その subsystem の状態
          example: ok
    StreamCursor:
      type: string
      description: |
        stream 内の位置（stream-local な単調増加 sequence）。JavaScript の数値精度に依存しないよう 10 進文字列で表します。
        business event の SSE `id` と同じ値で、`0` は stream の先頭を意味します。
      pattern: ^(0|[1-9][0-9]{0,18})$
      maxLength: 19
      example: '1001'
    DeliveryEvent:
      type: object
      description: |
        SSE で配送される business event の封筒。feature に依らず同じ形で、`payload` の形は `type` ごとに feature が定めます。
        SSE の `id` には `sequence` がそのまま入ります。
      required:
        - eventId
        - streamId
        - sequence
        - type
        - occurredAt
        - schemaVersion
        - payload
      properties:
        eventId:
          type: string
          format: uuid
          description: event の一意な識別子。同じ event が再送されても値は変わりません。
          example: 123e4567-e89b-12d3-a456-426614174000
        streamId:
          type: string
          description: この event が属する stream の識別子。接続先の destination と一致します。
          example: resource-8f3c
        sequence:
          $ref: '#/components/schemas/StreamCursor'
        type:
          type: string
          description: feature が定める event 種別。末尾の `.vN` で契約の世代を表します。
          example: resource.updated.v1
        occurredAt:
          type: string
          format: date-time
          description: event が発生した時刻（UTC）。
          example: '2026-08-15T12:00:00Z'
        schemaVersion:
          type: integer
          minimum: 1
          description: payload の schema 世代。`type` の `.vN` と同じ値を保ちます。
          example: 1
        payload:
          type: object
          additionalProperties: true
          description: event の本体。形は `type` ごとに feature が定めます。
          example:
            messageId: 123e4567-e89b-12d3-a456-426614174000
    ControlEvent:
      type: object
      description: |
        レスポンス確定後にサーバから client へ送る制御指示（SSE の `event: control`）。SSE `id` を持たないため `Last-Event-ID` を汚しません。
        client は `action` だけで分岐し、`reason` は記録用の安定値として扱います。`STOP` / `REAUTHENTICATE` / `RESYNC` は
        サーバの切断を待たず client 側で接続を閉じてから遷移します。
      required:
        - action
        - reason
      properties:
        action:
          type: string
          description: |
            client がとる動作。`RECONNECT` は通常の再接続、`RETRY_LATER` は `retryAfterMs` 後の再接続、
            `REAUTHENTICATE` は新しい ticket を取得しての再接続、`RESYNC` は正本の再取得後の再接続、`STOP` は再接続しない。
          enum:
            - RECONNECT
            - RETRY_LATER
            - REAUTHENTICATE
            - RESYNC
            - STOP
          example: RECONNECT
        reason:
          type: string
          description: 指示の理由を表す安定した値。人が読む文言は含みません。
          enum:
            - SERVER_DRAINING
            - TEMPORARILY_OVERLOADED
            - AUTH_REFRESH_REQUIRED
            - AUTHORIZATION_REVOKED
            - CURSOR_TOO_OLD
            - STREAM_RECOVERY_FAILED
          example: SERVER_DRAINING
        retryAfterMs:
          type: integer
          minimum: 0
          maximum: 86400000
          description: 再接続までの待ち時間（ミリ秒）。目安であり、client は jitter を加えてよい。レスポンス確定前の `Retry-After` ヘッダは秒単位です。
          example: 5000
    UserBaseInputRequest:
      description: |
        ユーザー情報の基本入力スキーマ。
        POST / PUT / PATCH は allOf でこのスキーマを継承し required リストのみを兄弟スキーマで足す
        （新規プロパティは追加しない）ため、この基底に additionalProperties: false を置いても
        兄弟の追加プロパティと衝突せず、未知フィールドを全 consumer で一律に拒否できる。
      additionalProperties: false
      properties:
        firstName:
          description: 名前
          type: string
          example: Alice
          maxLength: 50
        lastName:
          description: 苗字
          type: string
          example: Smith
          maxLength: 50
        email:
          description: メールアドレス
          type: string
          format: email
          maxLength: 100
          example: alice.smith@example.com
        phone:
          description: 電話番号
          type: string
          pattern: ^\+?[0-9]{10,15}$
          example: '09012345678'
        postalCode:
          description: 郵便番号
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}$
          example: 150-0041
        prefecture:
          description: 都道府県
          type: string
          example: 東京都
          maxLength: 100
        city:
          description: 市区町村
          type: string
          example: Shibuya
          maxLength: 100
        street:
          description: 丁目・番地
          type: string
          example: 1-2-3 Jinnan
          maxLength: 200
        building:
          description: 建物名・部屋番号
          type: string
          example: Shibuya Building 101
          maxLength: 200
          nullable: true
