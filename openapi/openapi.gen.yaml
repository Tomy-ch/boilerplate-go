        ページングは keyset で、応答の nextCursor をそのまま after に渡して続きを取得します。
        一覧画面を購読で更新する場合は POST /v1/inquiries/feed/stream-ticket を使います。
        本 op 自体は DB の SELECT のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
