        在庫減算・購入作成・明細作成を単一トランザクションで原子的に行い、在庫不足（売り越し）は 409 で
        購入を成立させません。明細の空配列・同一 productId の重複は 422 です。
        退会が確定済みのユーザーは認証の時点で 401 です。受付から成立までの間に退会が確定した場合のみ 409 になります。
        Idempotency-Key により二重 POST を冪等化します。金額はすべて USD セント単位の整数です。
        displayCurrency 指定時は合計金額の参考換算額（referenceAmount）を返します（非永続・レート障害時は null）。
