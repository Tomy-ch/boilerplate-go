  /v1/purchases/{purchaseCode}/pay:
    patch:
      operationId: PatchPurchasesPay
      tags:
        - v1/purchases/detail/pay
      summary: 購入の支払い
      description: |
        認証主体（本人）の購入を支払い済みへ遷移させます。認証必須です。
        決済 SDK / PSP 連携は行わず、paidAt のセットと status の「支払い済み」への更新で擬似決済を代替します
        （金額・決済結果の検証は行いません）。未払い相当（未処理 / 受付中 / 確認中）からのみ遷移でき、
        既に支払い済みの購入は 409（二重支払い）、処理中・キャンセル済み・完了・発送済み・配達済みの購入は 409（不正遷移）で拒否します。
        処理中は支払いを終えたあとの段階であり、未払い相当には含みません。
        未払い相当であっても支払い日時が既に記録されている購入は、支払い済みとみなして 409（二重支払い）で拒否します
        （記録済みの支払い日時を上書きしないため）。
        他ユーザーの購入は 404 で存在を秘匿します。金額はすべて USD セント単位の整数です。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseCodeParam'
      responses:
        '200':
          description: 購入の支払いに成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePayResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/purchases/{purchaseCode}/ship:
