  /v1/products:
    get:
      operationId: GetProducts
      tags:
        - v1/products
      summary: 商品一覧の取得
      description: |
        商品を cursor ページネーションで取得します。認証は任意です。
        既定の母集団は公開済みの商品のみで、公開日時の降順（publishedAt DESC, id DESC）で並び、
        sort=publishedAt で昇順に切り替えられます。
        includeUnpublished=true を指定すると、公開日時が未設定（未公開）の商品も母集団に含みます。
        このときの並び順は登録日時の降順（createdAt DESC, id DESC）になり、sort は向きだけを適用します。
        未公開の商品は公開日時を持たないため、公開日時を並び順の第 1 キーにできないためです。
        includeUnpublished=true を指定できるのは管理者（admin）だけで、未認証は 401、管理者でなければ 403 を返します。
        母集団が変わると並び順の軸も変わるため、cursor は取得したときと同じ includeUnpublished の指定でのみ使えます。
        別の指定へ持ち越した cursor は 400 を返します。
        categoryCodes / statusCodes でフィルタ（同じ名前を繰り返して複数指定可）、keyword で商品名・説明の部分一致検索ができます。
        categoryId / statusId は非推奨で、後継の categoryCodes / statusCodes と同時に指定すると 400 を返します。
        minPrice / maxPrice で価格、minQuantity / maxQuantity で在庫数を境界値を含めて範囲検索できます。
        いずれの範囲も下限が上限を超える場合は 400 を返します。
        price は USD ドル建ての decimal 文字列です。
        認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0021 (optional-authentication-fail-closed)）。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
        - $ref: '#/components/parameters/CategoryIdParam'
        - $ref: '#/components/parameters/StatusIdParam'
        - $ref: '#/components/parameters/CategoryCodesParam'
        - $ref: '#/components/parameters/StatusCodesParam'
        - $ref: '#/components/parameters/KeywordParam'
        - $ref: '#/components/parameters/MinPriceParam'
        - $ref: '#/components/parameters/MaxPriceParam'
        - $ref: '#/components/parameters/MinQuantityParam'
        - $ref: '#/components/parameters/MaxQuantityParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/IncludeUnpublishedParam'
        - $ref: '#/components/parameters/DiscontinuedParam'
      responses:
        '200':
          description: cursor ページネーションで取得した商品一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      operationId: PostProducts
      tags:
        - v1/products
      summary: 商品の作成
      description: |
        商品を作成します。認証必須（admin のみ・非 admin は 403）。
        description はリッチテキスト HTML を許容し、そのまま格納します（表示側でサニタイズします）。
        imagePath には画像アップロード（POST /v1/products/images）で得たパスを渡します。
        price の非数値は 400、負価格・負在庫・名称長超過などの業務不変条件違反は 422 を返します。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductsPostRequest'
      responses:
        '201':
          description: 商品の作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
