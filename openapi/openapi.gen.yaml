  /v1/purchases:
    get:
      operationId: GetPurchases
      tags:
        - v1/purchases
      summary: 購入履歴一覧の取得
      description: |
        購入履歴を cursor ページネーションで取得します。認証必須です。
        既定の母集団は認証主体（自分）の購入のみで、他ユーザーの購入は返しません
        （所有権フィルタで閉じるため、対象がなければ空一覧です）。
        注文日時の降順（orderedAt DESC, id DESC）で安定して並び、前ページのレスポンスに含まれる
        nextCursor を after に渡して次ページを取得します（無限スクロール）。
        一覧は概要（code / totalAmount / status / orderedAt）のみを返し、明細は含みません。
        includeOtherUsers=true を指定すると、他ユーザーの購入も母集団に含みます。指定できるのは
        管理者（admin）だけで、管理者でなければ 403 を返します。母集団が変わっても並び順の軸は
        変わりません。
        statusCodes で購入ステータスを絞り込めます（同じ名前を繰り返して複数指定可）。
        orderedAfter / orderedBefore が指す半開区間 [orderedAfter, orderedBefore) で注文日時を絞り込めます。
        いずれも省略でき、両方省略した場合は全期間が対象です。orderedBefore が orderedAfter 以前
        （同値を含む）の場合は 400 を返します。
        ページ送りの間は同じ絞り込み条件を渡してください（条件が変わると keyset の連続性は保証されません）。
        totalAmount は USD セント単位の整数です。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
        - $ref: '#/components/parameters/OrderedAfterParam'
        - $ref: '#/components/parameters/OrderedBeforeParam'
        - $ref: '#/components/parameters/PurchaseStatusCodesParam'
        - $ref: '#/components/parameters/IncludeOtherUsersParam'
        - $ref: '#/components/parameters/PurchaseProductIdParam'
      responses:
        '200':
          description: cursor ページネーションで取得した購入履歴一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
