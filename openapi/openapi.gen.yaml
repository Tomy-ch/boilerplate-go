        認証主体（本人）の購入をキャンセルします。認証必須です。
        キャンセル可能状態（未処理 / 受付中 / 確認中 / 処理中 / 支払い済み）からのみ遷移でき、
        status を「キャンセル」へ更新し canceledAt をセットします。完了・キャンセル済み、および
        発送済み（shippedAt）・配達済み（deliveredAt）の購入は 409 で拒否します。
        キャンセル時に購入明細分の在庫を復元します（作成時の在庫減算と対称・同一トランザクションで強整合）。
        他ユーザーの購入は 404 で存在を秘匿します。金額はすべて USD セント単位の整数です。
      security:
