post:
  operationId: PostCouponsBulkIssue
  tags:
    - v1/coupons/bulk-issue
  summary: 販促クーポンの一括発行
  description: |
    退会していないすべての利用者へ、同一条件の販促クーポンを 1 枚ずつ発行します。認証必須で、
    管理者（admin）のみ実行できます（非 admin は 403）。
    **受給者は指定できません。** 不特定多数への配布がこの操作の形です。受給者を名指しして配る発行は
    別の操作であり、この API を「全員を列挙する」用途に使うことは想定していません。
    書き込むのはクーポンだけで、他の集約は変更しません。往復は受給者数に比例せず、発行枚数によらず
    一定です。
    **配布の記録は残りません。** 同じ条件で二度実行すれば、同じ利用者へ 2 枚発行されます。
    同じ配布を二度走らせない責務は呼び出し側にあるため、**Idempotency-Key は必須です**（欠くと 400）。
    同一キーの再送は初回の結果をそのまま返し、クーポンが二重に発行されることはありません。
    **別のキーで再実行した場合は、別の配布として全員へ改めて発行されます。**意図しない再配布を防ぐのは
    キーの管理だけなので、リトライでは必ず同じキーを送ってください。
    適用範囲に `category` / `product` を指定した場合、その対象が存在しなければ 404 を返します。
    存在しない対象を範囲にしたクーポンは誰にも使えないため、発行してから気づくことを避けます。
    受給対象の人数が上限を超える場合は 409 を返します。409 はこの一義で、要求の形が原因になることは
    ありません（形の誤りは 400 / 422 です）。
    発行されたクーポンは GET /v1/users/me/coupons に並び、他の発行経路のクーポンと区別されません。
    本 op は DB の SELECT / INSERT のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
    一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../components/parameters/idempotency/IdempotencyKeyRequiredParam.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/requests/coupons/CouponBulkIssuePostRequest.yaml'
  responses:
    '200':
      description: 販促クーポンの一括発行に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/coupons/CouponBulkIssueResponse.yaml'
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../components/schemas/errors/NotFound404.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '409':
      $ref: '../../../components/schemas/errors/Conflict409.yaml'
    '422':
      $ref: '../../../components/schemas/errors/UnprocessableEntity422.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
