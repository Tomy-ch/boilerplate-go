get:
  operationId: GetUsers
  tags:
    - v1/users
  summary: ユーザー一覧の取得
  description: ユーザーの一覧を取得します。ページネーションを指定できます。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../components/parameters/search/ActiveParam.yaml'
    - $ref: '../../components/parameters/pagination/PageParam.yaml'
    - $ref: '../../components/parameters/pagination/PerPageParam.yaml'
  responses:
    '200':
      description: 取得に成功したユーザー一覧
      content:
        application/json:
          schema:
            $ref: '../../components/responses/users/UsersResponse.yaml'
    '400':
      $ref: '../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../components/schemas/errors/Forbidden403.yaml'
    '405':
      $ref: '../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../components/schemas/errors/ServiceUnavailable503.yaml'
post:
  operationId: PostUsers
  tags:
    - v1/users
  summary: ユーザーの作成
  description: |
    認証済みの主体を内部ユーザーとして登録します。認証したトークンの issuer と subject を
    そのまま外部アイデンティティとして結び付けるため、リクエストボディには本人の属性だけを含めます。
    同じ主体で 2 回目を呼ぶと 409 を返します。
  security:
    - BearerAuthRegistration: []
  parameters:
    - $ref: '../../components/parameters/idempotency/IdempotencyKeyParam.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/requests/users/UsersPostRequest.yaml'
  responses:
    '201':
      description: ユーザーの作成に成功しました
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/UserResponse.yaml'
    '400':
      $ref: '../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../components/schemas/errors/Forbidden403.yaml'
    '405':
      $ref: '../../components/schemas/errors/MethodNotAllowed405.yaml'
    '409':
      $ref: '../../components/schemas/errors/Conflict409.yaml'
    '422':
      $ref: '../../components/schemas/errors/UnprocessableEntity422.yaml'
    '500':
      $ref: '../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../components/schemas/errors/ServiceUnavailable503.yaml'
