openapi: 3.0.3
info:
  title: Go Boilerplate API
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 2.2.0
  # sample-api:replace-begin
  description: |
    Reference specification for the sample API (users, products, purchases). It exercises every layer
    of the Onion Architecture end to end: cursor and offset pagination, creation and partial update,
    soft delete, idempotency keys, and role-based authorization.

    Handlers (oapi-codegen) and the published reference documentation are both generated from this
    file, so every endpoint change starts here.
  # sample-api:replace-with
  # = description: |
  # =   Handlers (oapi-codegen) and the published reference documentation are both generated from this
  # =   file, so every endpoint change starts here.
  # =   Replace this text with a description of the API you are shipping: it is published to your API
  # =   consumers exactly as written.
  # sample-api:replace-end
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
    x-internal: true
  - url: https://api.example.com
    description: Production server (replace with actual URL)
    x-internal: false
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
    x-internal: false
  - url: https://development.api.example.com
    description: Development server (replace with actual URL)
    x-internal: true
tags:
  - name: health
    description: ヘルスチェック（liveness）。
  - name: healthz
    description: ヘルスチェック（Kubernetes 互換の liveness）。
  - name: ready
    description: レディネスチェック（依存先を含む readiness）。
  - name: version
    description: アプリケーションのバージョン情報。
  - name: metrics
    description: Prometheus メトリクス。
  - name: v1/streams
    description: Server-Sent Events による配信（query の stream ticket で認証・cursor から再開）。
  # sample-api:begin
  - name: v1/users
    description: ユーザーリソース（一覧取得・作成）。
  - name: v1/users/detail
    description: 単一ユーザー（取得・更新・部分更新・削除）。
  - name: v1/users/feed
    description: ユーザーフィード（cursor ページネーション）。
  - name: v1/users/search
    description: ユーザー検索（キーワード）。
  - name: v1/users/me/purchases
    description: 認証主体自身の購入集計（認証必須・自分絞り込み / query_service サンプル）。
  - name: v1/users/me/roles
    description: 認証主体自身のロール（認証必須・自分絞り込み / クライアントの楽観的な権限分岐用）。
  - name: v1/users/me/coupons
    description: 認証主体自身の保有クーポン（認証必須・使用済みや失効済みも並ぶ「持っているもの」の一覧）。
  - name: v1/prefectures
    description: 都道府県マスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products
    description: 商品一覧（認証不要・cursor ページネーション + フィルタ + キーワード検索 + 並び替え）。
  - name: v1/products/count
    description: 公開商品検索の一致件数（認証不要・商品一覧と同じ検索条件）。
  - name: v1/products/statuses
    description: 商品ステータスマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products/categories
    description: 商品カテゴリマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products/detail
    description: 単一商品（認証不要・公開商品の詳細取得。未存在・非公開は 404 で存在を秘匿）。
  - name: v1/products/ranking
    description: 商品売上ランキング（認証不要・購入明細の集計。販売数量と売上金額の 2 軸を別の口で提供 / query_service サンプル）。
  - name: v1/products/low-stock
    description: 在庫僅少商品一覧（admin のみ・在庫警告閾値以下の top-N・非 admin は 403）。
  - name: v1/exchange-rates
    description: 為替レート換算（外部 gateway 利用サンプル）。
  - name: v1/addresses
    description: 郵便番号→住所補完（外部 gateway 利用サンプル・degrade）。
  - name: v1/purchases
    description: 購入作成（CommandService 正例・原子性/売り越し禁止・冪等）。
  - name: v1/purchases/statuses
    description: 購入ステータスマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/purchases/shippable
    description: 発送待ち購入のまとめ発送一覧（admin のみ・単一集約 Domain Service サンプル・非 admin は 403）。
  - name: v1/purchases/detail
    description: 単一購入の詳細取得（本人のみ・集約跨ぎ QueryService・明細に商品名/未存在は 404 で秘匿）。
  - name: v1/purchases/detail/cancel
    description: 購入のキャンセル（本人のみ・状態機械/不正遷移 409・在庫復元）。
  - name: v1/purchases/detail/pay
    description: 購入の支払い（本人のみ・状態機械/不正遷移 409・擬似決済）。
  - name: v1/purchases/detail/ship
    description: 購入の発送（admin のみ・状態機械/不正遷移 409・非 admin は 403）。
  - name: v1/purchases/detail/deliver
    description: 購入の配達完了（admin のみ・状態機械/不正遷移 409・非 admin は 403）。
  - name: v1/dashboard
    description: admin ダッシュボードの横断集計（admin のみ・backend 合成/1画面1API・非 admin は 403）。
  - name: v1/carts
    description: 自分のカート（任意認証サンプル・ゲストと認証済みの双方が主体になれる / 明細ごとの再評価）。
  - name: v1/carts/items
    description: カート明細の設定と削除（任意認証・自然キー upsert による冪等サンプル・Idempotency-Key を要さない）。
  - name: v1/carts/merge
    description: ログイン時のカート引き継ぎ（認証必須・所有権の遷移サンプル・Idempotency-Key を採る）。
  - name: v1/carts/me/coupons
    description: いまのカートに使えるクーポンと値引き額（認証必須・適用可否の判定を表現層へ漏らさないための読み）。
  - name: v1/inquiries
    description: 問い合わせ一覧（admin のみ・keyset ページング・本文を持たない要約）。
  - name: v1/inquiries/me/messages
    description: 自分の問い合わせの履歴と投稿（認証必須・append-only・購読の開始位置を返す）。
  - name: v1/inquiries/me/stream-ticket
    description: 自分の問い合わせを購読する ticket の発行（認証必須・生値は応答のみ）。
  - name: v1/inquiries/detail/messages
    description: 任意の問い合わせの履歴と回答（admin のみ・append-only）。
  - name: v1/inquiries/feed/stream-ticket
    description: 問い合わせ更新フィードを購読する ticket の発行（admin のみ）。
  # sample-api:end
  - name: internal/types/error-response
    description: （内部用）型生成専用のタグ。実エンドポイントではない。
