name: Setup Postgres (wait & init)
description: Wait for PostgreSQL service to be ready and apply init SQL

inputs:
  pg_version:
    description: PostgreSQL version to install (if install_psql is true)
    required: false
    default: "18"
  host:
    description: Postgres host address
    required: false
    default: localhost
  port:
    description: Postgres port
    required: false
    default: "5432"
  user:
    description: Postgres user
    required: false
    default: postgres
  db:
    description: Postgres database name
    required: true
  password:
    description: Postgres password
    required: true
  init_sql:
    required: false
    description: Path to SQL file to initialize the database
    default: ""
  install_psql:
    required: false
    description: Whether to install the psql client
    default: "true"
  max_attempts:
    required: false
    description: Maximum number of attempts to check if Postgres is ready
    default: "60"
  sleep_seconds:
    required: false
    description: Number of seconds to wait between attempts to check if Postgres is ready
    default: "1"

runs:
  using: composite
  steps:
    - name: Drop apt sources this job does not use
      if: ${{ inputs.install_psql == 'true' }}
      shell: bash
      run: |
        # The runner image ships third-party apt sources (Chrome, Microsoft) this job never installs
        # from. `apt-get update` fetches them anyway and exits 100 when any one source fails, so an
        # outage in either takes down a step that needs only Ubuntu and pgdg. Match on the host, not
        # the filename: the image is free to rename a list, and a stale name would silently match
        # nothing. No match is the normal case on an image that ships neither, so it is not an error.
        lists="$(sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/ || true)"
        if [ -n "$lists" ]; then
          printf '%s\n' "$lists" | sudo xargs -r rm -f
        fi

    - name: Update apt and install postgresql client dependencies
      if: ${{ inputs.install_psql == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl gnupg lsb-release
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
        echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt \
          $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update

    - name: Install psql client(${{ inputs.pg_version }})
      if: ${{ inputs.install_psql == 'true' }}
      shell: bash
      env:
        PG_VERSION: ${{ inputs.pg_version }}
      run: |
        sudo apt-get install -y "postgresql-client-${PG_VERSION}"
        echo "/usr/lib/postgresql/${PG_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Print client versions
      if: ${{ inputs.install_psql == 'true' }}
      shell: bash
      run: |
        psql --version
        pg_dump --version

    - name: Wait for database
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.password }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        PGUSER: ${{ inputs.user }}
        DB: ${{ inputs.db }}
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
      run: |
        command -v pg_isready >/dev/null 2>&1 \
          || { echo "pg_isready not found; set install_psql=true"; exit 1; }
        echo "Waiting for Postgres... host=${HOST} port=${PORT} db=${DB}"
        for i in $(seq 1 "${MAX_ATTEMPTS}"); do
          if pg_isready -h "${HOST}" -p "${PORT}" -U "${PGUSER}" -d "${DB}"; then
            echo "Postgres is ready."
            exit 0
          fi
          [ "$i" -lt "${MAX_ATTEMPTS}" ] && sleep "${SLEEP_SECONDS}"
        done
        echo "Postgres did not become ready in time."
        exit 1

    - name: Apply init SQL (optional)
      if: ${{ inputs.init_sql != '' }}
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.password }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        PGUSER: ${{ inputs.user }}
        DB: ${{ inputs.db }}
        INIT_SQL: ${{ inputs.init_sql }}
      run: |
        command -v psql >/dev/null 2>&1 \
          || { echo "psql not found; set install_psql=true"; exit 1; }
        test -f "${INIT_SQL}" || { echo "init_sql not found: ${INIT_SQL}"; exit 1; }
        psql -h "${HOST}" -p "${PORT}" -U "${PGUSER}" -d "${DB}" \
          -v ON_ERROR_STOP=1 \
          -f "${INIT_SQL}"
