# Dependabot configuration.
#
# `cooldown` withholds an update PR until the stated number of days has passed since the version
# was published — the supply-chain window ADR-0095 (malicious-package-detection-via-cooldown)
# records. A security update skips it and opens immediately, which is Dependabot's own behaviour
# and not configurable here.
version: 2
updates:
  # ---- Go modules ----
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      gomod:
        patterns:
          - "*"

  # ---- Node packages (pnpm) ----
  # Every window here is at least 7 days because that is what `minimumReleaseAge` in each
  # pnpm-workspace.yaml enforces at resolution time (ADR-0112). A shorter window would only
  # produce pull requests pnpm then refuses to resolve.
  - package-ecosystem: "npm"
    directories:
      - "/scripts"
      - "/docs-viewer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      npm:
        patterns:
          - "*"

  # ---- Docker ----
  - package-ecosystem: "docker"
    directories:
      - "/docker/tools"
      - "/docker/server"
      - "/docker/document"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns:
          - "*"

  # ---- GitHub Actions ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
