name: Dockerfile Lint

on:
  pull_request:
    paths:
      - 'docker/**/Dockerfile'
      - '.hadolint.yaml'
      - 'mise.toml'
      - '.makefiles/docker/lint.mk'
      - '.github/workflows/docker-lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: hadolint
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run hadolint
        id: hadolint
        shell: bash
        run: |
          set +e

          make docker-lint-ci 2>&1 | tee /tmp/hadolint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Dockerfile lint: PASS (hadolint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Dockerfile lint: FAIL (hadolint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Dockerfile lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- dockerfile-lint-result -->'
          status: ${{ steps.hadolint.outputs.status }}
          title: "${{ steps.hadolint.outputs.title || '## ⚠️ Dockerfile Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/hadolint.log
          details-summary: 'hadolint log'

      - name: Fail if hadolint failed
        if: always() && steps.hadolint.outputs.status != 'success'
        run: exit 1
