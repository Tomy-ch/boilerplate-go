name: Go Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Why the trigger condition lives in a job: README.md § Required checks report on every pull request.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # fetch-depth: 0 so the PR's base and head commits are present locally. The filter
      # below compares them with `git diff`; the default shallow checkout fetches only the
      # merge commit, so neither parent resolves.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # An empty token selects `git diff` over the compare API. The API refuses a
          # large diff outright (`this diff is taking too long to generate`), and a filter
          # that reaches no verdict runs every gated job instead of skipping it.
          token: ''
          filters: |
            relevant:
              - '.github/workflows/go-lint.yaml'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
              - '.golangci-full.yaml'
              - 'makefile'
              - '.makefiles/go/golangci-lint.mk'

  go-lint:
    needs: changes
    # Fail open — README.md § Required checks report on every pull request.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    # The only cutoff for this job: golangci-lint itself runs with its timeout disabled.
    # Measured setup ~2-4m + lint ~2.5m, so 30m leaves room for the repository to grow.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: golangci-lint
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Go / golangci-lint version
        run: |
          go version
          golangci-lint version

      - name: Run golangci-lint
        id: golangci
        shell: bash
        run: |
          set +e

          # Go through make so the timeout budget lives in one place (see timeout-minutes above).
          # print-issued-lines / print-linter-name default to true in golangci-lint v2.
          make lint GOLANGCI_LINT_TIMEOUT=0 2>&1 | tee /tmp/golangci-lint.log

          code=${PIPESTATUS[0]}

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Go lint: PASS (golangci-lint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Go lint: FAIL (golangci-lint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Go lint result on PR
        # always() is needed for the timeout case: a plain `if:` is implicitly `success() &&`,
        # so a cut-off job would skip this step and leave the partial log unreachable.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- golangci-lint-result -->'
          status: ${{ steps.golangci.outputs.status }}
          title: "${{ steps.golangci.outputs.title || '## ⚠️ Go Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/golangci-lint.log
          details-summary: 'golangci-lint log'

      - name: Fail if golangci-lint failed
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.golangci.outputs.exit_code }}
        run: |
          code="${EXIT_CODE-}"
          # Empty means the run never reached its own exit: the job was cut off.
          if [ -z "$code" ]; then
            echo "golangci-lint did not finish; the job was cut off (see timeout-minutes)"
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "golangci-lint failed with exit code $code"
            exit 1
          fi
