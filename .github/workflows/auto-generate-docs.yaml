name: Auto-generate Docs

on:
  push:
    branches:
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-docs:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.ref_name, 'auto/docs-update/') && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write
      pull-requests: write

    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password

    services:
      database:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # `gen-test-repo` runs the whole suite for the coverage report, so this job needs the same
      # backing services `go-test.yaml` provides. Without them every Realtime Delivery package
      # fails on a connection that never answers, and the report is generated from a run that
      # never passed. Kept in step with the definitions there.
      dynamodb_local:
        # DynamoDB Local, the Realtime Delivery store. Service-container defaults: README.md § Notes.
        image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - "8000:8000"
        options: >-
          --health-cmd="curl -s -o /dev/null http://localhost:8000"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s
      goaws:
        # SNS / SQS emulator for the Realtime Delivery fan-out. Service-container defaults: README.md § Notes.
        image: admiralpiett/goaws:v0.5.4@sha256:18589afe16517751cc981354536c148854157a718bee9059494d6cdee3dc4e2d
        ports:
          - "4100:4100"
        options: >-
          --health-cmd="nc -z localhost 4100"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=5s

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80
            apt.postgresql.org:443
            apt.postgresql.org:80
            www.postgresql.org:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy & Vendor
        run: make tidy-lib

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      # The stamp is a TypeScript script now, so it runs through the node tool runner rather than
      # bare node: the container is where `tsx` and the script's dependencies live, and every
      # other generation step in this job already goes through it.
      - name: Stamp OpenAPI version from release branch
        run: make stamp-openapi-version REF="${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Generate OpenAPI bundle
        run: make gen-bundle-oapi

      - name: Generate OpenAPI docs
        run: make gen-api-docs

      - name: Regenerate embedded spec (Go)
        run: make gen-go-code

      - name: Materialize ci env for embedding
        run: make materialize-env

      - name: Migrate
        run: go run ./cmd/ migrate-up --database "$DB"

      - name: Seed Database
        run: go run ./cmd/ db-seed --database "$DB"

      - name: Generate ER Diagram
        run: make gen-db-schema-ci

      - name: Generate test repository docs
        run: make gen-test-repo

      - name: Generate portal docs
        run: make gen-portal-docs

      - name: Generate docs.json
        run: make gen-docs-json

      - name: Build portal frontend
        run: make gen-portal-build

      - name: Generate godoc
        run: make gen-godoc

      - name: Fix permissions
        run: |
          sudo chown -R "$USER:$USER" docs internal openapi

      # The materialized env/.env is not generated output, so exclude it from the commit check.
      - name: Restore embedded env
        run: make restore-env

      - name: Strip nondeterministic noise & detect changes
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Whether this push contains .go changes (used to decide if a coverage update is meaningful).
          go_changed=false
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            go_changed=true
          elif git diff --name-only "$BEFORE_SHA..$AFTER_SHA" -- '*.go' | grep -q .; then
            go_changed=true
          fi

          git checkout -- docs/db-schema/index.html docs/db-schema/info-html.txt 2>/dev/null || true
          if [ "$go_changed" = "false" ]; then
            git checkout -- docs/coverage/index.html 2>/dev/null || true
          fi

          # After removing noise, decide whether to create a PR based on whether committable diffs remain.
          git add -A
          if git diff --cached --quiet; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      # The secrets context is unavailable in `if:`, hence the detour through a run step output.
      - name: Check auto-PR app credentials
        id: app-config
        if: steps.diff.outputs.has_diff == 'true'
        env:
          AUTO_PR_APP_ID: ${{ secrets.AUTO_PR_APP_ID }}
          AUTO_PR_APP_PRIVATE_KEY: ${{ secrets.AUTO_PR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AUTO_PR_APP_ID}" ] && [ -n "${AUTO_PR_APP_PRIVATE_KEY}" ]; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::warning::AUTO_PR_APP_ID / AUTO_PR_APP_PRIVATE_KEY are not configured; the pull request is opened with GITHUB_TOKEN, whose events start no workflow, so its required checks never report and the merge stays blocked.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi

      # Why an app token rather than GITHUB_TOKEN: README.md § Notes.
      - name: Mint the auto-PR app token
        id: app-token
        if: steps.diff.outputs.has_diff == 'true' && steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.AUTO_PR_APP_ID }}
          private-key: ${{ secrets.AUTO_PR_APP_PRIVATE_KEY }}
          # An installation token carries the app's whole permission set unless it is narrowed here.
          # Pushing the branch and opening the pull request is the entire job.
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR
        if: steps.diff.outputs.has_diff == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Falls back to GITHUB_TOKEN when the app is not configured: the pull request still opens,
          # it just carries no checks. A skipped step leaves an empty output, which is falsy, so the
          # fallback is reached exactly when the token was not minted.
          token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: "Chore: auto update docs"
          branch: auto/docs-update/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "Chore: sync generated artifacts"
          body: |
            ## 🤖 Auto-generated Docs Sync

            This PR contains only **generated artifacts**.

            ### 🔗 Source of truth
            All changes are derived from already reviewed sources:
            - OpenAPI definitions (incl. `info.version` synced from the `release/vX.Y.Z` branch name)
            - SQL / database schema
            - Go code

            ### 📦 Included outputs
            - OpenAPI `info.version` (contract version `X.Y.Z`; no SHA — commit-level traceability lives in the runtime `/version`)
            - OpenAPI bundle (`openapi.gen.yaml`) + embedded validation spec (`validate.gen.go`)
            - OpenAPI docs
            - ER diagram
            - Test repository docs
            - Portal docs / docs.json
            - Portal frontend bundle (`docs/portal/dist/`)

            ### ⚠️ Notes
            - No manual edits are included
            - Safe to auto-merge if CI passes
            - This PR is for keeping generated outputs in sync with source changes

            Generated from: `${{ github.ref_name }}`
            Run ID: `${{ github.run_id }}`
          delete-branch: true
