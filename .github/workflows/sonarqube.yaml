name: SonarQube Cloud Scan

# **Pull requests only, and that is a constraint rather than a preference.** SonarQube Cloud
# analyzes one branch per organization on the free plan — every other branch is refused with
# `Organization is not allowed to access data from non main branches`. Pull-request analysis
# is exempt, which is why a pull request scans and a branch does not.
#
# A push trigger used to run here and it never once succeeded: the job died reading the
# quality gate, and the steps that collect the findings and build the SARIF sit after that
# read, so they never ran. Worse than the red run was what did reach code scanning from
# earlier attempts — `Fetch issues` has no branch to ask about outside a pull request, so it
# returns the organization's main branch, and those findings were published as if they
# described the branch that was pushed. Alerts naming files this repository had already
# deleted are what that looks like from the outside.
#
# Restoring a branch scan is a decision about the SonarQube Cloud organization (which branch
# is its main, or whether the plan analyzes more than one), not about this file. Until that
# is taken, `workflow_dispatch` stays as the way to re-run the analysis and watch what the
# API answers — its findings do NOT reach code scanning, because the `report` job below is
# gated on a pull-request context for the reason above.

# 保護ブランチへの push でも走らせる。code scanning はアラートを「新しい解析がもう報告しない」
# ことでしか閉じないので、既定ブランチの解析が走らないと、除外を足しても既存のアラートが
# 永久に開いたまま残る。実際 database/seed の plsql:S1192 が 385 件、除外を入れたあとも
# 開いたままになっていた（全 open の 76%）。判断済みのもので埋まったダッシュボードは、
# 残りの本物を隠す。
on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/sonarqube.yaml'
      - 'sonar-project.properties'
      - '**/*.go'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.jsx'
  pull_request:
    paths:
      - '.github/workflows/sonarqube.yaml'
      - 'sonar-project.properties'
      - '**/*.go'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.jsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.token.outputs.configured }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Resolve SonarQube credentials
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::SONAR_TOKEN is not configured, so the SonarQube Cloud scan is skipped. Register the secret to enable it."
          fi
        shell: bash

  sonarqube:
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      count: ${{ steps.summarize.outputs.count }}
      detail: ${{ steps.detail.outputs.markdown }}
      gate: ${{ steps.gate.outputs.status }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80
            apt.postgresql.org:443
            apt.postgresql.org:80
            www.postgresql.org:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            sonarcloud.io:443
            *.sonarcloud.io:443
            binaries.sonarsource.com:443
            keyserver.ubuntu.com:443
            keys.openpgp.org:443

      # Sonar attributes an issue to the commit that introduced it, which it can only do
      # with the history present. fetch-depth: 0 is the vendor's documented requirement
      # for that, not a convenience.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scanner writes the analysis it just queued into report-task.txt. Everything
      # below reads the result back out of that queue entry, because the scan itself
      # returns nothing that could be reported.
      - name: Read analysis task
        id: task
        run: |
          set -euo pipefail

          TASK_FILE=.scannerwork/report-task.txt
          if [ ! -f "${TASK_FILE}" ]; then
            echo "::error::${TASK_FILE} was not produced, so the analysis cannot be read back"
            exit 1
          fi

          # The file is a flat key=value list; a value may itself contain '=' (URLs do),
          # so the split is on the first one only.
          while IFS= read -r line; do
            key=${line%%=*}
            value=${line#*=}
            case "${key}" in
              ceTaskId|serverUrl|projectKey|dashboardUrl)
                echo "${key}=${value}" >> "$GITHUB_OUTPUT"
                ;;
              *) ;;
            esac
          done < "${TASK_FILE}"
        shell: bash

      # Sonar queues the analysis rather than running it inline, so the issues cannot be
      # read until the queue entry reports SUCCESS. The ceiling exists because a queue
      # that never drains would otherwise be indistinguishable from a clean scan.
      - name: Wait for analysis to complete
        id: analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CE_TASK_ID: ${{ steps.task.outputs.ceTaskId }}
          SERVER_URL: ${{ steps.task.outputs.serverUrl }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do
            TASK=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SERVER_URL}/api/ce/task?id=${CE_TASK_ID}")
            STATUS=$(jq -r '.task.status // "UNKNOWN"' <<<"${TASK}")

            case "${STATUS}" in
              SUCCESS)
                # The verdict below is requested by analysisId rather than by project, so
                # that a run concurrent with this one cannot answer for this analysis.
                echo "analysisId=$(jq -r '.task.analysisId // ""' <<<"${TASK}")" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CANCELED)
                echo "::error::the SonarQube analysis finished as ${STATUS}"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "::error::the SonarQube analysis did not complete within 10 minutes"
          exit 1
        shell: bash

      # Sonar's own pass/fail verdict, which is a different question from whether the
      # analysis ran: a gate can fail on coverage or duplication with no issue raised at
      # all. Read here and enforced at the end of the job, so the findings are collected
      # and reported before the job goes red.
      - name: Read the quality gate
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SERVER_URL: ${{ steps.task.outputs.serverUrl }}
          ANALYSIS_ID: ${{ steps.analysis.outputs.analysisId }}
        run: |
          set -euo pipefail

          if [ -z "${ANALYSIS_ID:-}" ]; then
            echo "::error::the completed task carried no analysisId, so the quality gate cannot be read"
            exit 1
          fi

          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SERVER_URL}/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}" \
            -o sonar-quality-gate.json

          STATUS=$(jq -r '.projectStatus.status // "UNKNOWN"' sonar-quality-gate.json)
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

          # Only the failing conditions are written out. The passing ones are the gate
          # doing its job, and listing them buries the ones that need reading.
          jq -r '
            [(.projectStatus.conditions // [])[] | select(.status == "ERROR")]
            | .[]
            | "- `\(.metricKey)` \(.comparator | ascii_downcase) \(.errorThreshold) — actual \(.actualValue)"
          ' sonar-quality-gate.json > sonar-quality-gate.md
        shell: bash

      # A pull request analysis is stored against the PR rather than the branch, so the
      # issues have to be requested the same way the scanner filed them.
      - name: Fetch issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SERVER_URL: ${{ steps.task.outputs.serverUrl }}
          PROJECT_KEY: ${{ steps.task.outputs.projectKey }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          SCOPE=""
          if [ -n "${PR_NUMBER:-}" ]; then
            SCOPE="&pullRequest=${PR_NUMBER}"
          fi

          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SERVER_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=false&ps=500${SCOPE}" \
            -o sonar-issues.json
        shell: bash

      # Sonar's issue list becomes SARIF here. The component is reported as
      # "<projectKey>:<path>", so the key is stripped to leave the repository-relative
      # path that code scanning needs to anchor an alert to a file.
      - name: Convert issues to SARIF
        env:
          SERVER_URL: ${{ steps.task.outputs.serverUrl }}
          PROJECT_KEY: ${{ steps.task.outputs.projectKey }}
        run: |
          set -euo pipefail

          jq \
            --arg serverUrl "${SERVER_URL}" '
            def level:
              {BLOCKER: "error", CRITICAL: "error", MAJOR: "warning", MINOR: "note", INFO: "note"}[.] // "warning";
            # The key is dropped by splitting rather than by matching it as a pattern: a
            # project key is user-supplied and may contain regex metacharacters, and an
            # escaping bug here would silently mislocate every alert.
            def relpath: split(":") | if length > 1 then .[1:] | join(":") else .[0] end;

            (.issues // []) as $issues
            | {
                "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                version: "2.1.0",
                runs: [{
                  tool: {
                    driver: {
                      name: "SonarQube Cloud",
                      informationUri: $serverUrl,
                      rules: (
                        $issues
                        | map(.rule // "unknown")
                        | unique
                        | map({id: ., helpUri: ($serverUrl + "/coding_rules?open=" + .)})
                      )
                    }
                  },
                  results: (
                    $issues
                    | map({
                        ruleId: (.rule // "unknown"),
                        level: (.severity // "MAJOR" | level),
                        message: {text: (.message // "")},
                        locations: [{
                          physicalLocation: {
                            artifactLocation: {uri: ((.component // "") | relpath)},
                            region: {startLine: (.line // .textRange.startLine // 1)}
                          }
                        }]
                      })
                  )
                }]
              }
          ' sonar-issues.json > sonarqube.sarif
        shell: bash

      - name: Create SonarQube summary (Markdown)
        id: summarize
        env:
          GATE_STATUS: ${{ steps.gate.outputs.status }}
        run: |
          set -euo pipefail

          COUNT=$(jq '[(.runs // [])[] | (.results // [])[]] | length' sonarqube.sarif)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          # The failing conditions lead the body: a gate can fail on a metric that raises
          # no issue, and then the issue list below explains nothing about why it failed.
          if [ -s sonar-quality-gate.md ]; then
            {
              echo "**Quality gate: ${GATE_STATUS}**"
              echo
              cat sonar-quality-gate.md
              echo
            } > sonarqube-summary.md
          else
            echo "**Quality gate: ${GATE_STATUS}**" > sonarqube-summary.md
            echo >> sonarqube-summary.md
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "No issues." >> sonarqube-summary.md
            exit 0
          fi

          jq -r '
            [(.runs // [])[] | (.results // [])[]]
            | map(.level //= "warning")
            | sort_by({error: 0, warning: 1, note: 2}[.level] // 3)
            | .[]
            | "- [\(.level)] `\(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)` \(.ruleId // "?")\n  - \((.message.text // "") | gsub("\n"; " "))"
          ' sonarqube.sarif >> sonarqube-summary.md
        shell: bash

      - name: Build detection detail
        id: detail
        if: ${{ steps.summarize.outputs.count != '0' }}
        uses: ./.github/actions/notify-detail
        with:
          summary-file: sonarqube-summary.md

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonarqube
          path: |
            sonarqube.sarif
            sonarqube-summary.md
            sonar-issues.json
            sonar-quality-gate.json

      # Last, so everything above has already reported. NONE fails alongside ERROR: it
      # means the project carries no gate, and a verdict nobody defined is not a pass.
      - name: Enforce the quality gate
        env:
          GATE_STATUS: ${{ steps.gate.outputs.status }}
          DASHBOARD_URL: ${{ steps.task.outputs.dashboardUrl }}
        run: |
          set -euo pipefail

          case "${GATE_STATUS}" in
            OK)
              echo "quality gate: OK"
              ;;
            NONE)
              echo "::error::no quality gate is assigned to this project, so the analysis proves nothing. Assign one in SonarQube Cloud: ${DASHBOARD_URL}"
              exit 1
              ;;
            *)
              echo "::error::the SonarQube quality gate reported ${GATE_STATUS}. Failing conditions are in the pull-request comment and at ${DASHBOARD_URL}"
              exit 1
              ;;
          esac
        shell: bash

  # The only job that writes outside this run, and the only one with no token. It runs even
  # when the scan failed: a scan that was cut off still has to say so on the pull request,
  # because a missing comment is indistinguishable from a clean scan.
  #
  # It also runs on a push to a protected branch, and that is what keeps code scanning honest.
  # An alert closes only when a later analysis for the same ref stops reporting it, so without
  # this upload the default branch never gets a second analysis and nothing ever closes —
  # an exclusion added to sonar-project.properties silences the gate while the alert it was
  # written for stays open forever. The PR comment stays pull-request-only; the SARIF does not.
  report:
    needs:
      - preflight
      - sonarqube
    if: ${{ always() && needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # The composite action below is read from the workspace, so the repository has to be
      # present even though nothing here scans it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SonarQube report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonarqube
          path: reports

      - name: Comment SonarQube result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sonarqube-result -->'
          status: "${{ needs.sonarqube.outputs.gate == 'OK' && 'success' || 'findings' }}"
          title: "${{ needs.sonarqube.outputs.gate == '' && '## ⚠️ SonarQube Cloud: CUT OFF (no result produced)' || (needs.sonarqube.outputs.gate != 'OK' && format('## 🚨 SonarQube Cloud: QUALITY GATE {0}', needs.sonarqube.outputs.gate) || (needs.sonarqube.outputs.count == '0' && '## ✅ SonarQube Cloud: PASS (no issues)' || format('## ✅ SonarQube Cloud: quality gate OK ({0} issue(s))', needs.sonarqube.outputs.count))) }}"
          body-file: reports/sonarqube-summary.md
          details-summary: '📄 Summary'

      - name: Upload SonarQube SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: reports/sonarqube.sarif
          category: sonarqube

  # A missing token leaves the scan skipped and the run green, and green is the right
  # answer: a setup gap is not a scan result, and a fork's pull request never receives
  # repository secrets. Silence is not — a pull request with no comment is indistinguishable
  # from one that was scanned and came back clean. This posts under the same marker the
  # result would use, so the notice and a verdict can never both stand.
  unconfigured-notice:
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Describe the gap
        id: gap
        run: |
          set -euo pipefail
          echo "title=## ⚠️ SonarQube Cloud: NOT RUN (SONAR_TOKEN is not configured)" >> "$GITHUB_OUTPUT"
          cat > sonarqube-unconfigured.md <<'EOF'
          `SONAR_TOKEN` is not registered for this repository, so no analysis ran and this
          pull request carries no SonarQube Cloud verdict. The run is green because a
          missing credential is a setup gap rather than a scan result — it is not evidence
          that the code is clean.

          A pull request from a fork always lands here: repository secrets are never
          exposed to one.
          EOF
        shell: bash

      - name: Comment the gap on PR
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sonarqube-result -->'
          status: unconfigured
          title: "${{ steps.gap.outputs.title || '## ⚠️ SonarQube Cloud: CUT OFF (no result produced)' }}"
          body-file: sonarqube-unconfigured.md

  # Deliberately no notification job of either kind. There is no notify-detection because
  # Sonar's baseline over an existing codebase is not zero — it reports maintainability
  # alongside security — so one keyed on "any finding" would fire regardless of what
  # changed, which is the shape of a notification people learn to ignore; ESLint and Bearer
  # are unwired for the same reason. There is no notify-failure either, because the trigger
  # it watched was the scheduled run, and this workflow no longer has one (see the header):
  # every remaining run belongs to a pull request, where the failure is already in front of
  # the person who caused it.
