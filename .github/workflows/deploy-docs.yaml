name: Deploy Docs

# The viewer's build output (`docs/portal/dist/`) is generated here rather than committed, so
# `docs-viewer/**` has to trigger a deploy too: a change confined to the viewer produces no diff
# under `docs/` and would otherwise never reach Pages.
on:
  push:
    branches:
      - production
    paths:
      - "docs/**"
      - "docs-viewer/**"
      - ".makefiles/docs/gen.mk"
      - ".github/workflows/deploy-docs.yaml"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The versions are pinned in mise.toml (SSOT) — never duplicated here. Same pair the
      # node_tool_runner image installs, so CI and the container run the same toolchain.

      - name: Build the portal viewer
        run: make gen-portal-build-ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job talks to the Pages deployment API: `pages: write` creates the
    # deployment and `id-token: write` mints the OIDC token actions/deploy-pages
    # uses to prove its origin. The build job needs neither.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            *.github.io:443

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
