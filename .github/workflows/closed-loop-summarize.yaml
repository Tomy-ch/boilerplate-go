# Fill the reading-comprehension half of a Feedback Issue that could not be read locally.
#
# The normal route is local: `make closed-loop-send` reads the transcript on the machine that
# produced it and creates the issue with its sections already filled. That is preferred because
# the transcript never leaves the machine — reaching a runner would mean publishing the verbatim
# turns to a public issue first (docs/design/security.md, the Secrets section).
#
# This workflow is what happens when that fails: no `claude` on the machine, or the call did not
# return. The send path then labels the issue `feedback/needs-summary` and posts the selected
# turns as a comment, which is the only way a runner can see them. So the trigger is that label
# and not `feedback` — gating on `feedback` would re-summarize every window that was already read.
name: Closed Loop Summarize

# 取り直しは `feedback/needs-summary` を付け直して行う。workflow_dispatch の入力で issue 番号を
# 受ける形も採れるが、ラベルの付け外しで同じことができるうえ、番号を人が打ち込む経路が増える。
on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  summarize:
    # Only an issue the local path could not read, and only when that label arrives. Gating on the
    # github context alone means an unrelated label never starts a runner.
    if: github.event.label.name == 'feedback/needs-summary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      # `claude-code-action` reaches GitHub through a token it mints itself, by exchanging this
      # workflow's OIDC identity with the Claude GitHub App. Without the permission the exchange
      # fails and the action stops before the model runs. It grants no repository access of its
      # own — only the right to request a JWT that names this workflow.
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.anthropic.com:443
            *.anthropic.com:443
            statsig.anthropic.com:443
            sentry.io:443
            *.ingest.sentry.io:443

      # A derived repository inherits this workflow but not the secret. Skipping quietly is what
      # keeps the loop optional for them without leaving a red run behind (ADR-0007: the
      # application never depends on AI, and neither does anyone's CI turning green).
      - name: Check configuration
        id: config
        env:
          CLAUDE_CODE_TOKEN: ${{ secrets.CLAUDE_CODE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_CODE_TOKEN}" ]; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::notice::CLAUDE_CODE_TOKEN is not configured; skipping.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        if: steps.config.outputs.configured == 'true'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_TOKEN }}
          claude_args: "--max-turns 12"
          prompt: |
            Feedback Issue #${{ github.event.issue.number }} の H2 節を埋めてください。

            手順:
            1. `gh issue view ${{ github.event.issue.number }} --json body,comments` で
               本文とコメントを読む。
            2. 本文の ```yaml closed-loop ブロックは決定論的な観測です。**書き換えないでください。**
               ここが集計の入力であり、手を入れると週次の数字が変わります。
            3. コメントの「読解候補」に、機械が選んだ逐語の抜粋があります。それを主な材料にする。
            4. 本文の H2 節（Outcome / Friction / AI Misunderstanding / Skill / Rule Gap /
               Tooling Gap / Human Intervention / Suggested Improvement / Evidence）を日本語で埋め、
               `gh issue edit` で本文を差し替える。YAML ブロックと節見出しはそのまま残すこと。

            書き方:
            - 読み取れないことは書かない。候補に根拠が無い節は「該当なし」と書く。
              埋めるために推測すると、この issue が後で集計されたとき、根拠の無い所見が
              数に入る。
            - Evidence には、根拠にした候補の逐語か、PR / コミットへの参照を置く。
            - Suggested Improvement は、対象（skill / rule / doc / ci / tool）が特定できる場合だけ書く。
              特定できないなら書かない。

            分類ラベル:
            - 読み取れた内容に応じて `gh issue edit --add-label` で
              feedback/skill, feedback/architecture, feedback/documentation, feedback/tooling,
              feedback/ai-misread, feedback/ci, feedback/developer-experience のうち該当するものを付ける。
            - 該当が無ければ付けない。付けないことも情報です。

            最後に `gh issue edit ${{ github.event.issue.number }} --remove-label feedback/needs-summary`
            で待ち受けのラベルを外してください。外し忘れると、この issue が「まだ読解されていない」
            ものとして残り続けます。
