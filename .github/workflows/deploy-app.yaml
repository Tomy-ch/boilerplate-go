name: Deploy App

on:
  push:
    branches:
      - production
      - staging
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""

    steps:
      # WARN: this allowlist encodes the same registry assumption the steps below
      #       carry — ghcr.io for push, and Sigstore's public good instance for
      #       keyless signing. A project that changes the registry or runs a private
      #       Fulcio / Rekor must add those hosts here as well, or the push and the
      #       signature fail at the network layer with no clue pointing at this step.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80
            oauth2.sigstore.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Get release version
        id: meta_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 --first-parent 2>/dev/null || echo "none")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get build date
        id: meta_date
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Define build environment
        id: meta_env
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" == "production" ]]; then
            echo "app_env=prd" >> "$GITHUB_OUTPUT"
          elif [[ "${REF_NAME}" == "staging" ]]; then
            echo "app_env=stg" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
          fi

      # WARN: signing / attestation downstream all reference this meta_registry (ghcr.io is not hardcoded).
      #       When moving to another registry, replace this registry value and the Login to registry step below.
      - name: Define registry
        id: meta_registry
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "Note: Please modify this section according to your environment"
          OWNER=$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$OWNER" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: meta_tags
        env:
          VERSION: ${{ steps.meta_version.outputs.version }}
          REGISTRY: ${{ steps.meta_registry.outputs.registry }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "tags<<${DELIM}"
            echo "${REGISTRY}/app:${SHORT_SHA}${SUFFIX}"
            if [[ "$VERSION" != "none" ]]; then
              echo "${REGISTRY}/app:${VERSION}-${SHORT_SHA}${SUFFIX}"
              echo "${REGISTRY}/app:${VERSION}${SUFFIX}"
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # WARN: Replace this step when migrating to another registry.
      #       The downstream build / signing / attestation depend on the auth session established here.
      - name: Login to registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Login to container registry here (ECR/GCR/ACR/GHCR)"
          echo "Note: Please modify this section according to your environment"
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

      - name: Generate vendor
        run: |
          go mod vendor

      - name: Build and push image (${{ matrix.target }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/server/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta_version.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.meta_date.outputs.build_date }}
            APP_ENV=${{ steps.meta_env.outputs.app_env }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta_date.outputs.build_date }}
            org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta_registry.outputs.registry }}/app
          subject-digest: ${{ steps.build.outputs.digest }}
          # WARN: push-to-registry attaches the attestation to the registry as an OCI 1.1 referrer.
          #       Recording into the GitHub Attestation store is registry-independent and always happens, but
          #       this referrer attachment succeeds only when the target registry supports OCI referrers. For a
          #       registry without support, set this to false and fall back to verifying via the GitHub record
          #       (+ cosign signature) only.
          push-to-registry: true

      - name: Sign image (cosign keyless)
        env:
          IMAGE_DIGEST_REF: ${{ steps.meta_registry.outputs.registry }}/app@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_DIGEST_REF}"

      # NOTE: Intentional duplication — this plays a different role than the SBOM in image-scan.yaml.
      #       Do not remove either one. This SBOM targets the pushed digest and is attached to the attestation.
      - name: Generate SBOM (SPDX) for pushed image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta_registry.outputs.registry }}/app@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ${{ steps.meta_registry.outputs.registry }}/app
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.target }}.spdx.json
          # WARN: Same OCI referrer attachment as Attest build provenance above. Set to false for a registry without support.
          push-to-registry: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name }}
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      # The steps in this job are placeholders that only echo, so the allowlist is
      # the base set and nothing more. Wiring a real deployment in means adding the
      # cloud control-plane hosts for the chosen provider (`sts.amazonaws.com`,
      # `*.googleapis.com`, `login.microsoftonline.com`, the cluster API endpoint, …)
      # — the OIDC token exchange this job holds `id-token: write` for is an outbound
      # call like any other.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Configure cloud credentials
        run: |
          echo "Configure authentication for target cloud environment"
          echo "Note: Please modify this section according to your environment"
          echo "- Must use environment-specific credentials"
          echo "- Should leverage OIDC / Workload Identity / Federated Identity"
          echo "- Must be executed before migration and deployment"
          echo "    - AWS: IAM Role (OIDC)"
          echo "    - GCP: Workload Identity Federation"
          echo "    - Azure: Federated Identity"

      - name: Run migration (one-time job)
        run: |
          echo "Run database migration as a one-time job before deployment"
          echo "Note: Please modify this section according to your environment"
          echo "- Must be executed exactly once per deployment"
          echo "- Should be triggered from CI or a job system"
          echo "- ENV is fixed at build time per branch image (no runtime injection needed)"
          echo "Example (local/docker run):"
          echo "docker run <image> /app/server migrate-up   # run the runtime image with a command override"
          echo "    - AWS: ECS RunTask / EKS (Kubernetes Job)"
          echo "    - GCP: Cloud Run Job/ GKE (Kubernetes Job)"
          echo "    - Azure: Container App Job / AKS(Kubernetes Job)"
          echo "- Must NOT be executed in container startup (entrypoint)"

      - name: Deploy application
        run: |
          echo "Deploy application after successful migration"
          echo "Note: Please modify this section according to your environment"
          echo "- Application must start in 'serve' mode only"
          echo "- Migration must be completed beforehand"
          echo "- ENV is fixed into the image at build time (no runtime injection needed)"
          echo "Example (local/docker run):"
          echo "docker run <image>"
          echo "- Deployment mechanism depends on environment"
          echo "    - AWS: ECS / EKS / App Runner"
          echo "    - GCP: Cloud Run / GKE"
          echo "    - Azure: Container Apps / AKS"
