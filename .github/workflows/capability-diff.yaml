name: Capability Diff

# capslock reports which capabilities (network, exec, unsafe, reflect, file access,
# …) the dependency graph can actually reach, and diffs that against the base
# branch. It answers a question none of the other scanners ask: OSV and Trivy ask
# "is this dependency known-vulnerable", and an SBOM lists what is present — but a
# freshly compromised package is in neither. What it does show up as is a
# dependency that suddenly gained the ability to exec a process or open a socket.
#
# Report-only, permanently. A new capability is frequently legitimate (a library
# adds a cache, so it gains FILES), so failing on it would train reviewers to
# ignore the check. The value is in a human reading "this logging library now
# reaches EXEC" during review.
#
# Go-only by construction: capslock analyses Go call graphs, so the npm side of
# this repository is not covered. That asymmetry, and why no equivalent tool is
# adopted for npm, is recorded in ADR-0093 (multi-layer-security-scanning).

on:
  pull_request:
    paths:
      - '.github/workflows/capability-diff.yaml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443

      # fetch-depth: 0 so the base commit is available for git worktree. The base
      # tree is materialized outside the workspace so the head analysis cannot walk
      # into it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: go:github.com/google/capslock/cmd/capslock
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The version is pinned in mise.toml (SSOT) — never duplicated here.

      - name: Capture the base capability set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # The binary is resolved here, in the workspace, and then invoked by
          # absolute path inside the base worktree. mise reads its config from the
          # working directory, and the base commit's mise.toml does not necessarily
          # declare capslock — it did not when this workflow was introduced, so the
          # shim failed to resolve there. Pinning the path also guarantees both
          # sides of the diff are produced by the same binary; letting each tree
          # resolve its own would contaminate the comparison with version drift.
          CAPSLOCK="$(mise which capslock)"

          git worktree add --detach "${RUNNER_TEMP}/caps-base" "${BASE_SHA}"
          (
            cd "${RUNNER_TEMP}/caps-base"
            "${CAPSLOCK}" -packages ./... -output json -granularity package
          ) > "${GITHUB_WORKSPACE}/capabilities-base.json"
        shell: bash

      # capslock's compare mode exits 0 whether or not anything changed, so the
      # presence of output is the signal rather than the exit code.
      - name: Diff against the base
        id: diff
        run: |
          set -euo pipefail

          # fence_for mirrors upsert-pr-comment's fenceFor: needed for GITHUB_STEP_SUMMARY, which renders the file unwrapped. See README.md § PR comment fencing.
          # `-a`: without it a single NUL byte makes grep report a binary match and print nothing,
          # collapsing the fence back to three backticks.
          fence_for() {
            local longest len
            longest="$({ grep -a -o '`\{1,\}' "$1" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n + 0 }')"
            len=$(( longest + 1 ))
            if [ "$len" -lt 3 ]; then len=3; fi
            printf '%*s' "$len" '' | tr ' ' '\140'
          }

          capslock -packages ./... -output compare -granularity package \
            capabilities-base.json > capability-diff.txt 2>&1 || true

          if [ -s capability-diff.txt ]; then
            LINES=$(wc -l < capability-diff.txt | tr -d ' ')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "title=## 🔎 Capability Diff: この PR で依存の capability が変化しました" >> "$GITHUB_OUTPUT"
            # No fence around the diff: this call passes details-summary, so the action fences the
            # whole body and one here would render as literal backticks inside it. The limit keeps
            # the body under the action's 45000 character default so the note below is not
            # truncated away.
            {
              echo "以下は report-only です。マージはブロックしません。"
              echo "意図した変更かをレビューで確認してください（例: ログ出力のライブラリが EXEC に到達し始めた等）。"
              echo
              head -c 40000 capability-diff.txt | iconv -f UTF-8 -t UTF-8 -c
              if [ "${LINES}" -gt 500 ]; then
                echo
                echo "> 出力が長いため先頭のみ表示しています。全文は artifact を参照してください。"
              fi
            } > capability-diff-summary.md
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Capability Diff: 依存の capability に変化なし" >> "$GITHUB_OUTPUT"
            echo "この PR は依存の到達可能な capability を変えていません。" > capability-diff-summary.md
          fi

          summary_fence="$(fence_for capability-diff-summary.md)"
          {
            echo "${summary_fence}text"
            cat capability-diff-summary.md
            echo "${summary_fence}"
          } >> "${GITHUB_STEP_SUMMARY}"
        shell: bash

      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capability-diff
          path: |
            capabilities-base.json
            capability-diff.txt
            capability-diff-summary.md

      - name: Comment capability diff on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- capability-diff-result -->'
          status: "${{ steps.diff.outputs.changed == 'false' && 'success' || 'changed' }}"
          title: "${{ steps.diff.outputs.title || '## ⚠️ Capability Diff: CUT OFF (no result produced)' }}"
          body-file: capability-diff-summary.md
          details-summary: '📄 Summary'
