name: Doc Language Removal Check

# `make setup-remove-doc-language` が主張どおりに動くことを検証する。
#
# 撤去は template の利用者側で一度きり走るもので、失敗しても壊れるのは利用者のリポジトリであり
# こちらでは何も赤くならない。だからここで走らせる。しかもこの撤去は 500 件規模のファイルを消し、
# `ja` では改名まで行うため、取りこぼしの影響が他のどの撤去より大きい。
#
# 本命は「撤去後のリポジトリが緑であること」である。対訳の存在を前提にした検査（doc-ref-lint の
# ペア検査・skill-lint の SKILL.ja.md 必須）はマーカーで落としており、落とし損ねは撤去した人の
# 手元で初めて赤くなる。ここで先に踏んでおく。
#
# `ja` にはもう 1 つ、この経路でしか現れない退行がある。対訳は本文しか持たないので、正本の
# フロントマターを移植し損ねると、日本語を選んだだけでスキルが 1 本残らず読み込まれなくなる。
# ファイルは全て在るので、検査を書かない限り誰も気づけない。

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/doc-language-removal-check.yaml'
      - 'scripts/setup/remove-doc-language/**'
      - 'scripts/setup/lib/**'
      - 'scripts/package.json'
      - 'scripts/pnpm-lock.yaml'
      - 'docs-viewer/package.json'
      - 'docs-viewer/pnpm-lock.yaml'
      - '.makefiles/**'
      - 'makefile'
      - 'docs/portal/manifest.yaml'
  pull_request:
    paths:
      - '.github/workflows/doc-language-removal-check.yaml'
      - 'scripts/setup/remove-doc-language/**'
      - 'scripts/setup/lib/**'
      - 'scripts/package.json'
      - 'scripts/pnpm-lock.yaml'
      - 'docs-viewer/package.json'
      - 'docs-viewer/pnpm-lock.yaml'
      - '.makefiles/**'
      - 'makefile'
      - 'docs/portal/manifest.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-language-removal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      # 残存検査から外す生成物。検査の主題は「畳んだ結果ツリーが辻褄の合う状態か」で、生成物は
      # 正本ではなく、畳んだあと各生成ターゲット（`gen-docs` / `gen-portal-build` / `gen-godoc` /
      # `gen-api-docs` / `graphify-update` など）が正本から作り直す。撤去ツールが走査から外す
      # `doc-language.ts` の `EXCLUDED_PREFIXES` の生成物に、portal の配信物と OpenAPI の出力を
      # 足した集合である。
      GENERATED_EXCLUDES: >-
        :!docs/portal/dist
        :!docs/portal/guides
        :!docs/godoc
        :!docs/coverage
        :!docs/db-schema
        :!docs/openapi
        :!graphify-out

    strategy:
      fail-fast: false
      matrix:
        # `en` と `ja` は行き先が同じ（対訳ペアの無い 1 言語）で、違うのはどちらのファイルが
        # 残るかだけ。別々に回すのは、`ja` の改名とフロントマター移植が `en` には無い経路
        # だからである。`both` は畳まないが何もしないわけでもなく、マーカーを解決して
        # ツール自身を撤去する —— 行き先が違うので、後段の検査だけを分ける。
        lang: [en, ja, both]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:pnpm npm:markdownlint-cli2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `docs-viewer` も入れる。畳むとポータルの取り込みから言語の軸が外れ、その型変更は
      # `.ja.md` を一言も含まないテストフィクスチャを壊す —— 綴りを見張る検査には映らず、
      # 型検査だけが見つけられる種類の破損である。
      - name: Install node deps
        run: |
          set -euo pipefail
          pnpm install --dir scripts --frozen-lockfile
          pnpm install --dir docs-viewer --frozen-lockfile
        shell: bash

      # 撤去はコミットを積むので、コミッターの身元が要る。ローカル実行では利用者自身の
      # 身元をそのまま使うため、make ターゲット側には持たせずここで設定する。
      - name: Configure the committer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        shell: bash

      - name: Dry run writes nothing
        run: |
          set -euo pipefail
          DRY_RUN=1 make setup-remove-doc-language LANG_CHOICE=${{ matrix.lang }}
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::DRY_RUN の実行が作業ツリーを変更しました"
            git status --porcelain
            exit 1
          fi
          echo "dry run: no writes"
        shell: bash

      - name: Resolve the documentation language
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          make setup-remove-doc-language LANG_CHOICE=${{ matrix.lang }}
          if [ "$(git rev-parse HEAD)" = "${BEFORE}" ]; then
            echo "::error::撤去がコミットを積みませんでした"
            exit 1
          fi
          git log --oneline "${BEFORE}..HEAD"
        shell: bash

      - name: No translation pair survives
        if: matrix.lang != 'both'
        run: |
          set -euo pipefail
          LEFTOVER=$(git ls-files '*.ja.md')
          if [ -n "${LEFTOVER}" ]; then
            echo "::error::対訳が残っています"
            echo "${LEFTOVER}"
            exit 1
          fi
          echo "fold: no *.ja.md remains"
        shell: bash

      # `both` は畳まないので、残っていることと解決済みであることの両方を見る。片方だけでは
      # 「何もしなかった」と「正しく解決した」が区別できない。
      - name: Both languages survive with the markers resolved
        if: matrix.lang == 'both'
        run: |
          set -euo pipefail
          if [ -z "$(git ls-files '*.ja.md')" ]; then
            echo "::error::両方を残す選択なのに対訳が 1 つも残っていません"
            exit 1
          fi
          # 改行込みで渡っても壊れないよう空白へ均してから配列にする。
          read -ra EXCLUDES <<< "$(tr '\n' ' ' <<< "${GENERATED_EXCLUDES}")"
          LEFTOVER=$(git grep -nE '(//|#|%%|<!--) ?doc-pair:(begin|end|line|replace-)' -- . \
            "${EXCLUDES[@]}" || true)
          if [ -n "${LEFTOVER}" ]; then
            echo "::error::言語選択のマーカーが解決されずに残っています"
            echo "${LEFTOVER}"
            exit 1
          fi
          for kept in .claude/skills/canonicalize-doc docs-viewer/src/lang-filter docs/portal/guides/ja; do
            if [ ! -e "${kept}" ]; then
              echo "::error::${kept} が消えました。両方を残す選択では対訳を運ぶ仕組みも残ります"
              exit 1
            fi
          done
          for gone in scripts/setup/remove-doc-language .github/workflows/doc-language-removal-check.yaml; do
            if [ -e "${gone}" ]; then
              echo "::error::${gone} が残っています。選び終えた以上このツールは自消滅します"
              exit 1
            fi
          done
          echo "both: pairs kept, markers resolved, tool retired"
        shell: bash

      # 3 モード共通。ツールは自分で消えるが、それを宣言している側 —— make ターゲット、
      # ターゲット表の行、この手順書の節、静的解析の除外パス —— は別の契機で落とす必要がある。
      # 残ると「呼べば失敗するターゲットが手順書つきで残る」状態になり、`both` は畳まないぶん
      # マーカーの中身を残す向きに解決するので、そこだけが取り残される。
      #
      # `docs/adr` を外すのは、ADR-0011 の言及が `boilerplate-only` ブロックの中に在るためである。
      # あれは Phase 12 のボイラープレート撤去で先に落ちるが、ここではこのツールしか走らせない。
      # 生成物を外す理由は job の `GENERATED_EXCLUDES` に書いてある。
      - name: Nothing still declares the retired tool
        run: |
          set -euo pipefail
          # 改行込みで渡っても壊れないよう空白へ均してから配列にする。
          read -ra EXCLUDES <<< "$(tr '\n' ' ' <<< "${GENERATED_EXCLUDES}")"
          LEFTOVER=$(git grep -nE 'setup-remove-doc-language|remove-doc-language|LANG_CHOICE' -- . \
            ':!docs/adr' "${EXCLUDES[@]}" || true)
          if [ -n "${LEFTOVER}" ]; then
            echo "::error::自消滅したツールへの言及が残っています"
            echo "${LEFTOVER}"
            exit 1
          fi
          LEFTOVER=$(git grep -nE '(//|#|%%|<!--) ?lang-choice:(begin|end|line|replace-)' -- . \
            "${EXCLUDES[@]}" || true)
          if [ -n "${LEFTOVER}" ]; then
            echo "::error::ツールに紐づくマーカーが解決されずに残っています"
            echo "${LEFTOVER}"
            exit 1
          fi
          echo "retire: nothing declares the tool"
        shell: bash

      # `ja` だけの退行。対訳は本文しか持たないため、正本のフロントマターを移植し損ねると
      # ファイルは全て在るのにスキルが 1 本も読み込まれない状態になる。
      - name: Every skill still carries its frontmatter
        run: |
          set -euo pipefail
          FAILED=0
          for skill in .claude/skills/*/SKILL.md .codex/skills/*/SKILL.md; do
            [ -e "${skill}" ] || continue
            if [ "$(head -n 1 "${skill}")" != '---' ]; then
              echo "::error file=${skill}::フロントマターがありません（スキルとして読み込まれません）"
              FAILED=1
            fi
          done
          [ "${FAILED}" -eq 0 ]
          echo "fold: every SKILL.md keeps its frontmatter"
        shell: bash

      # `skill-lint` はここでしか出ない退行を捕まえる。frontmatter の `description` は YAML の
      # ブロックスカラーで、マーカーを置けないぶん宣言だけが頼りになる。畳んだ後に空になっても
      # ファイルは在るので、行頭の `---` を見るだけの検査では通ってしまう。
      - name: The folded repository is green
        run: |
          set -euo pipefail
          make md-markdownlint-ci
          pnpm --dir scripts run tsx scripts/skill-lint
          pnpm --dir scripts run tsx scripts/doc-ref-lint
          pnpm --dir scripts run tsx scripts/premise-lint
          pnpm --dir scripts run typecheck
          pnpm --dir scripts test
          pnpm --dir docs-viewer run typecheck
          pnpm --dir docs-viewer test
        shell: bash
