name: Go Cooldown

# Unlike npm, Go has no resolver-side cooldown: nothing lets `go get` refuse a version for
# being too new, and `.npmrc`'s `min-release-age` has no counterpart in `go.mod`. This
# workflow is therefore not a detector for a bypassed guard — it *is* the guard, and the
# window exists nowhere else.
#
# On a pull request it gates: only the requirements the change adds or upgrades are checked,
# so the modules already in `go.mod` are grandfathered rather than blocking every branch.
# Only direct requirements fail the check. An indirect version is chosen by MVS and can be
# pinned below a direct dependency's own lower bound, so failing on one would produce a red
# nobody can resolve; those are reported instead.
#
# The scheduled run audits every requirement and never fails on the window. What it does fail
# on is the bypass file: an entry whose deadline has passed, whose deadline reaches further
# than the allowed maximum, or that no longer matches anything in `go.mod`. A deadline arrives
# without `go.mod` changing, so the pull-request trigger alone would never notice one expiring
# — the schedule is what collects them.

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'scripts/go-cooldown/**'
      - '.github/go-cooldown-bypass.toml'
      - '.github/workflows/go-cooldown.yaml'
  schedule:
    - cron: '15 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-cooldown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The default checkout is shallow, so the base commit is absent and `git show
      # <base>:go.mod` fails. Fetching the base ref explicitly is what makes the diff
      # resolvable; without it the gate cannot tell an added requirement from an existing one.
      - name: Resolve gate base
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_REF}" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=200 origin "${BASE_REF}"
          echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"

      # The summary body is written by the tool, which fences every value it did not author
      # itself: a module path comes out of `go.mod`, which the pull request controls, and the
      # step summary renders Markdown. The headings stay live so the report reads as a report.
      - name: Check Go module cooldown
        shell: bash
        env:
          GATE_BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail

          if [ -n "${GATE_BASE}" ]; then
            go run ./scripts/go-cooldown gate --base="${GATE_BASE}" --github \
              --summary-out=go-cooldown-summary.md \
              && status=0 || status=$?
          else
            go run ./scripts/go-cooldown audit --github \
              --summary-out=go-cooldown-summary.md \
              && status=0 || status=$?
          fi

          cat go-cooldown-summary.md >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
