name: Go Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Why the trigger condition lives in a job: README.md § Required checks report on every pull request.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # fetch-depth: 0 so the PR's base and head commits are present locally. The filter
      # below compares them with `git diff`; the default shallow checkout fetches only the
      # merge commit, so neither parent resolves.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # An empty token selects `git diff` over the compare API. The API refuses a
          # large diff outright (`this diff is taking too long to generate`), and a filter
          # that reaches no verdict runs every gated job instead of skipping it.
          token: ''
          filters: |
            relevant:
              - '.github/workflows/go-test.yaml'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '**/*.sql'

  go-test:
    needs: changes
    # Fail open — README.md § Required checks report on every pull request.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password
    services:
      database:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
      dynamodb_local:
        # DynamoDB Local, the Realtime Delivery store. Service-container defaults: README.md § Notes.
        image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - "8000:8000"
        options: >-
          --health-cmd="curl -s -o /dev/null http://localhost:8000"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s
      goaws:
        # SNS / SQS emulator for the Realtime Delivery fan-out. Service-container defaults: README.md § Notes.
        image: admiralpiett/goaws:v0.5.4@sha256:18589afe16517751cc981354536c148854157a718bee9059494d6cdee3dc4e2d
        ports:
          - "4100:4100"
        options: >-
          --health-cmd="nc -z localhost 4100"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=5s
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80
            apt.postgresql.org:443
            apt.postgresql.org:80
            www.postgresql.org:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Materialize ci env for embedding
        run: make materialize-env

      # shellcheck: mise.toml holds the pinned version actions-shellcheck's tests are checked
      # against, so the runner's own build is not enough (.makefiles/README.md, make test-scripts).
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: shellcheck
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scripts tool tests
        id: scripts-test
        shell: bash
        env:
          REQUIRE_SHELLCHECK: '1'
        run: |
          set +e
          make test-scripts 2>&1 | tee /tmp/go-test-scripts.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      # Measured against its own threshold and its own profile, and reported as a warning rather
      # than a failure. These tools are build/CI tooling, not part of what ships: a gap here says
      # nothing about the product, so letting it block a merge would stop work for a reason
      # unrelated to the change under review. The shipped code keeps its hard gate below.
      - name: Report scripts tool coverage
        env:
          REQUIRE_SHELLCHECK: '1'
        run: make cover-scripts

      - name: Initialize Database Table
        run: go run ./cmd/ migrate-up --database "$DB"

      - name: Seed Database
        run: go run ./cmd/ db-seed --database "$DB"

      - name: Run Tests with Coverage
        id: cover-test
        shell: bash
        run: |
          set +e
          make test-cover-ci 2>&1 | tee /tmp/go-test-cover.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      # A profile written by a run that failed measures whichever packages happened to finish, so
      # both the report and the gate are read as facts about a codebase that never passed. They are
      # gated on the clean signal itself rather than on the job's state, which the recorded exit
      # code above no longer reflects.
      - name: Report Test Coverage
        if: steps.cover-test.outputs.exit_code == '0'
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1

      # Coverage below the threshold is an ordinary outcome of an ordinary change, so it reaches
      # the comment the way a failing test does rather than only turning the check red. The gate
      # prints the measured total against the threshold, which is the whole of what a reader needs.
      - name: Coverage gate
        id: cover-gate
        if: steps.cover-test.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          make cover-gate 2>&1 | tee /tmp/go-test-gate.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      # always() rather than the implicit `success() &&`: the DB setup steps sit between the two
      # test runs, so an earlier step failing outright is an ordinary path here, not only a
      # cut-off. Skipping would answer it with the action's cut-off notice, which names no cause
      # and would drop the scripts-test result that had already been captured.
      - name: Build PR comment body
        id: comment
        if: always() && github.event_name == 'pull_request'
        shell: bash
        # Read as variables rather than interpolated: these four values look safe today, but that is
        # a property of their producers, not of this step. README.md § Notes.
        env:
          SCRIPTS_CODE: ${{ steps.scripts-test.outputs.exit_code }}
          COVER_CODE: ${{ steps.cover-test.outputs.exit_code }}
          GATE_CODE: ${{ steps.cover-gate.outputs.exit_code }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          # A step that never ran leaves its output empty, which arrives here as an unset variable
          # rather than an empty one, so every read carries the fallback.
          scripts_code="${SCRIPTS_CODE-}"
          cover_code="${COVER_CODE-}"
          gate_code="${GATE_CODE-}"

          # The three steps above no longer fail the job themselves and every other step that can
          # sits before this one, so `success` here means nothing else went wrong — octocov, the
          # database setup, a `mise install`. Reading it keeps the verdict from claiming a pass on
          # a job that is already red, without enumerating steps whose only report is having failed.
          job_status="${JOB_STATUS-}"

          # Derived from the clean signal, so a step that never ran leaves an empty value that is
          # not `0` and therefore reports, rather than reading as a pass.
          if [ "$scripts_code" = "0" ] && [ "$cover_code" = "0" ] && [ "$gate_code" = "0" ] \
            && [ "$job_status" = "success" ]; then
            status=success
          else
            status=failure
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"

          out=/tmp/go-test-comment.md

          if [ "$status" = "success" ]; then
            echo "title=## ✅ Go test: PASS" >> "$GITHUB_OUTPUT"
            # Reached only when an earlier push left a red comment to overwrite; a passing run
            # creates none. The failure log has nothing left to say, so the body states the verdict.
            echo "All Go tests passed." > "$out"
            exit 0
          fi

          echo "title=## ❌ Go test: FAIL" >> "$GITHUB_OUTPUT"
          # Each opening answers the question its own case raises. Sections that are all clean on a
          # failing run otherwise read as the comment contradicting the check, and sections that all
          # say "not run" read as the comment having lost them. In the ordinary case what was left
          # out is stated here rather than only in the fold label, so a reader who finds nothing
          # about a package knows it passed instead of wondering whether the comment dropped it.
          if [ -z "$scripts_code" ] && [ -z "$cover_code" ] && [ -z "$gate_code" ]; then
            echo 'No test run was reached: the job failed before it got there — see the run log.' > "$out"
          elif [ "$scripts_code" = "0" ] && [ "$cover_code" = "0" ] && [ "$gate_code" = "0" ]; then
            echo 'Every run captured below came back clean, so the failure is in a step this comment does not capture — see the run log.' > "$out"
          else
            echo 'Passing packages are omitted; the full output is in the run log.' > "$out"
          fi
          echo "" >> "$out"

          # Two sections share the action's 45000 character default, which it applies before
          # building the fence on the details-summary path, so a trim here cannot leave the block
          # unclosed. The cap keeps one runaway section from crowding the other out.
          section_limit=18000

          write_section() {
            local label="$1" src="$2" code="$3"
            printf '=== %s ===\n' "$label" >> "$out"

            if [ -z "$code" ]; then
              printf '(not run)\n\n' >> "$out"
              return
            fi
            if [ ! -f "$src" ]; then
              printf '(log not found)\n\n' >> "$out"
              return
            fi

            # `go test` reports every package that passed on a line of its own, and a repository
            # this size answers one broken assertion with a hundred of them — which is what buries
            # the failure the reader came for. Dropping those two forms leaves the failures, and
            # passes through build errors, panics and race reports: those are the other reasons a
            # run fails and none of them takes the `--- FAIL` shape a narrower filter would look for.
            # `-a`: without it a single NUL byte makes grep treat the log as binary and print nothing.
            local filtered=/tmp/go-test-section.log
            { grep -avE '^(ok|\?)[[:space:]]' "$src" || true; } > "$filtered"

            if [ ! -s "$filtered" ]; then
              if [ "$code" = "0" ]; then
                printf '(passed)\n\n' >> "$out"
              else
                # A non-zero exit whose whole log was filtered away. The filter recognises the
                # passing forms rather than the failing ones precisely so this stays rare, but a
                # section that said nothing at all would read as if the run had been fine.
                printf '(exit %s, no output left after dropping the passing packages; see the run log)\n\n' "$code" >> "$out"
              fi
              return
            fi

            # head cuts on a byte boundary and Go test names in this repository are Japanese, so it
            # can split a trailing multi-byte character. `-c` drops an invalid sequence mid-stream
            # but not a truncated one at the end: iconv exits non-zero there, which under
            # `set -euo pipefail` would fail this step over a cut that landed one byte off. It
            # writes the converted prefix before exiting, which is the wanted result.
            # sed: the action sizes its fence from the longest backtick run in the body, so a run
            # this long would spend the size budget on the fence alone.
            # tr: a NUL is valid UTF-8, so it survives the conversion and lands in the request the
            # comment is posted with, which the API rejects. The comment step is
            # `continue-on-error`, so that failure would take the comment down silently — the one
            # outcome this whole path exists to prevent, on exactly the kind of run that produces
            # a stray NUL. The same byte is why the filter above needs `grep -a`.
            { head -c "$section_limit" "$filtered" | tr -d '\000' | iconv -f UTF-8 -t UTF-8 -c || true; } \
              | sed -E 's/`{10,}/[long backtick run elided]/g' >> "$out"
            if [ "$(wc -c < "$filtered")" -gt "$section_limit" ]; then
              printf '\n... (log truncated)\n' >> "$out"
            fi
            printf '\n' >> "$out"
          }

          write_section 'make test-scripts' /tmp/go-test-scripts.log "$scripts_code"
          write_section 'make test-cover-ci' /tmp/go-test-cover.log "$cover_code"
          write_section 'make cover-gate' /tmp/go-test-gate.log "$gate_code"

      - name: Comment Go test result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- go-test-result -->'
          status: ${{ steps.comment.outputs.status }}
          title: "${{ steps.comment.outputs.title || '## ⚠️ Go Test: CUT OFF (no result produced)' }}"
          body-file: /tmp/go-test-comment.md
          details-summary: 'go test log'

      # The verdict is re-derived from the exit codes rather than read off the comment step, which
      # only runs for a pull request and could not carry the check on any other trigger.
      - name: Fail if Go tests failed
        if: always()
        shell: bash
        # Read as environment for the same reason as the step above.
        env:
          SCRIPTS_CODE: ${{ steps.scripts-test.outputs.exit_code }}
          COVER_CODE: ${{ steps.cover-test.outputs.exit_code }}
          GATE_CODE: ${{ steps.cover-gate.outputs.exit_code }}
        run: |
          scripts_code="${SCRIPTS_CODE-}"
          cover_code="${COVER_CODE-}"
          gate_code="${GATE_CODE-}"

          # Empty means the run never reached its own exit: the job was cut off, or a step before
          # it failed outright.
          if [ -z "$scripts_code" ] || [ -z "$cover_code" ] || [ -z "$gate_code" ]; then
            echo "a test step produced no exit code; see the steps above for how far the job got"
            exit 1
          fi
          if [ "$scripts_code" != "0" ]; then
            echo "make test-scripts failed with exit code $scripts_code"
          fi
          if [ "$cover_code" != "0" ]; then
            echo "make test-cover-ci failed with exit code $cover_code"
          fi
          if [ "$gate_code" != "0" ]; then
            echo "make cover-gate failed with exit code $gate_code"
          fi
          if [ "$scripts_code" != "0" ] || [ "$cover_code" != "0" ] || [ "$gate_code" != "0" ]; then
            exit 1
          fi
