name: Secret Scan

on:
  pull_request:
  schedule:
    - cron: '45 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request scans the working tree, so depth 1 is enough. schedule /
          # workflow_dispatch scan the whole history, so fetch it in full.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: gitleaks
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run gitleaks
        id: gitleaks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e

          # pull_request: scan the working tree (fast review gate).
          # schedule / workflow_dispatch: scan the entire commit history so secrets that were
          # committed and later deleted are still detected after merge.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            make secret-scan-ci 2>&1 | tee /tmp/gitleaks.log
          else
            make secret-scan-history-ci 2>&1 | tee /tmp/gitleaks.log
          fi

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Secret scan: PASS (gitleaks)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Secret scan: FAIL (gitleaks)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment secret scan result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- secret-scan-result -->'
          status: ${{ steps.gitleaks.outputs.status }}
          title: "${{ steps.gitleaks.outputs.title || '## ⚠️ Secret Scan: CUT OFF (no result produced)' }}"
          body-file: /tmp/gitleaks.log
          details-summary: 'gitleaks log'

      - name: Fail if gitleaks failed
        if: always() && steps.gitleaks.outputs.status != 'success'
        run: exit 1

  # Trivy's secret scanner over the same working tree, as a separate job so its
  # verdict, comment and artifact never mix with the gitleaks one above.
  #
  # The overlap with gitleaks is deliberate and the two are not interchangeable:
  # gitleaks casts a wide regex / entropy net, Trivy matches a curated rule set that
  # false-positives far less — the checked-in *public* keys under
  # internal/integration/testdata/keys/ need a .gitleaksignore entry and produce no
  # Trivy finding at all. For a class of defect where a miss is unrecoverable, two
  # detectors with different failure modes is the point.
  #
  # This job scans the working tree only. History is gitleaks' job
  # (secret-scan-history-ci) and TruffleHog's (trufflehog.yaml).
  trivy-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:aquasecurity/trivy
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy secret scan (JSON)
        run: make -s trivy-secret-ci TRIVY_FORMAT=json > trivy-secret.json
        shell: bash

      - name: Create Trivy secret summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # Findings live under .Results[].Secrets; a file with none carries no Secrets
          # key, and Results itself is absent rather than empty when nothing was
          # scanned at all — hence the // [] defaults on both.
          COUNT=$(jq '
            [(.Results // [])[] | .Secrets // []]
            | flatten
            | length
          ' trivy-secret.json)

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Secret scan: PASS (trivy)" >> "$GITHUB_OUTPUT"
            echo "No secret detected." > trivy-secret-summary.md
            exit 0
          fi

          echo "title=## 🚨 Secret scan: FOUND (${COUNT}) (trivy)" >> "$GITHUB_OUTPUT"

          # Rule id, title, file and line only. Trivy redacts the matched value in its
          # own output, but a comment on a pull request is a public surface and there
          # is no version of it that should carry a candidate secret at all — not even
          # a redacted one, whose length and shape are themselves information.
          jq -r '
            (.Results // [])[]
            | .Target as $target
            | (.Secrets // [])[]
            | "- [\(.Severity)] `\($target):\(.StartLine)` \(.RuleID) — \(.Title)"
          ' trivy-secret.json > trivy-secret-summary.md
        shell: bash

      - name: Upload Trivy secret report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-secret
          path: |
            trivy-secret.json
            trivy-secret-summary.md

      - name: Comment Trivy secret result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-secret-result -->'
          status: "${{ steps.summarize.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ Secret scan (trivy): CUT OFF (no result produced)' }}"
          body-file: trivy-secret-summary.md
          details-summary: '📄 Summary'

      # No severity threshold: a secret has no "minor" band. Accepted detections are
      # pinned per path in .trivyignore.yaml, so the baseline this gates on is zero.
      - name: Fail if a secret was found
        if: always() && steps.summarize.outputs.count != '0'
        run: exit 1

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: secret-scan
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.secret-scan.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: secret-scan
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure-trivy-secret:
    needs: trivy-secret
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.trivy-secret.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: trivy-secret
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
