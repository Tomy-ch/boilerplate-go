name: Migration Check

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - '.github/workflows/migration-check.yaml'
      - '.makefiles/**'
      - 'makefile'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run migration checks
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set +e

          RESULT_FILE=/tmp/migration_result.txt
          echo "" > $RESULT_FILE

          run_check () {
            CMD=$1
            NAME=$2

            echo "▶ $NAME" >> $RESULT_FILE
            $CMD >> $RESULT_FILE 2>&1
            CODE=$?

            if [ $CODE -ne 0 ]; then
              echo "❌ $NAME failed" >> $RESULT_FILE
              FAIL=1
            else
              echo "✅ $NAME passed" >> $RESULT_FILE
            fi

            echo "" >> $RESULT_FILE
          }

          FAIL=0

          run_check "make check-migration-up-version" "duplicate check (up)"
          run_check "make check-migration-down-version" "duplicate check (down)"
          run_check "make check-migration-up-gap" "gap check (up)"
          run_check "make check-migration-down-gap" "gap check (down)"

          echo "▶ pair check" >> $RESULT_FILE

          UP=$(for f in database/migrations/*.up.sql; do basename "$f"; done | cut -d'_' -f1 | sort)
          DOWN=$(for f in database/migrations/*.down.sql; do basename "$f"; done | cut -d'_' -f1 | sort)

          DIFF=$(diff <(echo "$UP") <(echo "$DOWN"))

          if [ -n "$DIFF" ]; then
            echo "❌ up/down mismatch detected" >> $RESULT_FILE
            echo "$DIFF" >> $RESULT_FILE
            FAIL=1
          else
            echo "✅ up/down pair check passed" >> $RESULT_FILE
          fi

          if [ $FAIL -ne 0 ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Migration check failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Migration check passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment migration result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- migration-check-result -->'
          status: ${{ steps.migration.outputs.status }}
          title: "${{ steps.migration.outputs.title || '## ⚠️ Migration Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/migration_result.txt
          details-summary: 'migration check log'

      - name: Fail if migration check failed
        if: steps.migration.outputs.status != 'success'
        run: exit 1
