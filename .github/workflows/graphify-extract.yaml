name: Graphify Extract

# The semantic half of the graph: extraction over documents, which needs a model. This is the only
# job here that runs an assistant with `contents: write`, which is why it is a separate workflow
# from `graphify-sync.yaml`, and manual only.
# Background: .github/workflows/README.md § Notes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  graphify-extract:
    runs-on: ubuntu-latest
    # No `--max-turns`: a turn cap would cut the extraction mid-flow and leave a half-written graph.
    # `timeout-minutes` is the bound that belongs here.
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      # `claude-code-action` reaches GitHub through a token it mints itself, by exchanging this
      # workflow's OIDC identity with the Claude GitHub App. Without the permission the exchange
      # fails and the action stops before the model runs. It grants no repository access of its
      # own — only the right to request a JWT that names this workflow.
      id-token: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            api.anthropic.com:443
            *.anthropic.com:443
            statsig.anthropic.com:443
            sentry.io:443
            *.ingest.sentry.io:443

      # The secrets context is unavailable in `if:`, hence the detour through a run step output.
      - name: Check configuration
        id: config
        env:
          CLAUDE_CODE_TOKEN: ${{ secrets.CLAUDE_CODE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_CODE_TOKEN}" ]; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::notice::CLAUDE_CODE_TOKEN is not configured; skipping.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `graphify-pending` takes its baseline from the last commit that touched
          # `graphify-out/cache/semantic/`. Under the default shallow checkout that history is
          # absent, the lookup returns the tip, and the count below is zero on every run — which
          # would leave the guard at the end of this job permanently unable to fire.
          fetch-depth: 0

      - name: Setup mise and required tools
        if: steps.config.outputs.configured == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: uv
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Install from the lockfile, not a fresh install: the pinned build is what makes the prompt
      # match `.agents/graphify/spec-pin.toml`, which the next step verifies.
      - name: Install the graphify skill from the lockfile
        if: steps.config.outputs.configured == 'true'
        run: bash .claude/scripts/bootstrap-external-skills.sh

      # The path is repo-relative because that is the only place the skill exists: the bootstrap
      # runs `graphify install` against a throwaway HOME and copies just the skill directory into
      # the checkout, so nothing lands under the runner's own HOME. It is also the copy the next
      # step's assistant loads, which is what makes checking it meaningful.
      - name: Verify the prompt matches the pin
        if: steps.config.outputs.configured == 'true'
        run: make graphify-check SPEC=.claude/skills/graphify/references/extraction-spec.md

      # Read before the extraction, not after: the baseline is a commit, so the count does not move
      # until the cache lands on the release line. Taken here it says how much work was waiting,
      # which is what the guard at the end compares the produced diff against.
      - name: Measure pending semantic extraction
        id: pending
        if: steps.config.outputs.configured == 'true'
        run: make graphify-pending GRAPHIFY_PENDING_ARGS=-github

      - name: Run semantic extraction
        if: steps.config.outputs.configured == 'true'
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        env:
          # The skill resolves its own interpreter, and its first branch is
          # `uv tool run --from graphifyy`, which takes the newest release from PyPI rather than the
          # version this repository pins. Constraining uv with the lockfile lands that branch on the
          # pinned build, so the prompt the previous step verified is the one the extraction runs.
          # Without it the step above checks a copy nothing uses.
          UV_CONSTRAINT: ${{ github.workspace }}/python/graphify.txt
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_TOKEN }}
          # Nothing here is interactive, so a tool outside the allowed set is refused rather than
          # asked about, and the assistant finishes cleanly having written nothing. The repository's
          # own `deny` list in `.claude/settings.json` still applies on top of this.
          # `Agent` is load-bearing: the skill extracts documents by dispatching one subagent per
          # chunk, so without it only the structural half runs and the semantic cache never grows.
          claude_args: --allowedTools Agent,Bash,Read,Write,Edit,Glob,Grep
          prompt: |
            Run `/graphify --update` on this repository, then stop.
            Do not commit, push, or open a pull request — a later step handles that.
            Do not edit any file outside `graphify-out/`.

      - name: Verify the refreshed artifacts stay portable
        if: steps.config.outputs.configured == 'true'
        run: make graphify-check

      - name: Detect changes
        if: steps.config.outputs.configured == 'true'
        id: diff
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi
          # Tracked separately from the line above because the two answer different questions: the
          # skill rebuilds the graph from the structural half on its way through, so a refreshed
          # `graph.json` proves the run happened, not that any document was read.
          if git diff --cached --quiet -- graphify-out/cache/semantic; then
            echo "semantic_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "semantic_diff=true" >> "$GITHUB_OUTPUT"
          fi

      # A clean finish tells us nothing about whether any document was read — a refused tool call, an
      # unresolved skill, a model that stopped early all end green. Neither does a non-empty diff,
      # since the skill refreshes the graph from the structural half regardless. What separates the
      # cases is the semantic cache: documents were waiting and none of them was extracted.
      - name: Fail when waiting documents were not extracted
        if: steps.config.outputs.configured == 'true' && steps.diff.outputs.semantic_diff == 'false' && steps.pending.outputs.files != '0'
        env:
          WAITING: ${{ steps.pending.outputs.files }}
        run: |
          echo "::error::the semantic cache did not change while ${WAITING} documents were waiting"
          exit 1

      # The secrets context is unavailable in `if:`, hence the detour through a run step output.
      - name: Check auto-PR app credentials
        id: app-config
        if: steps.config.outputs.configured == 'true' && steps.diff.outputs.has_diff == 'true'
        env:
          AUTO_PR_APP_ID: ${{ secrets.AUTO_PR_APP_ID }}
          AUTO_PR_APP_PRIVATE_KEY: ${{ secrets.AUTO_PR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AUTO_PR_APP_ID}" ] && [ -n "${AUTO_PR_APP_PRIVATE_KEY}" ]; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::warning::AUTO_PR_APP_ID / AUTO_PR_APP_PRIVATE_KEY are not configured; the pull request is opened with GITHUB_TOKEN, whose events start no workflow, so its required checks never report and the merge stays blocked.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi

      # A pull request opened with GITHUB_TOKEN starts no workflow run at all — GitHub suppresses
      # the events that token raises, to stop a workflow from triggering itself — so every required
      # context stays unreported and the merge blocks with nothing to wait for. An app token is a
      # separate identity, and the events it raises are ordinary ones.
      - name: Mint the auto-PR app token
        id: app-token
        if: steps.config.outputs.configured == 'true' && steps.diff.outputs.has_diff == 'true' && steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.AUTO_PR_APP_ID }}
          private-key: ${{ secrets.AUTO_PR_APP_PRIVATE_KEY }}
          # An installation token carries the app's whole permission set unless it is narrowed here.
          # Pushing the branch and opening the pull request is the entire job.
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR
        if: steps.config.outputs.configured == 'true' && steps.diff.outputs.has_diff == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Falls back to GITHUB_TOKEN when the app is not configured: the pull request still opens,
          # it just carries no checks. A skipped step leaves an empty output, which is falsy, so the
          # fallback is reached exactly when the token was not minted.
          token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: "Chore: sync semantic graph"
          branch: auto/graphify-update/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "Chore: sync semantic graph"
          body: |
            ## 🤖 Semantic Graph Sync

            Semantic extraction over the documents that changed since the last run, produced by
            `/graphify --update` with the prompt `.agents/graphify/spec-pin.toml` pins.

            ### 📦 Included outputs
            - `graphify-out/graph.json` (+ `GRAPH_REPORT.md`)
            - `graphify-out/nodes.json` / `edges.json` / `metadata.json`
            - `graphify-out/cache/semantic/` — new entries, keyed by content, additive
            - `graphify-out/manifest.json` — its `mtime` values are the runner's, so the whole file
              changes even where the content hashes did not

            ### ⚠️ Review note
            The node and edge text is model output. It describes the documents rather than changing
            behaviour, so a diff review here is about whether the description is right, not whether
            the code still works.
