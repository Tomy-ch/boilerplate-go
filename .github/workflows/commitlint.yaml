name: Commitlint

# commitlint is reachable from exactly one place, the lefthook `commit-msg` hook, and the
# repository's own commit workflow bypasses it: commits are split with `--no-verify`, and the
# single verification pass that follows is `lefthook run pre-commit`, which by definition does
# not run a `commit-msg` command. A message that took that route was checked by nothing before
# it reached the base branch, so the PR's commit range is checked here.
#
# Merge commits are not the concern. commitlint's defaultIgnores drops both `Merge pull
# request #N ...` and the `Merge remote-tracking branch 'origin/release/vX.Y.0' into ...` a
# base catch-up produces. The repository's own `Revert: ...` form keeps its type checked, since
# the ignore pattern wants a bare `Revert ` with no colon.
#
# No `paths` filter, deliberately: what is checked is the commit messages themselves, and no
# path expression can name them.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A base..head range exists only in a pull-request context. Rather than invent a substitute
    # range on workflow_dispatch — which would be the same silent degradation this job exists to
    # catch — the job is skipped there.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443

      # fetch-depth: 0 is required. The default shallow checkout has neither the base branch tip
      # nor the PR's own commits, and both ends of the range resolve to a bad object.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: npm:@commitlint/cli
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run commitlint on the PR commit range
        id: commitlint
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        # The range starts at the base branch tip, not at `pull_request.base.sha`. That payload
        # field is a snapshot taken when the PR last changed, so a base that has since moved
        # leaves the branch's own older commits inside the range — including ones predating this
        # gate — and the job would fail on history it does not own. Against the tip, whatever is
        # already on the base is outside the range no matter how it got onto the branch.
        run: |
          set +e

          make commitlint-range-ci \
            COMMITLINT_FROM="origin/${GITHUB_BASE_REF}" \
            COMMITLINT_TO="${HEAD_SHA}" 2>&1 | tee /tmp/commitlint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Commitlint: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Commitlint: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment commitlint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- commitlint-result -->'
          status: ${{ steps.commitlint.outputs.status }}
          title: "${{ steps.commitlint.outputs.title || '## ⚠️ Commitlint: CUT OFF (no result produced)' }}"
          body-file: /tmp/commitlint.log
          details-summary: 'commitlint log'

      - name: Fail if commitlint failed
        if: always() && steps.commitlint.outputs.status != 'success'
        run: exit 1
