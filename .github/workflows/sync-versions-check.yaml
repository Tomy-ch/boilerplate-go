name: Sync Versions Check

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'go.mod'
      - 'docker/server/Dockerfile'
      - 'docker/tools/Dockerfile'
      - 'docker/**/README.md'
      - 'docker/**/README.ja.md'
      - 'scripts/sync-versions/**'
      - '.github/workflows/sync-versions-check.yaml'
      - '.makefiles/**'
      - 'makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-versions-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sync-versions
        run: go run ./scripts/sync-versions

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            # A clean run writes a body too, even though nothing will normally read it: it is what
            # overwrites a drift comment an earlier push left on this pull request, and the action
            # reads a missing body as a cut-off rather than as a clean result.
            echo "Every file synced from mise.toml matches; no drift." > /tmp/sync-versions-drift.md
            exit 0
          fi
          echo "status=drift" >> "$GITHUB_OUTPUT"

          # fence_for mirrors upsert-pr-comment's fenceFor: this call passes the body through untouched, so it sizes its own fence. See README.md § PR comment fencing.
          # `-a`: without it a single NUL byte makes grep report a binary match and print nothing,
          # collapsing the fence back to three backticks.
          fence_for() {
            local longest len
            longest="$({ grep -a -o '`\{1,\}' "$1" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n + 0 }')"
            len=$(( longest + 1 ))
            if [ "$len" -lt 3 ]; then len=3; fi
            printf '%*s' "$len" '' | tr ' ' '\140'
          }

          # The paths reaching this list are the ones sync-versions writes, and its rule table names
          # every one of them literally, so a pull request cannot steer an arbitrary name in here
          # today. Fencing anyway keeps that out of the safety argument: a path may hold any byte but
          # NUL and `/`, and outside a fence a name is live Markdown — a mention notifying third
          # parties, a fabricated heading or link, posted under the bot's name.
          # That same literal rule table caps the list at roughly a dozen paths, so unlike the
          # gen-*-artifacts checks this body cannot approach the action's length cap and needs no
          # trimming ahead of the fence. The fence cannot run away either: a backtick run never
          # spans a `/`, so the longest one a path can hold is bounded by NAME_MAX — 255 bytes —
          # and the fence by 256.
          list=/tmp/sync-versions-files.txt
          git diff --name-only > "$list"
          fence="$(fence_for "$list")"

          {
            echo "There is drift when syncing each file from mise.toml (the source of truth) — caused by an unpropagated mise.toml update, or an inconsistent edit to a downstream file."
            echo ""
            echo "Run \`make sync-versions\` locally and commit the changes."
            echo ""
            echo "Files with drift:"
            echo ""
            echo "${fence}text"
            cat "$list"
            echo "${fence}"
          } | tee /tmp/sync-versions-drift.md
          exit 1

      - name: Comment sync-versions result on PR
        # The step runs on every outcome and hands the verdict to the action instead of gating
        # itself on drift: a skipped step cannot reach a drift comment left by an earlier push,
        # so the pull request would keep claiming drift that this run just found resolved.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sync-versions-drift -->'
          status: "${{ steps.drift.outputs.status == 'ok' && 'success' || 'drift' }}"
          title: "${{ steps.drift.outputs.status == 'drift' && '## ❌ sync-versions: drift detected' || steps.drift.outputs.status == 'ok' && '## ✅ sync-versions: PASS (no drift)' || '## ⚠️ Sync Versions Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/sync-versions-drift.md
