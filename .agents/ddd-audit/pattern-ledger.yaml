  - id: aggregate
    name: Aggregate
    part: 2
    scope: core
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      中核（唯一のルート・ルート経由の変更・ルート単位の Repository・境界内不変条件）は原義どおり。
      差異は 2 つあり、どちらも宣言済みになった。
      1 つ目は参照で、可変集約への参照を ID のみに限定する点が Cross-aggregate reference 節の
      Departure from Evans ブロックで宣言され、参照マスタ例外の境界（参照専用 Repository を持つだけでは
      根拠にならず、独立集約は identity のみ）も同節に明記されている。
      2 つ目はトランザクション境界。Aggregate Boundary 節は「1 Aggregate = 1 Transaction Boundary」を
      「既定であって絶対ではない」と限定したうえで、境界を跨ぐ 2 経路（陳腐化してはならないガード＝
      ADR-0032 (lightweight-cqrs) 分岐 2、原子性を要する複数集約書き込み＝同分岐 3）へ導線を張り、この 2 つに限ると
      明示している。ADR-0032 (lightweight-cqrs) は Vernon の定式化を経た Evans の主張を名指しし、原義・本リポジトリの
      選択・理由の三要素を書いた宣言節を持つ。
      残る論点は宣言の外にある。この分類は要件に相対で、要件が変われば同じ操作が分岐を移る
      （ADR-0032 (lightweight-cqrs) 自身が記録の規律としてそう述べている）。
      なお Do not set outside constructor 節に「集約は子を含め 1 回の呼び出しで構築し、子をまたぐ
      不変条件はルートでのみ判定する」という記述が加わり、ルートが境界内不変条件を保証する唯一の点で
      あるという中核解釈が生成・再構成の局面へ拡張された。新規の差異ではなく、既存判定の裏付け。
    interpreted_by:
      - kind: readme
        path: internal/domain/README.md
        section: "Aggregate Design / Aggregate Boundary / Cross-aggregate reference / Reference master aggregates"
      - kind: readme
        path: internal/domain/README.md
        section: "Do not set outside constructor"
      - kind: doc
        path: docs/rules.md
        section: "Repository / QueryService Rules"
      - kind: adr
        id: "0032"
        slug: lightweight-cqrs
      - kind: adr
        id: "0034"
        slug: commandservice-atomicity-criterion
      - kind: adr
        id: "0036"
        slug: ordered-pessimistic-row-locks
    deviation_declared: true
    deviation_note: >-
      差異は 2 つ。(1) Evans は他集約ルートへの直接参照を許すが、本リポジトリは可変集約への参照を
      identity のみに限定する。直接参照はグラフを読んでそれ越しに変更するのを容易にし、2 つの
      トランザクション境界を事故的に 1 つへ潰すため。参照マスタだけは提示に必要な属性を伴ってよいが、
      変更を通す振る舞いを持たない。宣言は internal/domain/README.md の Cross-aggregate reference 節。
      (2) 集約が即時整合の単位であるという Evans の主張（「1 Aggregate = 1 Transaction Boundary」は
      Vernon による定式化）に対し、本リポジトリは 2 つの状況に限ってこれを越える。陳腐化してはならない
      ガードと、原子性を要する複数集約書き込みである。Evans の議論は変更についてのものであり、
      前者で他集約は観測されるだけで変更されずルートが権威を保つため。後者でも、1 トランザクションが
      触れる集約のうち書き込まれるのは一部で、残りは観測されるだけという形を保つ。宣言は
      docs/adr/0034-commandservice-atomicity-criterion.md の Departure 節と
      internal/domain/README.md の Aggregate Boundary 節。
    enforced_by:
      - kind: depguard
        rule: maintain_a_sound_domain
