  - id: bounded-context
    name: Bounded Context
    part: 4
    scope: strategic
    status: rejected
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      複数コンテキストへの明示的分割という意味では採用していない。ADR-0039 (domain-lexicon) の Alternatives
      （internal/domain/kernel 節）が Evans の Bounded Context / Context Map を名指しし、
      「Shared Kernel は 2 つの Bounded Context の共同所有物で複数コンテキストの存在を前提とするが、
      本リポジトリは単一モデルである」と明示している。ADR-0004 (modular-monolith)（modular monolith, microservices は
      non-goal）が単一モデルである理由の裏付け。旧 internal/domain/kernel が Bounded Context 不在のまま
      Shared Kernel の語を先取りしていた問題は lexicon への改名で解消済み。残る軽微な語彙の緩さとして、
      docs/rules.md の Context nesting 節は bounded context をパッケージ命名規約の語として流用している。
    interpreted_by:
      - kind: adr
        id: "0039"
        slug: domain-lexicon
      - kind: adr
        id: "0004"
        slug: modular-monolith
      - kind: readme
        path: internal/domain/lexicon/README.md
        section: "kernel を使わない旨の冒頭注記"
    deviation_declared: true
    deviation_note: >-
      Evans の Bounded Context は、システムを複数の明示的なモデル境界に分割し、境界ごとに
      Ubiquitous Language を一貫させ、境界間の関係を Context Map で扱うことを求める。本リポジトリは
      単一モデル・単一デプロイのモジュラーモノリスであり（ADR-0004 (modular-monolith): マイクロサービスは non-goal）、
      複数の Bounded Context への明示的分割を行っていない。共有が必要な箇所は集約間の共有
      （internal/domain/lexicon）として扱い、Shared Kernel の語は実際に複数コンテキストを導入する者の
      ために予約している。宣言は ADR-0039 (domain-lexicon) の Alternatives Considered 節、および
      internal/domain/lexicon/README.md 冒頭の注記。
    enforced_by: []
    last_audited: "2026-08-05"
    last_audited_commit: "1dbf9b0fb7b6"

  - id: context-map
    name: Context Map
    part: 4
    scope: strategic
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      専用の地図が新設され、解釈は成立した。接触点の定義（モデルがシステムの外へ渡ること。外部の相手を
      持たないポートは含めない）、両方向の列挙、辺ごとの関係ラベル・根拠・相手が動いたときの影響、
      そして地図が扱わない範囲までを持つ。上流に対する 1 辺は Evans の複合語で特徴づけられている。
      隣接エントリとも整合し、単一モデルであるという立場に矛盾しない。
      残る差異は、恒久的な辺の過半が関係を確定していない点。Evans の Context Map の眼目は境界ごとの
      関係を明示して暗黙の混濁を防ぐことにあるので、これは原義との差異である。ただし宣言済み。
      地図は冒頭で、下流側の辺で関係を分けるのは上流がこちらの要件を通すかどうかであり、それは
      テンプレートにおいては採用する側の組織についての事実だから、根拠と未解決の問いを伴う未確定が
      正しい状態である、と述べている。空欄ではなく項目として記録される。
      なお最初の版は変換境界が在る辺に Conformist を候補として並べており、Evans の語彙の誤用だった
      （Conformist は変換層を作らないこと、Anticorruption Layer は作ることで、同じ状況への 2 つの答え
      であって関係と対処の独立な軸ではない）。検証で指摘され、候補から外して理由を明記済み。
    interpreted_by:
      - kind: doc
        path: docs/design/context-map.md
        section: "An undecided edge is an entry, not a blank / Edges / The open questions / What this map does not cover"
      - kind: adr
        id: "0039"
        slug: domain-lexicon
      - kind: adr
        id: "0004"
        slug: modular-monolith
    deviation_declared: true
    deviation_note: >-
      Evans の Context Map は境界ごとの関係を明示することで暗黙のモデル混濁を防ぐが、本リポジトリの
      地図は恒久的な辺の過半を未確定のまま記録する。下流側の辺で関係を分けるのは上流がこちらの要件を
      通すかどうかという組織的事実であり、テンプレートにおいてそれは採用する側の組織についての事実で、
      このリポジトリには存在しないため。推測で埋めれば、調べた顔をして調べていない地図が残る。
      ラベルの無い辺は採用者に判断を促すが、誤って貼られた辺は採用者が問いを見る前に判断を閉じる。
      未確定の辺は根拠と、決着させるための問いを伴って記録する。宣言は docs/design/context-map.md の
      「An undecided edge is an entry, not a blank」節。
    enforced_by: []
    last_audited: "2026-08-06"
    last_audited_commit: "cdaa2f26a60b"

  - id: shared-kernel
    name: Shared Kernel
    part: 4
    scope: strategic
    status: rejected
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      本パターンは採用していない。前提となる複数 Bounded Context がこのモデルに存在しないため、
      Context Map の関係パターンである Shared Kernel は成立しない。従来 internal/domain/kernel が
      DDD Shared Kernel を名乗っていたが、internal/domain/lexicon へ改名して主張を撤回し、`kernel` の語は
      実際に複数コンテキストを導入する者のために予約した。原義が担っていた規律（小さく保つ・変更は
      共同所有の判断）は語に依存しない形で lexicon 側に保持している。
    interpreted_by:
      - kind: adr
        id: "0039"
        slug: domain-lexicon
      - kind: doc
        path: docs/rules.md
        section: "Domain lexicon"
      - kind: readme
        path: internal/domain/lexicon/README.md
        section: "Admission bar"
    deviation_declared: true
    deviation_note: >-
      Evans の Shared Kernel は 2 つの Bounded Context が共同所有するモデルの部分集合を指し、
      複数コンテキストの存在を前提とする。本リポジトリは単一モデルで、共有は集約間に起きる。
      前提が成り立たないため語を採用せず internal/domain/lexicon と呼ぶ。ADR-0039 (domain-lexicon) の
      Alternatives に「internal/domain/kernel, naming the DDD Shared Kernel」として却下理由を記載。
    enforced_by:
      - kind: depguard
        rule: maintain_a_sound_domain
    last_audited: "2026-08-05"
    last_audited_commit: "1dbf9b0fb7b6"

  - id: anticorruption-layer
    name: Anticorruption Layer
    part: 4
    scope: strategic
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      構造的シグネチャ（外部サービスに自層の語彙で port を立て、境界で変換し内側に漏らさない）は
      boundary / infrastructure に明確に存在する。差異は動機で、コーパスが掲げる理由は一貫して DIP・
      置換可能性・transport 隠蔽であり、Evans の「上流のモデルによる意味論の侵入を防ぐ」は現れない。
      これは Design Policy 節で宣言済み。概念が食い違ったときの寄せ先についても既定の解決規範
      （自モデルの語彙を優先し、判断を leaf の変換箇所に記録する）が同節にあり、規範が無いわけではない。
      ただし実際の概念対立事例で検証されたことはなく、Translator 相当の変換ロジック自体の置き場は
      依然未定義（infrastructure は業務ロジック禁止、domain は純粋性要求で、どちらにも書けない）。
    interpreted_by:
      - kind: readme
        path: internal/usecase/boundary/README.md
        # sample-api:replace-begin
        section: "exchangerate / objectstorage"
        # sample-api:replace-with
        # = section: "objectstorage"
        # sample-api:replace-end
      - kind: readme
        path: internal/infrastructure/README.md
        section: "Error Handling"
      - kind: readme
        path: internal/infrastructure/webapi/README.md
        section: "Design Policy"
      - kind: doc
        path: docs/design/context-map.md
        section: "Edges / The open questions"
      - kind: adr
        id: "0001"
        slug: avoid-lock-in
      - kind: adr
        id: "0047"
        slug: apperror-protocol-agnostic-errors
      - kind: adr
        id: "0110"
        slug: no-generic-cache-abstraction
    deviation_declared: true
    deviation_note: >-
      構造的シグネチャは Anticorruption Layer だが、掲げる動機が Evans と異なる。本リポジトリは
      依存性逆転・置換可能性・transport 隠蔽から論じ、Evans は上流モデルの意味論の侵入を防ぐことから
      論じる。結果として確実に守られるのは技術型とベンダー語彙であり、外部の概念が自ドメインと
      食い違うときにどちらへ寄せるかは未決である。当面はこのモデルの語彙へ寄せ、判断を leaf の変換箇所に
      記録する運用とする。宣言は internal/infrastructure/webapi/README.md の Design Policy 節。
    enforced_by: []
    last_audited: "2026-08-06"
    last_audited_commit: "cdaa2f26a60b"

  - id: published-language
    name: Published Language
    part: 4
    scope: strategic
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      同期 HTTP 面は OpenAPI が公開言語の役割をほぼ完全に果たしている（別リポジトリの利用者が公開側
      ツールチェーン無しで消費できる解決済み契約を成果物としてコミットし、drift gate で鮮度を保証）。
      差異は非対称性で、非同期面（outbox → 外部 receiver）には公開言語が無い。ADR-0055 (at-least-once-outbox-poll) が定めるのは
      Idempotency-Key という転送規約のみで、公開されるイベント payload のスキーマと事象語彙を定義・
      公開した記述はコーパスに無い。この非対称は docs/design/outbox.md 第 4 節で宣言済み。
    interpreted_by:
      - kind: doc
        path: docs/design/outbox.md
        section: "4. What an integrator implements"
      - kind: doc
        path: docs/design/context-map.md
        section: "Edges / The open questions"
      - kind: adr
        id: "0012"
        slug: openapi-first
      - kind: adr
        id: "0015"
        slug: retain-generated-openapi
      - kind: adr
        id: "0018"
        slug: boundary-value-ownership
      - kind: doc
        path: docs/rules.md
        section: "DTO / Type Boundary Rules"
      - kind: readme
        path: internal/controller/README.md
        section: "Role in Onion Architecture"
    deviation_declared: true
    deviation_note: >-
      同期 HTTP 面は OpenAPI が公開言語として機能する一方、非同期面（outbox → 外部 receiver）には
      公開言語が無い。ADR-0055 (at-least-once-outbox-poll) が定めるのは Idempotency-Key という転送規約であって言語ではなく、
      イベント payload のスキーマも event_type の語彙も定義・公開されていない。テンプレートは自分が
      所有しないイベントの言語を公開できないため、この非対称は payload と event_type を integrator に
      委ねている限りにおいて意図的である。未提供なのは、integrator が定義した後の公開の型。
      宣言は docs/design/outbox.md の第 4 節。
    enforced_by: []
    last_audited: "2026-08-06"
    last_audited_commit: "cdaa2f26a60b"
