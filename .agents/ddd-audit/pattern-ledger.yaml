  - id: factory
    name: Factory
    part: 2
    scope: core
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      パターン名がコーパスに現れるようになり、New() / Reconstruct() を Factory と位置づける解釈、
      集約全体（子を含む）を 1 回の呼び出しで組み立て切ること、独立 Factory 型を起こす条件、
      再構成側の Factory を Repository が務めることが The constructor is the Factory 節で明文化された。
      前回の未解消 2 点（集約全体の生成 / 独立した Factory オブジェクトへの言及）はこれで解消。
      残る差異は再構成時の扱いのみで、Evans が「既存データの不変条件違反は拒否だけでは済まず
      修復戦略が要り得る」と注意した論点に対し、本リポジトリは常に hard-fail する。これは
      Do not set outside constructor 節の Departure from Evans ブロックで宣言済み。
      独立 Factory 型を起こす条件として挙げられているのは「生成をまたいで固定される設定」1 つで、
      Evans が挙げる他の 2 条件には明示的に触れていない。取りこぼしではなく、性質が異なる。
      具体クラスの選択は主語が無い。ドメインに多相な型が存在せず（interface は Repository 系のみ、
      生成関数はすべて具象型を返す）、実装の選び分けは DI が別パターンとして担う
      （ADR-0038 (two-scale-quantity-model) / 0036 / 0037）。変種を型でなく値で表す方針そのものは The constructor is the Factory 節
      および How far Value Objects go here 節で宣言済み。
      「クライアントが持つべきでないインフラ知識の隠蔽」は、単独では起動条件にならない。組み立てが
      1 回の呼び出しなら隠すべき手順が存在せず、隠蔽が意味を持つのは組み立てに構造がある——協力者が
      複数ある、順序に制約がある、設定を保持する、具象型を選ぶ——ときに限られる。つまりこれは他の条件が
      揃ったときに得られる帰結であって、それ自体が Factory 型を要求する理由ではない。Evans が 3 つを
      並列に挙げたのは、当時の生成が常に構造を伴っていたためと読める。
      本モデルでは生成が値の純関数なので条件が分離し、隠蔽だけが残っても指すものが無い。なお効果を伴う
      生成知識（採番・行の読み出し・ロック取得）は、ドメインが I/O を持てない以上、隠蔽先をドメイン側に
      作ること自体ができない。純粋な知識（コード体系など）を包むかどうかは VO の採用基準に従う。
    interpreted_by:
      - kind: readme
        path: internal/domain/README.md
        section: "Do not set outside constructor / Why validate here when OpenAPI already validates the request?"
      - kind: readme
        path: internal/domain/README.md
        section: "The constructor is the Factory"
      - kind: readme
        path: internal/domain/README.md
        section: "How far Value Objects go here"
      - kind: doc
        path: docs/rules.md
        section: "DTO / Type Boundary Rules"
    deviation_declared: true
    deviation_note: >-
      Evans は再構築時の不変条件違反に対し修復戦略が要り得ると注意するが、本リポジトリは常に
      hard-fail する。Reconstruct は New と同じ不変条件を課す。保存された違反は見つけられるべき欠陥で
      あり、黙って修復するとそれが観測可能になった瞬間に隠すことになるため。代償として、その行は
      修正されるまで当該集約の読み取りを止める。宣言は internal/domain/README.md の
      Do not set outside constructor 節。
    enforced_by: []
