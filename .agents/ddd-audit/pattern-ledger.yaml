    scope: core
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      構造的役割（集約を小さく保ったまま越境した帰結を結果整合で達成する）は outbox event として解釈済み。
      モデル化の側も解決している。イベントはドメインの型として存在し、過去形の名前・不変性・発生時刻を持ち、
      遷移メソッドが成功時にだけ返すため「状態は変わったがイベントが出ていない」がコンパイル時に書けない。
      event_type / payload の語彙の所有も分離済み（名前はドメイン、版と wire 表現は詰め替え層）。
