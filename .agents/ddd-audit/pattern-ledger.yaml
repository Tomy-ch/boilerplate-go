  - id: repository
    name: Repository
    part: 2
    scope: core
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      Aggregate Root 限定・ドメイン語彙の契約・トランザクション制御はクライアント側、と原義とよく一致する。
      CommandService という「集約の書き込みが Repository seam を通らない経路」の存在は、ADR-0032 (lightweight-cqrs) の
      Alternatives「Route every write through the aggregate Repository (abolish CommandService)」で
      Evans の形（load-aggregate-mutate-save 一本化）を名指しし、ロックを取らない相対更新の並行性を理由に
      却下、Eligibility / Derivation で範囲を絞って宣言済み。読み取り側の絞り込み（QueryService 分離）も
      Fat Repository を名指しで退けている。
      ドメイン層が宣言する永続化契約は Repository ただ 1 つ。CommandService IF は usecase 層の
      command サブパッケージにのみ宣言され、internal/domain/ 配下に同種の宣言は無い
      （サンプル撤去後は宣言が 0 本になる）。所有をワークフロー軸で決める（CommandService は
      トランザクションの道具であり、所有者はトランザクションを開く側である）ため usecase 層に置かれ、
      「ドメイン層に第二の永続化契約が並ぶ」という差異は無い。残る差異は seam の存在そのもので、
      これは上記のとおり ADR-0032 (lightweight-cqrs) の Alternatives で宣言済み。
      書き込みメソッドの契約は docs/design/data-access-pattern.md § Write side が定める。1 メソッドが
      単独で集約を整合させ、別の Repository 呼び出しを順序付きで要求しないこと（子の集合は同一性を鍵に
      同期する）を要求し、単独で整合する複数メソッド（1 列更新・状態遷移ごとの 1 本）は適法とする。
      Evans が集約単位の save を語る粒度をメソッド本数ではなく契約の保証内容で読んだもので、差異は無い。
    interpreted_by:
      - kind: adr
        id: "0032"
        slug: lightweight-cqrs
      - kind: adr
        id: "0003"
        slug: interface-based-decoupling
      - kind: adr
        id: "0034"
        slug: commandservice-atomicity-criterion
      - kind: doc
        path: docs/rules.md
        section: "Repository / QueryService Rules / Transaction Rules"
      - kind: doc
        path: docs/design/data-access-pattern.md
        section: "Write side / The Repository write contract"
      - kind: readme
        path: internal/domain/README.md
        section: "Dependency inversion for Infrastructure layer / Doc comments stay in domain vocabulary / The constructor is the Factory"
      - kind: readme
        path: internal/infrastructure/rdb/README.md
        section: "command_service"
    deviation_declared: true
    deviation_note: >-
      Evans は集約への変更を「集約をロードし、変更し、保存する」という Repository 経由の単一経路に
      一本化するが、本リポジトリは集約の読み込み-保存で表現できない書き込み（相対更新・集合演算・
      ロックを取らずに原子性を得る操作）に限り CommandService を許す。相対更新はロックを取らずに済み、
      集約経由へ寄せると現状無い競合とデッドロック面を持ち込むため。適格基準と導出規則で
      一般的な逃げ道化を防いでいる。宣言は docs/adr/0032-lightweight-cqrs.md の Alternatives Considered
      節「Route every write through the aggregate Repository (abolish CommandService)」、
      適格基準の背景は ADR-0032 (lightweight-cqrs)。
    enforced_by: []
