      ADR-0032 (lightweight-cqrs) の判定手順が 3 分岐（分解＝既定 / 陳腐化してはならないガード / 原子性を要する書き込み）に
      拡張され、分岐ごとに名前の付いた占有者が実在する。基準が読み取りの陳腐化と書き込みの原子性という
      2 つの独立した問いに分解され、
      なぜ既存の基準がガードに届かなかったかも同節に書かれている。
