# DDD pattern ledger — layer 1 of the three-layer DDD audit model.
#
# THIS FILE IS A SKILL ARTIFACT, NOT DOCUMENTATION. It is written and read by the
# `ddd-audit` skill and the `ddd-origin-auditor` agent. Humans are not the audience;
# the human-facing output is the skill's aggregated report.
#
# Layer 1 (this file) — Evans's DDD pattern language, project-independent.
# Layer 2            — how this repository interprets each pattern (ADR / README sections).
# Layer 3            — what enforces the interpretation in code (depguard / lint / analyzer).
#
# The ledger records, per pattern, WHETHER layer 2 has interpreted it and WHERE that
# interpretation lives. It does NOT judge whether the interpretation is correct — the
# audit flags differences from Evans and the absence of an explicit deviation
# declaration; a human decides what to do about them.
#
# Field reference
#   id                 stable kebab-case key; the audit's fan-out unit (one agent per pattern)
#   name               Evans's term, verbatim
#   part               Evans's book part the pattern belongs to (1..4)
#   scope              core | strategic — lets the skill run a partial sweep
#   status             unexamined  — not audited yet
#                      examining   — audit in progress
#                      interpreted — layer 2 interprets the pattern (under any wording)
#                      uninterpreted — audited; layer 2 does NOT interpret it, and no
#                                      exclusion is declared. Awaiting a human decision:
#                                      adopt, or record a deliberate exclusion ADR.
#                      rejected    — deliberately not adopted, with a declared reason
#   verdict            the last audit's three-valued result:
#                      差異なし | 差異あり | 逸脱宣言あり(スコープ外).
#                      Read it paired with `status`; alone it under-determines the entry.
#                      差異あり in particular covers two situations a reader must not
#                      conflate: an interpretation exists but diverges from Evans, versus
#                      no interpretation exists at all. The first is a position somebody
#                      took, the second is a blank nobody has filled — different evidence,
#                      different next move. `status` is what separates them.
#   gap                one line naming the difference from Evans; empty when 差異なし.
#                      Kept so the next run starts from what was already established
#                      instead of re-deriving it.
#   interpreted_by     layer-2 sources; kind: adr (id + slug) | readme (path + section) | doc (path + section)
#   slug               required on every `kind: adr` entry — the ADR filename's kebab title with the
#                      number stripped (`id: "0034"` / `slug: uuidv7-identifiers`).
#                      docs/adr/README.md declares that kebab title the stable identifier: a new ADR
#                      may be inserted at its thematic position by shifting every later number +1,
#                      and a consolidation pass renumbers the whole set. A number alone therefore
#                      cannot survive a renumbering. It fails in two ways, and only the first is
#                      loud: the number goes dead, or — worse — it still resolves, now to an
#                      unrelated decision, and nothing about the entry looks broken.
#                      A mismatch between `id` and `slug` is the only mechanical signal that a
#                      citation has drifted; without the slug the silent case is undetectable.
#                      Repair by trusting the slug and re-deriving the number from the filename.
#   deviation_declared true when a layer-2 source explicitly states "Evans says X, we do Y because Z"
#   deviation_note     required when status is rejected, or when deviation_declared is true
#   enforced_by        layer-3 deterministic enforcement; empty means "no machine enforcement"
#   last_audited       ISO date of the last audit that set this entry, or null
#   last_audited_commit
#                      the commit whose tree the audit actually read. A date cannot answer
#                      "is this entry still current?" once more than one commit lands in a
#                      day — every corpus change and the audit itself carry the same date.
#                      This field is the only thing that makes drift computable.
#
# Reading `status` × `verdict` — the five pairs that occur, and what each one asks for:
#
#   interpreted   × 差異なし                 layer 2 interprets the pattern and the
#                                            interpretation matches Evans. Nothing open.
#   interpreted   × 逸脱宣言あり(スコープ外)  interpreted, diverges, and the divergence is
#                                            declared with its reason. Settled by a
#                                            decision on record; nothing open.
#   rejected      × 逸脱宣言あり(スコープ外)  deliberately not adopted, reason declared.
#                                            Settled the same way.
#   interpreted   × 差異あり                 an interpretation exists but diverges from
#                                            Evans, and the divergence is NOT declared.
#                                            Open: either declare it or close it — which
#                                            one is a human's call, not the audit's.
#   uninterpreted × 差異あり                 no interpretation exists. Nothing to declare
#                                            and nothing to close; the pattern is simply
#                                            unaddressed, and therefore unwatched.
#
#   The last two share a verdict and are not the same finding. Reporting them under one
#   heading hides the blanks behind the deliberate divergences, which is the failure this
#   pairing exists to prevent — so the audit report groups them separately.
#
#   Pairs outside this list do not occur: `unexamined` / `examining` carry no verdict yet,
#   and rejecting a pattern is itself a divergence, so `rejected` × 差異なし contradicts
#   itself.
#
# Drift since the last audit (run per pattern, or once with the widest set):
#
#   git diff --name-only <last_audited_commit>..HEAD -- \
#     'docs/adr/*.md' docs/architecture.md docs/rules.md 'docs/design/**' \
#     'internal/**/README.md' 'pkg/**/README.md' 'openapi/*.md'
#
# A non-empty result means the corpus moved under the recorded verdicts. Map each changed
# file back to the patterns whose `interpreted_by` cites it — those are the ones to re-run
# (`/ddd-audit`, quick scope). A pattern with `interpreted_by: []` is never selected by file
# overlap, so re-run those whenever anything moves: nobody is watching them by construction.
#
# Merging a base branch counts. A merge can rewrite a cited section without the feature
# branch touching it, and the verdict then describes a corpus that no longer exists.
#
# Statuses are set by `/ddd-audit`. Editing them by hand desynchronises the ledger from
# the corpus; run the skill instead.

schema_version: 1

# Paths the audit reads as layer 2. The deterministic staleness check compares a diff
# against these globs: if any matched file changed and this ledger did not, the ledger
# is stale.
#
# Nested READMEs are included deliberately. The first full audit found that the strongest
# evidence for a strategic pattern lived below the top-level README of a layer —
# Anticorruption Layer in `internal/infrastructure/webapi/README.md` — so a top-level-only
# glob set silently understates coverage for exactly the patterns hardest to spot.
#
# `docs/design/**` is here for the same reason: the only declaration this repository has
# about Published Language sits in `docs/design/outbox.md`, and while that glob was missing
# the ledger recorded the pattern as declared without any sweep being able to rediscover why.
corpus:
  - docs/adr/*.md
  - docs/architecture.md
  - docs/rules.md
  # `docs/design/**`, not `docs/design/**/*.md`. Every file here is flat, and a git pathspec of
  # the latter form requires at least one intermediate directory, so it matched nothing at all —
  # this glob was added to make Published Language auditable and silently covered none of it until
  # 2026-08-06. A glob that matches zero files reads exactly like a glob whose files never change.
  - docs/design/**
  - internal/**/README.md
  - pkg/**/README.md
  - openapi/*.md
  # The one file from `docs/spec/**` that belongs here — the cross-cutting business-vocabulary spec.
  # Added as a single path on purpose; see the blind-spot note below for why the directory glob must
  # never replace it.
  - docs/spec/glossary.md

# Known blind spot — `docs/spec/**` is deliberately NOT in the corpus, and must not be added.
# Per-feature specs carry sample business content, and keeping business content out of the
# architectural audit is exactly what the ADR work behind this ledger set out to achieve; a
# `docs/spec/**` glob would drag twelve features' worth of demo vocabulary into every sweep.
#
# That exclusion used to cost `ubiquitous-language` its auditability: the only document that could
# host the Ubiquitous Language was `docs/spec/domain/<pkgpath>.md`, which the audit cannot read, so
# the verdict rested on the ABSENCE of a cross-cutting home rather than on a reading of one.
#
# `docs/spec/glossary.md` is that home, and it is listed above as a single path — never as a
# `docs/spec/**` glob, which would reintroduce the per-feature business content this exclusion
# exists to keep out. The glossary is the exception because it is the one page in that tree whose
# subject is the language itself rather than one feature's rules.

patterns:
  - id: ubiquitous-language
    name: Ubiquitous Language
    part: 1
    scope: core
    status: interpreted
    verdict: 差異なし
    gap: ""
    interpreted_by:
      - kind: doc
        path: docs/spec/glossary.md
        section: "Overview / How a term earns a row / Mechanism vocabulary / 語彙を改訂するとき / Watch list"
    deviation_declared: false
    deviation_note: ""
    enforced_by:
      - kind: agent
        rule: drift-detector-glossary
    last_audited: "2026-08-06"
    last_audited_commit: "c3a355153c86"

  - id: layered-architecture
    name: Layered Architecture
    part: 2
    scope: core
    status: interpreted
    verdict: 差異なし
    gap: ""
    interpreted_by:
      - kind: adr
        id: "0002"
        slug: onion-architecture
      - kind: adr
        id: "0003"
        slug: interface-based-decoupling
      - kind: adr
        id: "0005"
        slug: driving-adapters-not-split-axis
      - kind: doc
        path: docs/architecture.md
        section: "Layer Responsibilities"
      - kind: doc
        path: docs/rules.md
        section: "Layer Dependency Rules"
      - kind: readme
        path: internal/usecase/README.md
        section: "Role in Onion Architecture"
    deviation_declared: false
    deviation_note: ""
    enforced_by:
      # 層境界は 1 本の規則ではなく層ごとの deny リスト 5 本で守られている。
      # 単一の `layer-dependency` 規則は存在しない（.golangci.yaml の depguard.rules を参照）。
      - kind: depguard
        rule: maintain_a_sound_domain
      - kind: depguard
        rule: maintain_a_sound_domain_service
      - kind: depguard
        rule: maintain_a_sound_usecase
      - kind: depguard
        rule: maintain_a_sound_controller
      - kind: depguard
        rule: maintain_a_sound_infrastructure
    last_audited: "2026-08-05"
    last_audited_commit: "8c622f888df8"

