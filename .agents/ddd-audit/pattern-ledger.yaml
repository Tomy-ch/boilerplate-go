  - id: specification
    name: Specification
    part: 3
    scope: core
    status: interpreted
    verdict: 逸脱宣言あり(スコープ外)
    gap: >-
      パターン名はコーパスに現れない（`specification` の語は全て OpenAPI 仕様書・scaffold 仕様書の
      同音異義）が、selection の中核——基準はドメインの語彙で持ち、実行と射影だけを QueryService /
      ReadModel へ最適化する——は domain README の Query and Aggregate 節で解釈済み。読み取り経路が
      集約を迂回してよいこと、全件を FindByID で再構築し直さないことも Evans の想定どおり。
      規約は宣言されていたが守られていなかった。業務語彙を持つ絞り込み条件の定義が SQL の WHERE 句に
      しか存在せず（1 つの基準が複数のクエリで別々に著作され、その一部は QueryService 経路）、
      ドメインが持っていたのは判定に使う値だけだった。集約に述語を置いて定義の持ち主とし、
      SQL をその実行形と位置づけ、Usecase が返却行を述語で検証する形に是正済み。
      規約を迂回させていた「WHERE を通った行では自明に真だからドメイン側の述語は冗長」という論法への
      反証と、基準か機構かの判別も同節に明記した。
      3 用途のうち validation は解釈済みへ変わった。usecase README の Verifying infrastructure against
      the domain 節が双方向の突き合わせを規定し（書き込みは Repository 経由で再読込して集約に再検証させ、
      読み取りは返却エンティティをドメイン述語で検査し、外れた行はドリフトとしてエラーにする。黙って
      落とすことは禁じる）、ADR-0034 (commandservice-atomicity-criterion) の決定 5 がロック取得後の集約に対してドメイン述語で条件成立を
      判定させる——集約横断ならその述語は Domain Service に置き、ロック用 Repository メソッドは bool でなく
      集約を返す——と定めている。後者は「変更時点でオブジェクトが基準を満たすか判定する」という
      Evans の validation 用途そのもの。集約側の述語も実在し、SQL 側にはそれが実行形である旨の注記が
      付いている。
      QueryService 経由の読み取りが一律にレビュー依存だった残差は解消した。同節は「射影かどうか」ではなく
      「基準が加算的か減算的か」で線を引き直し、返ってくる行についての基準は射影でも述語が要求する
      フィールドを載せて検証することを義務づけ、レビュー依存を除外系の基準に限定したうえで、その限定に
      「取り除かれた行は結果に存在せず不在は観測できない」という論理的根拠を与えている。集計を返す
      QueryService でも、対象が返却行に現れる基準は値に対する述語へ寄せ、Usecase が突き合わせる形にした。
      減算的な基準——集計から特定の状態の行を除外するもの——の著作もドメインへ戻した。集約に述語を置いて
      定義の持ち主とし、判定は source of truth の状態だけを見る。SQL が絞る列との等価は再構築時の
      不変条件が強制し、DB 行からの組み立ては Reconstruct が唯一の入口、書き込みも両者を同一 UPDATE で
      更新するため、片方だけが動く経路が無い。該当するクエリには述語の実行形である旨と、減算的につき
      呼び出し側では照合できずテストが退行を固定する旨を注記した（usecase README が課す要件）。
      残る差異は 2 点で、どちらも宣言済み。building to order（基準からオブジェクトを組み立てる）用途への
      言及が無いこと、述語オブジェクトとしての合成（isSatisfiedBy + AND/OR/NOT）を採らないこと。
      Query and Aggregate 節末尾の Departure from Evans ブロックが、この 2 つは「基準を具象化しない」という
      同じ根を共有するため揃って欠けるのだと説明し、代償（1 つの基準が複数のクエリへ分散著作される）と、
      具象化を再検討する条件（API 面が列挙しない絞り込みを呼び出し側が組み立てる / 規則がテナント・契約で
      変わりデータとして運ばれる / クライアントが必要は述べられても何を作るかは述べられない）を明記している。
    interpreted_by:
      - kind: readme
        path: internal/domain/README.md
        section: "Query and Aggregate"
      - kind: readme
        path: internal/usecase/README.md
        section: "Verifying infrastructure against the domain"
      - kind: doc
        path: docs/rules.md
        section: "Domain Layer Constraints"
      - kind: adr
        id: "0036"
        slug: ordered-pessimistic-row-locks
    deviation_declared: true
    deviation_note: >-
      Evans は基準を isSatisfiedBy と AND / OR / NOT を持つ第一級のオブジェクトとして具象化し、
      validation・selection・building to order の 3 用途に用いる。本リポジトリは基準を具象化せず、
      値の所有者に張り付いた名前付きの述語として、評価される場所で直接評価する。この 1 つの選択が
      3 用途を分ける。validation と selection は基準に名前と単一の定義があれば足りるので述語で成立するが、
      composition と building to order はどちらも基準を他へ渡すこと——翻訳する Repository か、満たす
      Factory か——を前提とするため、具象化なしには到達できない。2 つが揃って欠けているのは根が同じだから。
      理由は 3 つ。基準をその場で評価する限り Go の && と || が結合子として働き、合成が欠けるのは
      基準が移動しなければならなかった場所だけであること。変更を守る述語は bool でなく型付きエラーを返し、
      その identity から応答ステータスが導かれるため（ADR-0045 (immutable-fail-fast-config)）、合成された isSatisfiedBy はそれを潰すこと。
      クエリを静的 SQL に保つことで実スキーマに対する型検査が効き続けること。代償として複合的な基準は
      クエリごとに書き直される。
      宣言は internal/domain/README.md の Query and Aggregate 節末尾、Departure from Evans ブロック。
    enforced_by: []
    last_audited: "2026-08-06"
    last_audited_commit: "cd254c46a1c2"

