services:
# -------------------------------------
# 開発環境のサービス
# -------------------------------------
  api_server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: tooling
      secrets:
        - github_token
    ports:
      # 採番は docs/maintenance/local-environment.md「Host port allocation」。スロット毎にずらすのは
      # 複数 worktree で同時に make serve するためで、コンテナ内部は動かさない。
      - "${API_HOST_PORT:-8080}:8080"   # APIポート
      - "${DLV_HOST_PORT:-2345}:2345"   # デバッグ(dlv)ポート
      - "${PPROF_HOST_PORT:-6060}:6060" # メトリクス(pprof)ポート
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
# sample-api:begin
    # 実行時 env は env/.env より優先されるため、local だけがキューへ向く。判別子を env/.env
    # ではなくここに置くのは、環境差の宣言（env/README.md の Per-environment value）が削除後に
    # 陳腐化する一方、Markdown の表では replace マーカーで差し替えられないため。
    environment:
      OUTBOX_PUBLISHER: sqs
# sample-api:end
    tty: true
    stdin_open: true
    working_dir: /app
    depends_on:
      database:
        condition: service_healthy
      mock_auth_server:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage_init:
        condition: service_completed_successfully
    healthcheck:
      # パスは runtime ステージの HEALTHCHECK（docker/server/Dockerfile）と同じ /health に揃える。
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      # ホットリロードの再ビルド中は /health が落ちるため、短くすると保存のたびに unhealthy へ振れる。
      # retries × interval は make serve が起動失敗を報告するまでの上限でもある（.makefiles/app/server.mk）。
      retries: 10
      # air の初回ビルドを吸収する。Go のビルドキャッシュはコンテナ寿命なので、コンテナを
      # 作り直すたびコールドビルドになる。
      start_period: 90s
    profiles:
      - development

  database: # PostgreSQLデータベース
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    ports:
      # 固定ポートを持つ共有インフラ（database / observability / garage）は、全 checkout が
      # 単一プロジェクト gobp-shared の 1 インスタンスを共有する。worktree の並列化は
      # per-worktree のデータベース（wt<N>_local / wt<N>_test）で行う（cmd/db-slot）。
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/database/sql:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # DB 側の timezone はこの 2 変数だけが供給する（CI の postgres service と同じ機構）。
      # TZ は initdb 時にしか効かないため、既存 volume では作り直しまで反映されない。
      # 機構と変更手順は env/README.md の Changing the Timezone を参照。
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    user: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - database
      - tools

  observability:
    image: grafana/otel-lgtm:0.30.0@sha256:46ca028e294bd728e8e930a28e887f640a8f2a9533cc283f79bcc6ab73d2ffd8
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # Tempo API（任意・スクリプト確認用）
    profiles:
      - development

  mock_auth_server: # 疑似 OIDC 認証サーバー（開発用。実 IdP の差し替え先）
    image: ghcr.io/navikt/mock-oauth2-server:6.0.0@sha256:b9fa251aefee22a97c32534d23a1c400f01dbd483ab263b013d89f6d60d96691
    ports:
      # 採番は docs/maintenance/local-environment.md「Host port allocation」。スロット毎にずれる。
      - "${MOCK_AUTH_HOST_PORT:-2010}:4000"
    environment:
      # iss はトークン取得時の Host から導出されるため env で固定しない（docker/README.md の
      # mock-auth-server 節）。JWKS 取得だけは Go 側が ENDPOINT_JWKS でコンテナ名を内部解決する。
      SERVER_PORT: "4000"
      JSON_CONFIG_PATH: /etc/mock-oauth2-server/config.json
      LOG_LEVEL: INFO
    volumes:
      # 発行するトークンの契約（issuerId / typ=at+jwt / aud / sub）は config.json が持つ。
      - ./docker/mock-auth-server/config.json:/etc/mock-oauth2-server/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/isalive"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - auth

  garage: # S3 互換オブジェクトストレージ（ローカル開発用。テストは gofakes3 in-process を使う）
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    entrypoint: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "3900:3900" # S3 API
      - "3902:3902" # Web API（匿名 read の公開配信）
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - tools

  garage_init: # Garage の初期プロビジョニング（レイアウト / バケット / アクセスキー・冪等・one-shot）
    build:
      context: docker/garage
    entrypoint: ["/bin/sh", "/usr/local/bin/garage-init.sh"]
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      # イメージに焼かずマウントで渡し、再ビルド忘れで古いプロビジョニングが走るのを避ける。
      - ./docker/garage/init.sh:/usr/local/bin/garage-init.sh:ro
      # garage server が生成したノード鍵を CLI が読むため meta を共有する。
      - garage_meta:/var/lib/garage/meta
    # バケット / アクセスキーは Go 側と同一の値でなければならないため、値を再掲せず env/.env を直接渡す。
    env_file:
      - env/.env
    restart: "no"
    profiles:
      - development
      - tools

  elasticmq: # SQS 互換ブローカー（ローカル開発用。テストは in-process の fake を使う）
    image: softwaremill/elasticmq-native:1.6.16@sha256:8383f29ad746c12981ca2128f689a4b4a93815235f1a7851d2f165316503d132
    ports:
      - "9324:9324" # SQS API
    volumes:
      # キューと DLQ の定義。起動時に読まれるため初期化用の one-shot コンテナは持たない。
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      # SQS API ポートの受付可否だけを見る。ListQueues を叩くと空レスポンスとの区別が付かず、
      # 起動直後のキュー作成完了を待てないため、接続可否を判定に使う。
      test: ["CMD", "nc", "-z", "localhost", "9324"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - tools

  dynamodb_init: # dynamodb_local の data volume の所有者を合わせる one-shot（冪等）
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    # image は非 root（dynamodblocal）で動くが /home/dynamodblocal/data を持たないため、named volume は
    # root 所有で作られて java が書けない。本体を root で動かす代わりに、所有者合わせだけをここへ切り出す
    # （garage_init と同じ形）。
    user: root
    entrypoint: ["sh", "-c", "chown dynamodblocal:dynamodblocal /home/dynamodblocal/data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    restart: "no"
    profiles:
      - development
      - tools

  dynamodb_local: # DynamoDB 互換ストア（Realtime Delivery の EventLog / StreamTicket / InstanceLease。ローカル開発用）
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    # image 既定の -inMemory は再起動で table が消えるため、./data（WorkingDir /home/dynamodblocal 相対）へ
    # 永続化する。-sharedDb は region / credential によらず単一の DB を見せる設定で、checkout 間の分離は
    # table 名の prefix で行う（docs/design/realtime-delivery.md）。
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data", "-disableTelemetry"]
    depends_on:
      dynamodb_init:
        condition: service_completed_successfully
    ports:
      - "8000:8000" # DynamoDB API
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      # nc / wget が無く curl だけがあるため curl で API ポートの受付可否を見る。/ は 400 を返すので
      # -f は付けず、接続できたことだけを判定に使う。
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - tools

  goaws: # SNS / SQS 互換エミュレータ（Realtime Delivery の instance fan-out 用。Worker 側の elasticmq とは分離）
    image: admiralpiett/goaws:v0.5.4@sha256:18589afe16517751cc981354536c148854157a718bee9059494d6cdee3dc4e2d
    # 設定ファイルの環境名（Local）は positional で渡す。topic / queue は application が実行時に作るため
    # 事前宣言しない（elasticmq と違い、起動時に読むのは port / region / account だけ）。
    command: ["-config", "/app/conf/goaws.yaml", "Local"]
    ports:
      - "4100:4100" # SNS / SQS API（1 ポートで両方を受ける）
    volumes:
      - ./docker/goaws/goaws.yaml:/app/conf/goaws.yaml:ro
    healthcheck:
      # elasticmq と同じく API ポートの受付可否だけを見る。
      test: ["CMD", "nc", "-z", "localhost", "4100"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - tools

# -------------------------------------
# 補助サービス
# -------------------------------------

  docs_server: # 開発用ドキュメント配信（docs/ を nginx で配る）
    build:
      context: .
      dockerfile: docker/document/Dockerfile
      target: document_viewer
    ports:
      # 採番は docs/maintenance/local-environment.md「Host port allocation」。
      - "2001:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    profiles:
      - tools

  sql_editor:
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    ports:
      # pgweb 既定の 8081 は API スロット帯と重なるためホスト側では採らない（採番は上記リンク先）。
      - "2000:8081"
    environment:
      DATABASE_URL: postgres://postgres:postgres-password@database:5432/local?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - tools
      - database

  er_diagram_generator: # ER図生成ツール
    image: schemaspy/schemaspy:7.0.2@sha256:c8f98116a5cfe4b00b379eeb23b2022cdea4c9192cbccb843a75049e752479b7
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # 採番は docs/maintenance/local-environment.md「Host port allocation」。
      - "2002:3000"
    volumes:
      - ./docker/database/schemaspy/schemaspy.properties:/schemaspy.properties
      - ./docs/er-diagram:/output
    profiles:
      - generate

# -------------------------------------
# ツールランナー
# user: root は必須。mise を /root 配下に配置しており、非 root では mise/各ツールを解決できないため。
# bind mount 経由の生成物は root 所有になるが、pkg/*/mock 等と同様に容認している。
# -------------------------------------

  go_tool_runner: # Goベースツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: go_tools
      secrets:
        - github_token
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

  node_tool_runner: # Node.jsベースのツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: node_tools
      secrets:
        - github_token
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      # node_modules を匿名ボリュームで保持（バインドマウントの shadow 回避）
      - /app/scripts/node_modules
      # docs-viewer も同様。host（darwin）が解決した vite / rolldown のバイナリは
      # コンテナ（linux）では実行できないため、バインドマウント越しに見せない
      - /app/docs-viewer/node_modules
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

  python_tool_runner: # Pythonベースのツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: python_tools
      secrets:
        - github_token
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

secrets:
  # mise のツール解決を認証付きにするビルド時トークン。build-arg と違いイメージ履歴に残らない。
  github_token:
    environment: GITHUB_TOKEN

volumes:
  pg_data:
    external: false
  garage_meta:
    external: false
  garage_data:
    external: false
  dynamodb_data:
    external: false
