# 権威あるゲート。make go-lint / make go-fix と CI が --config で明示的に指す。暗黙探索の既定でもあるため、
# 設定を指定しないツールはこの最も厳しい集合を得る。
# 3 者の関係: .golangci-min.yaml（保存時）⊆ .golangci-fast.yaml（チェックポイント）⊆ 本ファイル（ADR-0088）。
version: "2"

linters:
  default: none
  enable:
    # Enabled by Default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Disabled by Default
    # - arangolint # ArangoDBクライアントの推奨される使い方をチェックします
    - asasalint # ユニバーサルインターフェースを扱うときの潜在的なバグを防ぐチェックです
    - asciicheck # ASCII以外の文字を変数名などで使用しているかをチェックします
    - bidichk # バイディレクショナルテキストのチェックをします
    - bodyclose # HTTPレスポンスのボディが閉じられているかをチェックします
    - canonicalheader # HTTPヘッダーの正規化をチェックします
    # - clickhouselint # ClickHouseのネイティブGoドライバAPIの典型的な誤用を検出します
    - containedctx # context.Contextが構造体に含まれているかをチェックします
    - contextcheck # context.Contextの伝播が破棄されていないかをチェックします
    - copyloopvar # ループ変数のコピーをチェックします
    # - cyclop # 関数+パッケージ単位での複雑度を計算します
    - decorder # constやvarなどの宣言順序をチェックします
    - depguard # 外部ライブラリの使用を制限します
    - dogsled # _ が複数使用されているかをチェックします
    - dupl # 重複コードの検出を行います
    - dupword # 重複した単語を検出します
    - durationcheck # time.Duration型同士を掛け算してしまう誤用を静的分析で検出する
    - embeddedstructfieldcheck # 埋め込み構造体フィールドの配置をチェックします
    # - err113 # エラーチェックのベストプラクティスかをチェックします（pkg/xerrors 自身のテストは被験体として素の errors.New を作るため引っかかる）
    - errchkjson # JSON エンコーディングに関する安全性をチェックします
    - errname # エラー名の命名規則をチェックします
    - errorlint # エラー処理のベストプラクティスをチェックします
    - exhaustive # enum型の全ての値を網羅しているかをチェックします
    # - exhaustruct_v5 # 構造体のフィールドが全て初期化されているかをチェックします
    - exptostd # 標準ライブラリの使用を推奨します
    - fatcontext # context.Contextがループで設定されているかをチェックします
    - forbidigo # 識別子の使用禁止ルールを設定します
    - forcetypeassert # チェックなしの型アサーション(panicの恐れ)を検出します
    - funcorder # 構造体に関連する関数・メソッドの配置順序をチェックします
    - funlen # 関数の長さを制限して、冗長性と複雑さを減らします
    # - ginkgolinter # Ginkgo/Gomegaのテストのベストプラクティスをチェックします
    - gocheckcompilerdirectives # // go:ディレクティブのチェックを行います
    # - gochecknoglobals # グローバル変数の使用をチェックします
    - gochecknoinits # init() 関数が存在しないかを検出します
    - gochecksumtype # 合併型／タグ付き列挙型の網羅性を静的にチェックします
    - gocognit # 人間の理解難度を測る指標として、関数・メソッドの認知的複雑度を算出します
    # - goconst # 定数の使用を推奨します
    - gocritic # Goコードの高級な静的解析を行います
    - gocyclo # 関数単位での複雑度を計算します
    - godoclint # godocの記法・作法をチェックします
    # - godot # Goのコメント末尾に必ずピリオドをつけるスタイルをチェックする静的解析ツール
    # - goheader # Goファイルのヘッダーコメントをチェックします
    # - gomoddirectives # go.modファイルのディレクティブをチェックします
    # - gomodguard_v2 # go.modの直接依存に対する許可・禁止リストをチェックします
    - goprintffuncname # Printfライクな引数を取る関数が「f」で終わる名前になっているかをチェックします
    - gosec # セキュリティ上の脆弱性を検出します
    # - gosmopolitan # i18n（国際化）やlocale（地域対応）の落とし穴になりやすいアンチパターンを検出します
    - grouper # const/var/import等のグループ化スタイルをチェックします
    - iface # インターフェースの不適切な使用を検出します
    - importas # import文のエイリアスの一貫性を強制します
    - inamedparam # インターフェースのメソッド定義において「名前なしパラメータ」が使われていないかを検出します
    - interfacebloat # 1つのインターフェースにメソッドが多すぎる場合に警告を出します
    - intrange # 書き換えられる“for”ループ構造を検出し、最適な書き方を提案します
    - iotamixing # constブロック内でiotaと非iota宣言が混在していないかをチェックします
    # - ireturn # 関数がインターフェースを返していないかを検出します
    - lll # 行の長さを制限します
    - loggercheck # ログ呼び出しでキーと値の奇数組合せを静的に検出し、もし不一致があれば警告を出します
    # - maintidx # メンテナンス性の低いコードを検出します
    - makezero # make()でのスライス初期化に関するバグを防ぐためのチェックを行います
    - mirror # 文字列とバイトスライスの変換を最適化するパターンを検出します
    - misspell # スペルミスを検出します
    - mnd # マジックナンバーの使用を検出します
    - modernize # モダンなGo言語・標準ライブラリ機能への簡素化を提案します
    - musttag # Marshal/Unmarshalする際に、エクスポート対象フィールドにタグがついていないことを検出します
    - nakedret # naked returnを使う関数が一定の長さを超えていないかを検出します
    - nestif # ネストされたif文の深さを制限します
    - nilerr # エラーチェックでnilが返されているかを検出します
    - nilnesserr # 正しいエラーが返されているかを検出します
    - nilnil # nilのエラーと無効な値(nil)を同時に返していないかを検出します
    # - nlreturn # 関数の戻り値がnilnilなどの冗長な値を返していないかを検出します
    - noctx # context.Contextを使用していない非推奨なコードを検出します
    # - noinlineerr # エラーを返す関数がインライン化されていないかを検出します
    - nolintlint # nolintコメントの使用をチェックします
    - nonamedreturns # 名前付きリターン値を全部検出して警告します
    - nosprintfhostport # IPv6 アドレスを含むホスト名とポートの文字列化にfmt.Sprintfを使っていないかを検出します
    - paralleltest # テスト関数が並列実行(t.Parallel)されているかを検出します
    - perfsprint # fmt.Sprintfのパフォーマンスに関する問題を検出します
    - prealloc # スライスの事前割り当てを推奨します
    - predeclared # 予約語の使用をチェックします
    # - promlinter # Prometheusのメトリクスに関するベストプラクティスをチェックします
    # - protogetter # Protocol BuffersのGetterメソッドの使用をチェックします
    - reassign # グローバル変数の再代入を検出します
    - recvcheck # 関数のレシーバーが統一的に使用されているかをチェックします
    - revive # Goコードの静的解析を行うツールで、特にコードの品質とスタイルに焦点を当てています
    - rowserrcheck # sql系のインスタンスで、行の取得やエラー処理が正しく行われているかをチェックします
    # - sloglint # ログの書き方をスタイル的観点で静的チェックします
    - spancheck # OpenTelemetryのSpanの使用をチェックします
    - sqlclosecheck # SQLの接続やトランザクションのクローズ処理をチェックします
    # - tagalign # 構造体タグの整列をチェックします
    - tagliatelle # 構造体タグのスタイルをチェックします
    - testableexamples # Example関数の末尾に出力内容に関するコメントがあるかをチェックします
    - testifylint # Testifyのアサーションやモックの使用をチェックします
    # - testpackage # テストパッケージを作成することで、ブラックボックステストを行うことを推奨します
    - thelper # テストヘルパー関数がt.Helper()を呼んでいるかを検出します
    - tparallel # テスト関数の不適切なt.Parallel使用を検出します
    - unconvert # 型が既に同じなのに再度キャストしている冗長コードを検出します
    - unparam # 使用されていない関数のパラメータを検出します
    - unqueryvet # SQLクエリ/ビルダー内のSELECT *を検出し、明示的なカラム指定を促します
    - usestdlibvars # 標準ライブラリの変数を使用しているかをチェックします
    - usetesting # テストコードで誤った標準ライブラリの関数を使っていないかを検出します
    # - varnamelen # 変数名の長さを制限します
    - wastedassign # 不要な代入を検出します
    - whitespace # 不要な空白を検出します
    # - wrapcheck # エラーメッセージのラップをチェックします
    # - wsl_v5 # コード中の空行（改行）の追加・削除に関するルール整備を行うツール
    # - zerologlint # zerolog の使い方において間違いや抜けを防止するための静的解析ツール

  settings:
    staticcheck:
      checks:
        - all
    decorder:
      dec-order:
        - "const"
        - "var"
        - "type"
        - "func"
      ignore-underscore-vars: false
      disable-dec-order-check: false
      disable-init-func-first-check: false
    depguard:
      # pkg/ の薄いラッパー経由での利用を強制する規則群（方針の理由: ADR-0001 (avoid-lock-in)）。
      rules:
        only_the_original_error_is_permitted:
          files:
            - "**/*.go"
            - "!**/pkg/xerrors/**.go" # pkg/xerrors配下ではアプリケーション全体で使用するエラーラッパーを実装するため許可します
          list-mode: lax
          deny:
            - pkg: github.com/cockroachdb/errors
              desc: "スタックトレース用として導入したライブラリです。
                代わりに pkg/xerrors を使用してください。"
            - pkg: errors
              desc: "標準の errors パッケージは直接使用しないでください。
                pkg/xerrors の New / Wrap / Join / Is / As を使用してください。"
        only_the_original_uuid_is_permitted:
          files:
            - "**/*.go"
            - "!**/pkg/uuid/**.go" # pkg/uuid配下ではアプリケーション全体で使用するuuidライブラリのラッパーを実装するため許可します
            - "!**/internal/infrastructure/rdb/conv/**.go" # conv配下ではORMの型変換のためuuidライブラリの使用を許可します
          list-mode: lax
          deny:
            - pkg: github.com/google/uuid
              desc: "uuid作成用として導入したライブラリです。
                代わりに pkg/uuid を使用してください。"
        discourage_reflect: # reflect の使用を原則禁止します（型安全性・可読性のため）
          files:
            - "**/*.go"
            - "!**/*.gen.go" # 生成物(gomock 等)は reflect を用いるため除外します
          list-mode: lax
          deny:
            - pkg: reflect
              desc: "reflect は原則使用しないでください（型安全性・可読性を損なうため）。
                必要な場合は設計を見直し、個別に相談してください。"
        # アプリケーションの健全性を保つためのルール
        reject_go_toolchain_packages: # go/ 配下のコンパイラ/ツールチェーン向けパッケージの使用を禁止します
          files:
            - "**/*.go"
            - "!**/scripts/**.go" # コード生成ツールでは go/format・go/token 等の正当な用途があるため許可します
          list-mode: lax
          deny:
            - pkg: go/
              desc: "go/constant・go/ast・go/types 等の go/ 配下パッケージはコンパイラ/ツールチェーン向けであり、
                アプリケーションコードでは使用しないでください。定数値等は個別に定義してください。"
        reject_dangerous_os: # os系のライブラリの使用を禁止します
          files:
            - "**/*.go"
            - "!**/cmd/**.go" # アプリケーションのエントリポイントでは、終了制御を行うためosの使用を許可します
            - "!**/internal/cli/**.go" # CLIを扱う箇所では、ファイル操作などが必要なためosの使用を許可します
            - "!**/internal/config/**.go" # システムの環境変数を扱う箇所では、ブートストラップの環境変数を取得するためにosの使用を許可します
            - "!**/scripts/**.go" # スクリプトを扱う箇所では、ファイル操作などが必要なためosの使用を許可します
            - "!**/pkg/fs/**.go" # ファイルシステム操作の薄いラッパーのため os の使用を許可します
            - "!**/pkg/exec/**.go" # 外部プロセス実行の薄いラッパーのため os/exec の使用を許可します
            - "!**/pkg/envutil/**.go" # 環境変数操作の薄いラッパーのため os の使用を許可します
          list-mode: lax
          deny:
            - pkg: os
              desc: "configとcli、scriptsディレクトリ以外でのos系のライブラリの使用は破壊的な副作用を招くため禁止です。"
        restrict_the_use_of_cli: # cliパッケージの使用を限定します
          files:
            - "**/*.go"
            - "!**/cmd/**.go" # アプリケーションのエントリポイントではcli化ライブラリの使用を許可します
            - "!**/internal/cli/**.go" # CLIを扱う箇所ではcli化ライブラリの使用を許可します
          list-mode: lax
          deny:
            - pkg: github.com/spf13/cobra
              desc: "CLI化ライブラリの使用は制限されています。
                可能な限り、CLI化ライブラリを追加で使用しない実装を心がけてください。"
        restrict_the_use_of_di_container: # DIコンテナの使用を制限します
          files:
            - "**/*.go"
            - "!**/internal/di/**.go" # DIコンテナを扱う箇所では使用を許可します
          list-mode: lax
          deny:
            - pkg: go.uber.org/fx
              desc: "DIコンテナライブラリの使用は制限されています。
                可能な限り、DIコンテナを追加で使用しない実装を心がけてください。"
        restrict_the_use_of_zap_logger: # zapロガーの使用を制限します
          files:
            - "**/*.go"
            - "!**/internal/logging/**.go" # loggingパッケージではロガーの初期化を行うため使用を許可します
          list-mode: lax
          deny:
            - pkg: go.uber.org/zap
              desc: "zapロガーライブラリの使用はlogging/のみに制限されています。
                可能な限り、ロギングライブラリを追加で使用しない実装を心がけてください。"
        restrict_the_use_of_observability: # オブザーバビリティ関連パッケージの使用を制限します
          files:
            - "**/*.go"
            - "!**/internal/observability/**.go" # オブザーバビリティの初期化箇所では使用を許可します
          list-mode: lax
          deny:
            - pkg: go.opentelemetry.io/otel
              desc: "オブザーバビリティ関連ライブラリの使用は制限されています。
                可能な限り、オブザーバビリティ関連ライブラリを追加で使用しない実装を心がけてください。"
        restrict_the_use_of_otel_instrumentation: # OTel 計装ライブラリ(contrib / Echo 公式)の使用を制限します
          files:
            - "**/*.go"
            - "!**/internal/observability/**.go" # otel 初期化(exporter / runtime 計装)で使用を許可します
            - "!**/internal/controller/httpstack/observability/**.go" # HTTP層の OTel ミドルウェア統合で使用を許可します
          list-mode: lax
          deny:
            - pkg: go.opentelemetry.io/contrib
              desc: "OTel contrib ライブラリの使用は observability の初期化 / HTTP otel ミドルウェアに限定されています。
                可能な限り、オブザーバビリティ関連ライブラリを追加で使用しない実装を心がけてください。"
            - pkg: github.com/labstack/echo-opentelemetry
              desc: "Echo の OTel 計装ライブラリの使用は HTTP otel ミドルウェアに限定されています。
                可能な限り、オブザーバビリティ関連ライブラリを追加で使用しない実装を心がけてください。"
        restrict_lifecycle_to_di: # di 層外からの lifecycle.Registrar への参照を禁止する
          files:
            - "**/*.go"
            - "!**/internal/di/**.go" # di 配下(composition root / module / hook)でのみ使用を許可します
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/di/lifecycle
              desc: "lifecycle.Registrar への直接依存は di 層の責務です。
                コンポーネントは Close()/Shutdown() 等のハンドルを公開し、その登録は di の hook に委ねてください。"
        restrict_di_hook_to_di: # di 層外からの di hook パッケージへの参照を禁止する
          files:
            - "**/*.go"
            - "!**/internal/di/**.go" # di 配下(module / composition root)でのみ参照を許可します
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/di/server/hook
              desc: "di の hook パッケージは di 層の内部実装です。コンポーネントから直接参照せず、結線は di 層で行ってください。"
            - pkg: go-boilerplate/internal/di/job/hook
              desc: "di の hook パッケージは di 層の内部実装です。コンポーネントから直接参照せず、結線は di 層で行ってください。"
        independent_apperror: # apperrorパッケージが責務の実装層にも依存しないことを保証します
          files:
            - "**/internal/apperror/**.go"
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/domain/
              desc: "apperrorパッケージは他のdomain層に依存してはいけません。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "apperrorパッケージは他のusecase層に依存してはいけません。"
            - pkg: go-boilerplate/internal/controller/
              desc: "apperrorパッケージは他のcontroller層に依存してはいけません。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "apperrorパッケージは他のinfrastructure層に依存してはいけません。"
        independent_cli: # cliパッケージが責務の実装層にも依存しないことを保証します
          files:
            - "**/internal/cli/**.go"
          list-mode: lax
          # depguard の pkg は正規表現ではなく prefix 一致。lax では deny に当たっても、より長い allow の prefix が
          # 当たれば通るので、driver の例外は allow 側に長い prefix として置く（deny に否定先読みを書いても何も検出しない）。
          allow:
            - go-boilerplate/internal/infrastructure/rdb/driver
          deny:
            - pkg: go-boilerplate/internal/domain/
              desc: "cliパッケージは他のdomain層に依存してはいけません。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "cliパッケージは他のusecase層に依存してはいけません。"
            - pkg: go-boilerplate/internal/controller/
              desc: "cliパッケージは他のcontroller層に依存してはいけません。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "cliパッケージは他のinfrastructure層に依存してはいけません。ただし、rdb/driver 配下のものは、コマンド実装のために必要な場合があるため例外とします（allow 側で許可）。"
            - pkg: go-boilerplate/internal/di
              desc: "cliパッケージはDIコンテナ(internal/di)に依存してはいけません。DIの結線は cmd 層で行います。"
        independent_config: # configパッケージが責務の実装層にも依存しないことを保証します
          files:
            - "**/internal/config/**.go"
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/domain/
              desc: "configパッケージはdomain層に依存してはいけません。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "configパッケージはusecase層に依存してはいけません。"
            - pkg: go-boilerplate/internal/controller/
              desc: "configパッケージはcontroller層に依存してはいけません。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "configパッケージは他のinfrastructure層に依存してはいけません。"
        independent_logging: # loggingパッケージが責務の実装層にも依存しないことを保証します
          files:
            - "**/internal/logging/**.go"
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/domain/
              desc: "loggingパッケージは他のdomain層に依存してはいけません。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "loggingパッケージは他のusecase層に依存してはいけません。"
            - pkg: go-boilerplate/internal/controller/
              desc: "loggingパッケージは他のcontroller層に依存してはいけません。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "loggingパッケージは他のinfrastructure層に依存してはいけません。"
        independent_pkg: # pkgディレクトリが他の内部パッケージに依存しないことを保証します
          files:
            - "**/pkg/**.go"
            # testkit サブパッケージ（テスト補助）は親 pkg を import してよい。production から参照されず、
            # testing パッケージを本体バイナリから隔離するための seam であるため独立性の対象外とする。
            - "!**/pkg/**/testkit/**.go"
          list-mode: lax
          allow:
            # pkg 配下からの参照のみ例外的に許可します。
            - go-boilerplate/pkg/xerrors
          deny:
            - pkg: go-boilerplate/internal/
              desc: "pkgディレクトリはinternalディレクトリから独立している必要があります。
                internalディレクトリを参照することは禁止です。"
            - pkg: go-boilerplate/pkg/
              desc: "pkgディレクトリは他のpkgディレクトリから独立している必要があります。
                他のpkgディレクトリを参照することは禁止です。"
        # 責務の侵食崩壊を防ぐためのルール
        #
        # domain層では外部ライブラリの直接使用を全面的に禁止し、pkg経由での使用を強く推奨します。
        # 緩める場合はそのライブラリが陳腐化しにくいか、メンテナンスコストが低いかかつ必要性が高いかを考慮してください。
        # 例： Decimal系のライブラリなど
        maintain_a_sound_domain:
          files:
            - "**/internal/domain/**.go"
            # ドメインサービス（internal/domain/service/**）は下の maintain_a_sound_domain_service が受け持つ。
            # 両ルールが同じファイルに当たると、こちらの集約間 deny が例外を打ち消してしまう。
            - "!**/internal/domain/service/**.go"
          list-mode: lax
          deny:
            # 集約間の直接結合の禁止は、ここではなく internal/architest の
            # TestDomainAggregateImportIsolation が受け持つ。depguard は importer を files でしか
            # 見られず allow / deny は imported しか見ないため、「自分の集約の internal/ 配下だけは
            # 許す」という 2 端点の関係を 1 本のルールで書けない（sub-entity のパッケージが
            # 書けなくなる）。規約の本文は internal/domain/README.md の Cross-aggregate reference。
            - pkg: net/http
              desc: "Domain層でhttpパッケージを直接使用しないでください。
                handler層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: github.com/labstack/echo/v5
              desc: "Domain層でechoパッケージを直接使用しないでください。
                handler層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: database/sql
              desc: "Domain層でdatabase/sqlパッケージを直接使用しないでください。
                infrastructure層にて処理して、コンストラクタに受け渡してください。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "domain層でusecase層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/controller/
              desc: "domain層でcontroller層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "domain層でinfrastructure層を参照することは禁止です。"
            - pkg: go-boilerplate/pkg/fs
              desc: "domain層でファイルシステム I/O を行わないでください。FS アクセスは外側の層の責務です。"
            - pkg: go-boilerplate/pkg/exec
              desc: "domain層で外部プロセス実行を行わないでください。プロセス実行は外側の層の責務です。"
            - pkg: go-boilerplate/pkg/envutil
              desc: "環境変数の書き換えは外側の層の責務です。本層からの参照は禁止です。"
        # internal/domain/service/<name> だけは集約間の import を許可する例外。
        # 緩めるのは domain 間の import だけで、層をまたぐ deny は maintain_a_sound_domain と
        # 同一のまま再掲すること（ここを削ると例外が抜け道になる）。
        # 置き場と入場条件: internal/domain/README.md「Where a Domain Service lives」
        maintain_a_sound_domain_service:
          files:
            - "**/internal/domain/service/**.go"
          list-mode: lax
          deny:
            - pkg: net/http
              desc: "Domain層でhttpパッケージを直接使用しないでください。
                handler層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: github.com/labstack/echo/v5
              desc: "Domain層でechoパッケージを直接使用しないでください。
                handler層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: database/sql
              desc: "Domain層でdatabase/sqlパッケージを直接使用しないでください。
                infrastructure層にて処理して、コンストラクタに受け渡してください。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "domain層でusecase層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/controller/
              desc: "domain層でcontroller層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "domain層でinfrastructure層を参照することは禁止です。"
            - pkg: go-boilerplate/pkg/fs
              desc: "domain層でファイルシステム I/O を行わないでください。FS アクセスは外側の層の責務です。"
            - pkg: go-boilerplate/pkg/exec
              desc: "domain層で外部プロセス実行を行わないでください。プロセス実行は外側の層の責務です。"
            - pkg: go-boilerplate/pkg/envutil
              desc: "環境変数の書き換えは外側の層の責務です。本層からの参照は禁止です。"
        # usecase層では外界とのやり取りのライブラリの使用を禁止します。
        # それ以外のライブラリの利用は許可されます。
        # ただし、外部ライブラリの直接使用は避け、pkg経由での使用を強く推奨します。
        maintain_a_sound_usecase:
          files:
            - "**/internal/usecase/**.go"
          list-mode: lax
          deny:
            - pkg: net/http
              desc: "Usecase層でhttpパッケージを直接使用しないでください。
                handler層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: github.com/labstack/echo/v5
              desc: "Usecase層でechoパッケージを直接使用しないでください。
                handler層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: go-boilerplate/internal/controller/
              desc: "usecase層でcontroller層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "usecase層でinfrastructure層を参照することは禁止です。"
            - pkg: go-boilerplate/pkg/fs
              desc: "usecase層でファイルシステム I/O を行わないでください。FS アクセスは外側の層の責務です。"
            - pkg: go-boilerplate/pkg/exec
              desc: "usecase層で外部プロセス実行を行わないでください。プロセス実行は外側の層の責務です。"
            - pkg: go-boilerplate/pkg/envutil
              desc: "環境変数の書き換えは外側の層の責務です。本層からの参照は禁止です。"
        # controller層では、主にHTTPリクエストを扱うライブラリの使用を許可します。
        # ただし、永続化を行うライブラリの使用は禁止します。(主にdatabase/sqlなど)
        maintain_a_sound_controller:
          files:
            - "**/internal/controller/**.go"
          list-mode: lax
          deny:
            - pkg: database/sql
              desc: "Controller層で永続化を行うライブラリを直接使用しないでください。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "controller層の責務は入出力境界です。infrastructure層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/domain/
              desc: "controller層の責務は入出力境界です。domain層の情報にアクセスすることは禁止です。
                出力する値は必ずDTOなどを介して受け渡してください。"
        # infrastructure層では、主に永続化を行うライブラリの使用を許可します。
        # ただし、HTTPリクエストを扱うライブラリの使用は禁止します。(主にnet/httpなど)
        # net/http 全面 deny の本来の趣旨は「infra で HTTP ハンドラ(inbound)を定義させない」ことです。
        # 外部送信(outbound)専用の resilient HTTP client substrate はハンドラを定義しないため、
        # httpclient 配下のみ本ルールから除外し、専用ルール(maintain_a_sound_outbound_http_client)で
        # echo / controller の deny を再掲して多層防御を維持します。
        maintain_a_sound_infrastructure:
          files:
            - "**/internal/infrastructure/**.go"
            - "!**/internal/infrastructure/httpclient/**.go" # outbound HTTP client substrate は net/http を許可(下の専用ルールで別途制限)
          list-mode: lax
          deny:
            - pkg: net/http
              desc: "Infrastructure層でhttpパッケージを直接使用しないでください。
                controller層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: github.com/labstack/echo/v5
              desc: "Infrastructure層でechoパッケージを直接使用しないでください。
                controller層にて処理して、DTOなどを介して値を受け渡してください。"
            - pkg: go-boilerplate/internal/controller/
              desc: "infrastructure層でcontroller層を参照することは禁止です。"
        # outbound HTTP client substrate 専用ルール。
        # net/http は許可(外部送信のため)しますが、inbound(ハンドラ)用ライブラリと controller 参照は引き続き禁止します。
        maintain_a_sound_outbound_http_client:
          files:
            - "**/internal/infrastructure/httpclient/**.go"
          list-mode: lax
          deny:
            - pkg: github.com/labstack/echo/v5
              desc: "outbound HTTP client では echo(inbound ハンドラ用)を使用しないでください。"
            - pkg: go-boilerplate/internal/controller/
              desc: "infrastructure層でcontroller層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/domain/
              desc: "汎用 substrate である outbound HTTP client は domain 層に依存してはいけません。
                domain 概念を扱うのは external gateway / repository 実装の責務です。"
        # Realtime Delivery の feature 中立性（規約①）の depguard 側。architest 側は
        # internal/architest/realtime_isolation_test.go で、両方を維持することが二重検査の前提。
        # 規約②（InstanceLeaseStore の allowlist）はシンボル単位のためここには置けない。
        # 設計理由と二重検査の意図: docs/design/realtime-delivery.md §3.1
        maintain_realtime_feature_neutrality:
          files:
            - "**/internal/usecase/boundary/realtime/**.go"
            - "**/internal/usecase/realtime/**.go"
            - "**/internal/infrastructure/eventlog/**.go"
            - "**/internal/infrastructure/streamticket/**.go"
            - "**/internal/infrastructure/instancelease/**.go"
            - "**/internal/infrastructure/realtimesecret/**.go"
            - "**/internal/infrastructure/realtime/**.go"
            - "**/internal/controller/stream/**.go"
            - "**/internal/controller/realtime/**.go"
          list-mode: lax
          # lax では deny より長い prefix の allow が勝つため、機構自身の 2 package はここで戻します。
          allow:
            - go-boilerplate/internal/usecase/boundary/
            - go-boilerplate/internal/usecase/realtime
          deny:
            - pkg: go-boilerplate/internal/domain/
              desc: "Realtime Delivery の機構側から feature の domain を参照することは禁止です。
                配送機構は feature に対して中立でなければなりません。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "Realtime Delivery の機構側から feature の usecase を参照することは禁止です。
                機構が使ってよいのは usecase/boundary 配下と usecase/realtime だけです。"
        # diコンテナのcontroller層の設定ファイルでは、internal/controller/handler配下で定義されたもののみをimport可能とします。
        configure_only_the_controller_layer:
          files:
            - "**/internal/di/controller.go"
          list-mode: strict
          allow:
            - $gostd
            - go-boilerplate/internal/controller/handler/
            - go.uber.org/fx
          deny:
            - pkg: ".*"
              desc: "controller用DIでは internal/controller/handler 配下のみ import 可能です"
        # diコンテナのinfrastructure層の設定ファイルでは、internal/infrastructure/配下で定義されたもののみをimport可能とします。
        configure_only_the_infrastructure_layer:
          files:
            - "**/internal/di/infrastructure.go"
          list-mode: strict
          allow:
            - $gostd
            - go-boilerplate/internal/infrastructure/
            - go.uber.org/fx
          deny:
            - pkg: ".*"
              desc: "infrastructure用DIでは internal/infrastructure 配下のみ import 可能です"
        # diコンテナのusecase層の設定ファイルでは、internal/usecase/配下で定義されたもののみをimport可能とします。
        configure_only_the_usecase_layer:
          files:
            - "**/internal/di/usecase.go"
          list-mode: strict
          allow:
            - $gostd
            - go-boilerplate/internal/usecase/
            - go.uber.org/fx
          deny:
            - pkg: ".*"
              desc: "usecase用DIでは internal/usecase 配下のみ import 可能です"
    dupl:
      threshold: 300
    exhaustive:
      # default節で残りのケースを処理している場合は網羅とみなします。
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: '^print(ln)?$'
          msg: "禁止：printやprintlnを使わないでください"
        - pattern: '^fmt\.Print.*$'
          msg: "禁止：本番用コードにfmt.Print*を残さないでください。
                ログ出力にはzap.Loggerを使用してください"
        - pattern: '^spew\.Dump$'
          msg: "禁止：spew.Dumpは禁止されています"
        - pattern: '^fmt\.Errorf$'
          msg: "禁止：fmt.Errorf は使用しないでください。
                pkg/xerrors の New / Wrap / Join を使用してください。"
        - pattern: '^time\.Now$'
          pkg: '^time$'
          msg: "禁止：現在時刻は clock.Clock（internal/usecase/boundary/clock）の Now() で取得してください。
                domain / usecase での time.Now() は固定時刻に差し替えられず非決定的なテストを招きます
                （本ルールは exclusions.rules で domain / usecase 層のみに限定しています）。"
        - pattern: '^time\.Local$'
          pkg: '^time$'
          msg: "禁止：time.Local は使用しないでください。設定（OS_TZ）は Go ランタイムの time.Local へ届かず、
                コンテナの TZ 次第で UTC になり得ます。タイムゾーンは config が構築した *time.Location
                （config.NewTimeLocation）を注入して受け取ってください。
                テストでも time.Local で作った期待値を time.Local で検証すると実行ホストのタイムゾーンに
                依存して常に緑になるため、time.UTC か固定の Location を使ってください。"
      analyze-types: true
    funcorder:
      constructor: true
      struct-method: true
      alphabetical: false
    funlen:
      # 関数内の行数チェックは無効にします。
      lines: -1
      # 関数内のステートメント数を制限します。
      statements: 50
    gocognit:
      min-complexity: 20
    lll:
      line-length: 150
    makezero:
      always: false
    misspell:
      locale: US
      ignore-rules:
        - "importas"
    nolintlint:
      require-explanation: true
      require-specific: true
    testifylint:
      enable-all: true
    revive:
      rules:
        - name: exported # exported な宣言にはドキュメントコメントを必須とする
          arguments:
            - "disableStutteringCheck" # 命名の stutter 検査は行わない
        - name: var-naming
          arguments:
            - []
            - []
            - [{ skipPackageNameChecks: true }] # 変数名の命名規則をチェックしますが、パッケージ名のチェックはスキップします。これにより、パッケージ名が変数名と同じ場合でもエラーにならなくなります。
    usestdlibvars:
      http-method: true        # HTTPメソッド文字列の検出（"GET" → http.MethodGet）
      http-status-code: true   # ステータスコードの検出（500 → http.StatusInternalServerError）
      time-date-month: true    # time.Month(1) の検出
      time-weekday: true       # time.Weekday(1) の検出
      time-layout: true        # time レイアウト文字列の検出
      crypto-hash: true        # crypto.Hash の検出
      default-rpc-path: true   # rpc.DefaultPath の検出
      sql-isolation-level: true # sql.IsolationLevel の検出
      tls-signature-scheme: true # tls.SignatureScheme の検出
      constant-kind: false     # go/constant.Kind への書き換えは go/ ツールチェーンパッケージ依存を招く（depguard で禁止）ため無効化します
      time-month: true         # time.Month の検出

  exclusions:
    paths:
      - vendor
      # npm が展開する依存ツリー。`flatted` のように Go 実装を同梱するパッケージがあり、
      # そこは第三者のコードなので指摘しても直せない（pnpm 側は `.pnpm` 配下で go が自ら飛ばす）。
      - node_modules
    rules:
      - path: (.+)_test\.go
        linters:
          - lll
          # bodyclose は誤検知するためテストファイルでは除外する。
          - bodyclose
      # modernize の new(expr) 置換提案は ptr_test.go では不適のため除外する。
      - path: pkg/ptr/ptr_test\.go
        linters:
          - modernize
      # time.Now の禁止（forbidigo）は domain / usecase 層でのみ適用する。
      # infrastructure は clock の具体実装を提供し、controller / di は計測・ロギング用途で time.Now() を許容する。
      - path-except: internal/(domain|usecase)/
        linters:
          - forbidigo
        text: 'time\.Now'

run:
  # 固定 timeout なし（0=無効）。予算は呼び出し元が持つ（make の GOLANGCI_LINT_TIMEOUT / CI の
  # timeout-minutes）。ここに固定秒数を置いてはいけない理由は ADR-0088 (layered-golangci-config)。
  timeout: "0s"
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true
  allow-serial-runners: true
  relative-path-mode: wd
  concurrency: 4

formatters:
  enable:
    - goimports
    - gofumpt
    - gofmt
    - golines
    - swaggo
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - "go-boilerplate"
    gofumpt:
      # extra 規則は 3 つとも有効にする。旧 extra-rules: true が意味していたのは
      # 「既定で無効な追加規則を使う」ことで、規則が個別キーへ分割された後もその意図は
      # 変わらない。1 つだけ落とすと、なぜそれが外れているのかを読み手が推測することになる。
      module-path: "go-boilerplate"
      extra:
        # 同じ型で隣接する引数をまとめる（a int, b int → a, b int）。
        group-params: true
        # 開き括弧が行末で終わる複数行の呼び出しで、閉じ括弧を独立行に置く。
        # 引数を足し引きしても差分が 1 行で済む。
        balance-calls: true
        # 名前付き返り値を持つ関数の裸の return に値を書き出す（return → return err）。
        clothe-returns: true
    golines:
      max-len: 150
      tab-len: 4
      shorten-comments: false
      reformat-tags: true
      chain-split-dots: true
  exclusions:
    paths:
      - ".*\\.gen\\.go$"
      - ".*\\.sql\\.go$"
      - ".*mock_.*\\.go$"
      - "node_modules/.*"
