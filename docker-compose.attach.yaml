# app 層の override（全 checkout / worktree 共通）。常に重ねて適用される。
# 層の分け方・共有インフラへの差し替え・スロット番号とホスト公開ポートの関係は
# docs/maintenance/local-environment.md「Compose layering (infra / app)」を参照。
services:
  api_server:
    ports: !override
      - "${API_HOST_PORT:-8080}:8080" # APIポート
      - "${DLV_HOST_PORT:-2345}:2345" # デバッグ(dlv)ポート
      - "${PPROF_HOST_PORT:-6060}:6060" # メトリクス(pprof)ポート
    depends_on: !override # 共有インフラは infra 層が先に起動済み（上記参照）
      mock_auth_server:
        condition: service_healthy
    # 共有インフラへの接続先。実行時 env が env/.env より優先されることを利用して、
    # コンテナ名前提の既定値をホスト公開ポート経由へ差し替える。
    environment:
      DB_HOST: host.docker.internal
      DB_NAME: ${DB_NAME_LOCAL:-local}
      ENDPOINT_OTLP: http://host.docker.internal:4318
      ENDPOINT_OBJECT_STORAGE: http://host.docker.internal:3900
      # SQS クライアントは BaseEndpoint を優先するため、ここを差し替えれば OUTBOX_QUEUE_URL /
      # CONSUMER_QUEUE_URL のホスト部（elasticmq:9324）は接続先の解決に使われない。
      ENDPOINT_OUTBOX_QUEUE: http://host.docker.internal:9324
      ENDPOINT_CONSUMER_QUEUE: http://host.docker.internal:9324
      # Realtime Delivery の store（dynamodb_local）も共有インフラ側。ポート 8000 は固定でスロットとは無関係。
      ENDPOINT_REALTIME: http://host.docker.internal:8000
      # fan-out（goaws）も同じく共有インフラ側。store と別に要る — SNS / SQS は別のホストに載り得るため
      # 接続先が 2 本に分かれており、片方だけ差し替えるとコンテナ名 goaws の解決に落ちる。
      ENDPOINT_REALTIME_PUBSUB: http://host.docker.internal:4100
      # GoAWS と DynamoDB Local は 1 インスタンスを全 worktree で共有するため、fan-out と store の
      # 名前空間をスロットで分ける。分けないと失効通知が窓を越えて別の窓の SSE 接続を閉じ、
      # 片方の窓が書いた stream がもう片方から見える。スロット未取得なら既定の名前のまま。
      # スロットをどう名前へ落とすかの導出は internal/cli/dbslot が持ち、ここは db-slot env が撒いた
      # 値を読むだけ（table を掃除する make 側も同じ値を読む。導出をここへ書き写すと片方だけずれる）。
      # 既定値はホスト公開ポートと同じくこちら側の責務で、スロット未取得のときの名前と一致させる。
      # 詳細: docs/maintenance/db-worktree-pool.md「Realtime Delivery emulators are shared instances」
      REALTIME_TOPIC: ${REALTIME_TOPIC:-arn:aws:sns:us-east-1:000000000000:realtime-fanout-local}
      REALTIME_QUEUE_PREFIX: ${REALTIME_QUEUE_PREFIX:-realtime-local}
      REALTIME_TABLE_SUFFIX: ${REALTIME_TABLE_SUFFIX:-local}
      # token の iss は mock 認証サーバーのホスト公開 URL（Host ヘッダ由来）。スロット毎にポートが
      # ずれるため追従させる。mock 側は iss を保持しないので、追従先はここ 1 箇所で足りる。
      AUTH_ISSUER: http://localhost:${MOCK_AUTH_HOST_PORT:-2010}/default
